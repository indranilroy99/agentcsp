provider: in_memory
cache:
  enabled: true
  type: exact_response_cache
  shared: false
  persistent: false
  write_enabled: true
  replay_enabled: false
  serve_cached_responses: false
  semantic_reuse: false
  similarity_threshold: 0.98
  cache_key_sources:
    - approved_internal_digest
  tenant_isolation: true
  namespace_isolation: true
  reuse_across_tenants: false
  key_scope: tenant_scoped_internal_cache
  include_raw_prompts: false
  include_completions: false
  include_tool_outputs: false
  include_retrieval_context: false
  include_memory: false
  include_browser_context: false
  include_secrets: false
  redaction:
    enabled: true
    pii_filter: true
    secret_filter: true
approval_required: true
