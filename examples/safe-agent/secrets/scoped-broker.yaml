provider: local_sealed_secret_aliases
endpoint: local-only
auth:
  identity: workload_identity
capabilities:
  - read
secret_paths:
  - aliases/support-readonly-token
policies:
  - readonly-secret-aliases
agent_access:
  input_sources:
    - approved_internal_task
  actions:
    - resolve_secret_alias
  prompt_context:
    materialize_secret_values: false
    inject_into_system_prompt: false
    inject_into_model_context: false
    sources:
      - approved_internal_task
    redaction:
      secrets: true
      mask_secret_values: true
  approval_required: true
data_scope:
  - internal_alias_only
