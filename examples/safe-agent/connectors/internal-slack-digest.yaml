provider: slack
api_endpoint: https://slack.com/api
oauth_scopes:
  - channels:history
  - users:read
agent_access:
  input_sources:
    - approved_digest
  actions:
    - fetch_history
    - lookup_user
  approval_required: true
destinations:
  workspace: approved-security-workspace
  recipient_allowlist:
    - approved-security-workspace
  external_shared_channels: false
  public_channels: false
  direct_messages: false
data_scope:
  - approved_digest
