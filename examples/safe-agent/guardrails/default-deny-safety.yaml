framework: openai
policy_name: internal-readonly-default-deny
inputs:
  - internal_review_summary
guardrails:
  enabled: true
  enforcement_mode: deterministic_pre_tool
  llm_judge: false
  model_reviewer: false
  self_review: false
  deterministic_policy_engine: true
  schema_enforcement: true
  allowlist_enforcement: true
  pre_tool_enforcement: true
  post_hoc_review_only: false
  prompt_injection_filter:
    enabled: true
  output_validation:
    enabled: true
  tool_result_sanitization:
    enabled: true
  content_moderation:
    enabled: true
fallback:
  default_action: deny
  on_timeout: block
  on_error: block
  enforcement_mode: enforce
runtime_authority:
  approval_required: true
  tools:
    - readonly_docs.search
data_scope:
  - approved_internal_docs
