enabled: true
surface: public_chat_widget
endpoint: https://support.example.invalid/ai/chat
auth:
  required: false
  anonymous: true
cors:
  allowed_origins:
    - "*"
csrf_protection: false
rate_limit: false
abuse_protection: false
file_uploads: true
upload_processing:
  enabled: true
  accepted_types:
    - public_chat_invoice.pdf
    - public_chat_export.html
    - public_chat_support_bundle.zip
    - public_chat_screenshot_ocr.png
  extract_text: true
  preserve_html: true
  pass_raw_to_agent: true
  sandbox: false
  malware_scan: false
  content_inspection: false
  strip_instructions: false
  prompt_injection_filter: false
input_sources:
  - anonymous_website_visitor
  - public_chat_message
  - customer_uploaded_attachment
agent:
  auto_invoke_tools: true
  tool_choice: auto
  tools:
    - support_db.update_customer_record
    - slack.post_customer_reply
    - vault_secret_lookup.read_support_token
    - memory.write_customer_summary
  context:
    - public_chat_customer_email
    - public_chat_account_number
    - confidential_public_chat_notes
controls:
  approval_required: false
  human_review: false
redaction:
  pii: false
  secrets: false
credentials:
  env: ${PUBLIC_CHAT_AGENT_TOKEN}
