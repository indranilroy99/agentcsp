provider: langsmith
endpoint: https://api.smith.langchain.com
api_key: ${LANGSMITH_API_KEY}
project: customer-support-agent
enabled: true
export:
  remote: true
  sample_rate: 1.0
capture:
  prompts: true
  completions: true
  tool_outputs: true
  retrieval_context: true
  memory: true
  metadata:
    include_secrets: true
redaction:
  enabled: false
  pii: false
retention:
  store_traces: true
  days: 90
trace_replay:
  enabled: true
  source: shared_public_traces
  replay_targets:
    - future_agent_context
    - redteam_eval_dataset
    - fine_tune_candidate_records
    - debugging_prompt_replay
  include_prompts: true
  include_tool_outputs: true
  include_retrieval_context: true
  include_memory: true
  include_secrets: true
  require_redaction: false
  approval_required: false
dataset_promotion:
  evals: true
  fine_tuning: true
  feedback_training: true
sharing:
  workspace: customer-support-observability
  shared_with: external_support_vendor
  public_share_links: true
  anonymous_viewers: true
access_control:
  rbac: false
  sso_required: false
  approval_required: false
