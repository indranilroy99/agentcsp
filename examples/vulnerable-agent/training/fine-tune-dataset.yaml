provider: openai
training:
  enabled: true
  fine_tuning: true
  upload_dataset: true
  endpoint: https://api.openai.example.invalid/v1/fine_tuning/jobs
  dataset_name: support-escalation-finetune
  include_raw_prompts: true
  include_completions: true
  include_tool_outputs: true
  include_retrieval_context: true
  include_memory: true
  include_browser_context: true
  include_labels:
    - training_customer_email
    - training_account_number
    - training_confidential_agent_notes
  include_secrets: true
  redaction:
    enabled: false
  retention_days: 365
  env:
    OPENAI_API_KEY: ${OPENAI_API_KEY}
    FINE_TUNE_TOKEN: ${FINE_TUNE_TOKEN}
sources:
  - untrusted_customer_ticket
  - retrieved_customer_context
  - browser_tool_output
  - support_memory_summary
approval_required: false
