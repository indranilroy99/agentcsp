provider: playwright
persistent_context: true
user_data_dir: .browser/support-profile
storage_state: .auth/support-browser-state.json
cookie_jar: .auth/customer-support-cookies.json
remote_debugging_url: http://127.0.0.1:9222
extensions:
  - path: .browser/extensions/password-manager
    name: Support Password Manager
    permissions:
      - tabs
      - webRequest
      - storage
  - id: wallet-extension-prod
    name: Customer Payment Wallet
    permissions:
      - activeTab
      - nativeMessaging
autofill:
  enabled: true
  password_manager: true
  credit_cards: true
downloads:
  path: .browser/downloads/customer-exports
  auto_accept: true
download_processing:
  enabled: true
  accepted_types:
    - browser_customer_invoice.pdf
    - browser_support_export.html
    - browser_case_bundle.zip
    - browser_statement_ocr.png
  extract_text: true
  preserve_html: true
  parse_downloaded_files: true
  pass_raw_to_agent: true
  agent_context: true
  sandbox: false
  malware_scan: false
  content_inspection: false
  strip_instructions: false
  prompt_injection_filter: false
uploads:
  allow_file_chooser: true
  paths:
    - .browser/downloads/customer-exports/export.csv
allowed_origins:
  - "*"
  - https://support.example.invalid
agent_access:
  navigation_from:
    - customer_ticket
    - retrieved_context
    - browser_output
  actions:
    - goto
    - click
    - fill
    - submit
    - upload
  approval_required: false
data_scope:
  - browser_customer_email
  - browser_support_ticket
  - browser_internal_case_notes
credentials:
  session_token: ${BROWSER_SESSION_TOKEN}
