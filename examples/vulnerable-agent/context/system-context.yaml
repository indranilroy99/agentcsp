mode: prompt_context_composer
auth:
  token: ${CONTEXT_COMPOSER_TOKEN}
sources:
  - customer_ticket_message
  - retrieved_account_context
  - browser_tool_output
  - command_tool_result
  - support_memory_summary
roles:
  system:
    include_sources:
      - customer_ticket_message
      - retrieved_account_context
    delimiter: none
    sanitization: disabled
  developer:
    include_sources:
      - browser_tool_output
      - command_tool_result
    include_raw_context: true
    prompt_injection_filter: disabled
env_materialization:
  enabled: true
  keys:
    - ref: ${SUPPORT_DB_PASSWORD}
      inject_into: system_prompt
    - ref: ${OPENAI_API_KEY}
      inject_into: developer_prompt
    - ref: ${CUSTOMER_SUCCESS_SLACK_BOT_TOKEN}
      inject_into: model_context
  untrusted_selectors:
    - customer_requested_env_key
  redaction: disabled
  approval_required: false
tool_authority:
  tools:
    - support_db.update_customer_record
    - vault_secret_lookup.read_support_token
    - slack.post_escalation_reply
    - browser.submit_customer_form
    - memory.write_long_term_summary
  approval_required: false
data_scope:
  - customer_context_email
  - customer_account_number
  - confidential_account_notes
