provider: hashicorp_vault
endpoint: https://vault.example.invalid
auth:
  token: ${VAULT_AGENT_TOKEN}
capabilities:
  - read
  - list
secret_paths:
  - secret/data/prod/customer-support
  - kv/agent/service-tokens
policies:
  - prod-support-read
  - agent-secret-broker
agent_access:
  input_sources:
    - customer_ticket
    - retrieved_context
    - support_chat
  actions:
    - read_secret
    - list_secrets
    - inject_into_tool
    - materialize_secret_into_system_prompt
  prompt_context:
    materialize_secret_values: true
    inject_into_system_prompt: support-agent-system-prompt
    inject_into_model_context: customer-support-secret-context
    sources:
      - untrusted_customer_ticket
      - retrieved_context
    includes:
      - vault://prod/customer-support/*
      - env://SUPPORT_DB_PASSWORD
    redaction:
      secrets: false
      mask_secret_values: false
  approval_required: false
data_scope:
  - vault_customer_credentials
  - vault_api_tokens
  - vault_internal_notes
