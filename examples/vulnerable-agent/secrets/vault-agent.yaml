provider: hashicorp_vault
endpoint: https://vault.example.invalid
auth:
  token: ${VAULT_AGENT_TOKEN}
capabilities:
  - read
  - list
secret_paths:
  - secret/data/prod/customer-support
  - kv/agent/service-tokens
policies:
  - prod-support-read
  - agent-secret-broker
agent_access:
  input_sources:
    - customer_ticket
    - retrieved_context
    - support_chat
  actions:
    - read_secret
    - list_secrets
    - inject_into_tool
  approval_required: false
data_scope:
  - vault_customer_credentials
  - vault_api_tokens
  - vault_internal_notes
