provider: gmail
endpoint: https://mail-router.example.invalid/hooks/support-agent
auth:
  token: ${SUPPORT_INBOX_TOKEN}
sources:
  - support mailbox secops-support@example.invalid
  - inbound customer email
  - slack escalation message
  - ticket comment
payload_fields:
  - sender_email
  - subject
  - message_body
  - attachments
  - customer_account_id
attachment_processing:
  enabled: true
  accepted_types:
    - customer_invoice.pdf
    - customer_export.html
    - support_bundle.zip
    - screenshot_with_ocr.png
  extract_text: true
  preserve_html: true
  pass_raw_to_agent: true
  sandbox: false
  malware_scan: false
  content_inspection: false
  strip_instructions: false
  prompt_injection_filter: false
agent:
  name: support-triage-agent
  prompt_source: message.body
  invoke_agent: true
  tool_access:
    - browser
    - support_db
    - slack_reply
    - vault_secret_lookup
  actions:
    - call_tools
    - reply_to_sender
    - update_customer_record
    - remember_case_notes
  approval_required: false
data_scope:
  - inbound_customer_email
  - support_case_notes
  - attachment_text
