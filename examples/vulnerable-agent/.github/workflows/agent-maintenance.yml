name: Agent maintenance

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [agent-maintenance]
  pull_request:

permissions:
  contents: write
  issues: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run agent maintenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          AGENTCSP_TICKET_CONTEXT: ${{ github.event.comment.body || github.event.client_payload.prompt || github.event.pull_request.body }}
        run: pnpm agent:run -- --ticket "$AGENTCSP_TICKET_CONTEXT"
