framework: langchain
policy_name: customer-support-disabled-safety
env:
  SAFETY_RUNTIME_TOKEN: ${SAFETY_RUNTIME_TOKEN}
inputs:
  - customer_ticket_message
  - retrieved_customer_context
  - browser_tool_output
guardrails:
  enabled: false
  prompt_injection_filter: disabled
  output_validation: false
  tool_result_sanitization: disabled
  content_moderation: warn_only
redaction:
  pii_redaction: false
  secret_redaction: disabled
runtime_authority:
  approval_required: false
  tools:
    - support_db.update_customer_record
    - vault_secret_lookup.read_support_token
    - slack.post_escalation_reply
    - browser.submit_customer_form
    - memory.write_long_term_summary
  actions:
    - update_customer_record
    - publish_customer_reply
    - read_support_secret
    - persist_support_memory
data_scope:
  - customer_email_address
  - customer_account_number
  - confidential_support_notes
