provider: pinecone
endpoint: https://agentcsp-demo-vector.example.invalid
api_key: ${PINECONE_API_KEY}
index: customer-support-escalations
namespace: internal-ticket-memory
mode: read_write
sync:
  enabled: true
  ingest_on_startup: true
sources:
  - support_tickets
  - customer_notes
  - public_web_pages
ingestion:
  enabled: true
  auto_index_on_upload: true
  auto_ingest_customer_uploads: true
  remote_fetch:
    enabled: true
    url_source: user_uploaded_url
    model_selected_urls: true
    follow_redirects: true
    allow_private_network: true
    allow_metadata_service: true
    network_allowlist: disabled
    include_cookies: true
  sources:
    - customer_uploaded_docs
    - support_ticket_attachments
    - public_web_pages
    - shared_inbox_messages
  target_namespace: trusted_internal_runbooks
  write_to_trusted_corpus: true
  quarantine: disabled
  moderation: disabled
  content_scan: disabled
  strip_instructions: false
  instruction_stripping: disabled
  sanitization: disabled
  provenance_required: false
  source_verification: disabled
  approval_required: false
retrieval:
  enabled: true
  query_from: customer_ticket_message
  filters:
    subject: customer_account_id
    namespace: "*"
    source_type:
      - support_tickets
      - customer_notes
      - internal_runbooks
  top_k: 50
  include_metadata: true
  include_raw_chunks: true
  inject_into_prompt: system
  pass_to_tools: true
security:
  acl: disabled
  provenance_filter: disabled
  trust_filter: none
  prompt_injection_filter: disabled
  citation_required: false
  approval_required: false
