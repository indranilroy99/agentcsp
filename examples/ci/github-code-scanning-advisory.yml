name: AgentCSP Code Scanning

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  agentcsp:
    name: AgentCSP advisory scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AGENTCSP_VERSION: 0.2.0
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Run AgentCSP
        run: >
          npx --yes "agentcsp@${AGENTCSP_VERSION}" scan .
          --out .agentcsp
          --format json,md,sarif
          --ruleset recommended
          --quiet

      - name: Stage AgentCSP SARIF
        if: always() && hashFiles('.agentcsp/agentcsp.sarif') != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: agentcsp-sarif
          path: .agentcsp/agentcsp.sarif
          if-no-files-found: error

  publish-sarif:
    name: Publish AgentCSP SARIF
    needs: agentcsp
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download AgentCSP SARIF
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: agentcsp-sarif
          path: sarif

      - name: Upload AgentCSP SARIF
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: sarif/agentcsp.sarif
          category: agentcsp
