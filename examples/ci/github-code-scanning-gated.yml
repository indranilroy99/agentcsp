name: AgentCSP Gated Code Scanning

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  agentcsp:
    name: AgentCSP gated scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AGENTCSP_VERSION: 0.2.0
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Run AgentCSP
        id: agentcsp_scan
        continue-on-error: true
        run: >
          npx --yes "agentcsp@${AGENTCSP_VERSION}" scan .
          --out .agentcsp
          --format json,md,sarif
          --profile ci_strict
          --ruleset recommended
          --fail-on high
          --fail-on-confidence high
          --fail-on-diagnostics
          --fail-on-expired-suppressions
          --fail-on-scan-health degraded
          --quiet

      - name: Stage AgentCSP SARIF
        if: always() && hashFiles('.agentcsp/agentcsp.sarif') != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: agentcsp-sarif
          path: .agentcsp/agentcsp.sarif
          if-no-files-found: error

      - name: Enforce AgentCSP CI gate
        if: steps.agentcsp_scan.outcome == 'failure'
        run: exit 1

  publish-sarif:
    name: Publish AgentCSP SARIF
    needs: agentcsp
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download AgentCSP SARIF
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: agentcsp-sarif
          path: sarif

      - name: Upload AgentCSP SARIF
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: sarif/agentcsp.sarif
          category: agentcsp
