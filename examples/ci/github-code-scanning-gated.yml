name: AgentCSP Gated Code Scanning

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  agentcsp:
    name: AgentCSP gated scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AGENTCSP_VERSION: 0.2.0
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Run AgentCSP
        id: agentcsp_scan
        continue-on-error: true
        run: >
          npx --yes "agentcsp@${AGENTCSP_VERSION}" scan .
          --out .agentcsp
          --format json,md,sarif
          --profile ci_strict
          --ruleset recommended
          --fail-on high
          --fail-on-confidence high
          --fail-on-diagnostics
          --fail-on-expired-suppressions
          --fail-on-scan-health degraded
          --quiet

      - name: Stage AgentCSP SARIF
        if: always() && hashFiles('.agentcsp/agentcsp.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentcsp-sarif
          path: .agentcsp/agentcsp.sarif
          if-no-files-found: error

      - name: Enforce AgentCSP CI gate
        if: steps.agentcsp_scan.outcome == 'failure'
        run: exit 1

  publish-sarif:
    name: Publish AgentCSP SARIF
    needs: agentcsp
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download AgentCSP SARIF
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agentcsp-sarif
          path: sarif

      - name: Upload AgentCSP SARIF
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: sarif/agentcsp.sarif
          category: agentcsp
