id: AGENTCSP-MEMORY-005
name: Shared agent memory crosses tenant boundary without isolation
description: A durable agent memory store accepts untrusted writes into public or cross-tenant memory while access controls and tenant isolation are disabled, allowing sensitive context to replay across users, agents, or tenants.
category: memory_access_boundary
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
    - LLM08:2025 Vector and Embedding Weaknesses
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.2
match:
  object_type: memory
  where:
    - field: metadata.parsed_agent_memory_store_config
      op: equals
      value: true
    - field: metadata.agent_memory_store_persistent
      op: equals
      value: true
    - field: metadata.agent_memory_store_shared
      op: equals
      value: true
    - field: metadata.agent_memory_store_public_access
      op: equals
      value: true
    - field: metadata.agent_memory_store_cross_tenant_access
      op: equals
      value: true
    - field: metadata.agent_memory_store_access_control_disabled
      op: equals
      value: true
    - field: metadata.agent_memory_store_tenant_isolation_disabled
      op: equals
      value: true
    - field: metadata.agent_memory_store_untrusted_write
      op: equals
      value: true
    - field: metadata.agent_memory_store_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Split agent memory by tenant and trust boundary, disable public or cross-tenant memory writes, enforce RBAC and tenant isolation, and require approval before untrusted context can persist into shared memory.
