id: AGENTCSP-TOOL-023
name: Source tool handler persists caller content into agent memory
description: A source-defined agent tool handler writes customer or prompt-like tool input into memory, vector, RAG, or state storage, creating a durable poisoning path where untrusted content can influence future agent runs.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_memory_write
      op: equals
      value: true
    - field: metadata.memory_write
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: memory_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_memory_write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - pii
    - field: actions
      op: includes
      value: remember
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined memory-write tools until untrusted content is stripped of instructions, provenance and tenant labels are required, memory namespaces are allowlisted, retention is bounded, and approval gates protect any customer or prompt-like content persisted for future agent context.
