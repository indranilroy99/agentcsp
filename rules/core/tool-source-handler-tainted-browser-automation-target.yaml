id: AGENTCSP-TOOL-040
name: Source tool handler drives browser with caller-selected targets
description: A source-defined agent tool handler passes caller-selected URLs, selectors, form inputs, or customer payloads into browser page or driver automation calls, creating a direct path from model-reachable input to authenticated web-origin actions.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_browser_automation
      op: equals
      value: true
    - field: metadata.handler_tainted_browser_automation_target
      op: equals
      value: true
    - field: metadata.browser_automation
      op: equals
      value: true
    - field: metadata.tainted_browser_automation_target
      op: equals
      value: true
    - field: metadata.accepts_url_input
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: browser_automation
    - field: metadata.authority_classes
      op: includes
      value: tainted_browser_automation_target
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_browser_automation
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_browser_automation_target
    - field: metadata.schema_properties
      op: contains_any
      value:
        - browser_url
        - customer_message_text
        - form_payload
        - form_selector
        - input_text
        - selector
        - submit_selector
        - target_url
    - field: actions
      op: includes
      value: execute
    - field: external_reach
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined browser automation wrappers that pass caller-selected targets into page or driver calls until destinations, selectors, and form payloads are resolved by policy outside the model path, constrained to approved origins, isolated from persistent authenticated profiles, and approval-gated before account-changing actions.
