id: AGENTCSP-TOOL-177
name: Source tool handler grants authorization from clipboard content
description: A source-defined agent tool handler reads desktop clipboard content and uses it to write broad or approval-free agent authorization, permission, entitlement, or tool-grant policy.
category: clipboard_authorization_grant_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0059 Data from Information Repositories
    - AML.T0065 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_clipboard_read
      op: equals
      value: true
    - field: metadata.handler_authorization_policy_write
      op: equals
      value: true
    - field: metadata.handler_tainted_authorization_grant_input
      op: equals
      value: true
    - field: metadata.handler_authorization_broad_grant
      op: equals
      value: true
    - field: metadata.handler_clipboard_authorization_grant_bridge
      op: equals
      value: true
    - field: metadata.clipboard_read
      op: equals
      value: true
    - field: metadata.authorization_policy_write
      op: equals
      value: true
    - field: metadata.tainted_authorization_grant_input
      op: equals
      value: true
    - field: metadata.authorization_broad_grant
      op: equals
      value: true
    - field: metadata.clipboard_authorization_grant_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_authorization_grant_bridge
      op: equals
      value: false
    - field: metadata.local_file_authorization_grant_bridge
      op: equals
      value: false
    - field: metadata.env_secret_authorization_grant_bridge
      op: equals
      value: false
    - field: metadata.network_response_authorization_grant_bridge
      op: equals
      value: false
    - field: metadata.model_output_authorization_grant_bridge
      op: equals
      value: false
    - field: metadata.tool_output_authorization_grant_bridge
      op: equals
      value: false
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: clipboard_read
    - field: metadata.authority_classes
      op: includes
      value: authorization_policy_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_authorization_grant_input
    - field: metadata.authority_classes
      op: includes
      value: authorization_broad_grant
    - field: metadata.authority_classes
      op: includes
      value: clipboard_authorization_grant_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_clipboard_read
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_authorization_policy_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_authorization_grant_input
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_authorization_broad_grant
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_clipboard_authorization_grant_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - requested_tool_name
        - tenant_id
        - requester_ticket
        - customer_id
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine clipboard-to-authorization grant bridges until clipboard content is treated as untrusted, cannot become roles, scopes, subjects, resources, tools, or grant reasons, broad and approval-free grants are rejected deterministically, runtime grant credentials are least-privilege, and security-owner approval is required before authorization policy changes.
