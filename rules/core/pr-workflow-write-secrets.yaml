id: AGENTCSP-CICD-002
name: Pull request workflow combines write permissions and secrets
description: A pull request-triggered workflow has write permissions and references secrets, creating a high-impact supply-chain path if agent-influenced changes reach CI.
category: ci_cd_authority
severity: high
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0018 Supply Chain Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - GOVERN 1.5
    - MANAGE 4.1
match:
  object_type: ci_cd
  where:
    - field: metadata.pull_request_trigger
      op: equals
      value: true
    - field: metadata.write_permissions
      op: equals
      value: true
    - field: metadata.mentions_secrets_context
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Split untrusted pull request workflows from secret-backed write workflows and require maintainer approval before privileged CI runs.
