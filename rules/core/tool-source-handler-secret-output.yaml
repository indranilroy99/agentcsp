id: AGENTCSP-TOOL-017
name: Source tool handler returns env secret to model context
description: A source-defined agent tool handler reads credential-bearing environment material and returns that secret-bearing value through model-visible tool output, creating a direct secret disclosure path into agent context.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.handler_model_visible_output
      op: equals
      value: true
    - field: metadata.handler_secret_to_output
      op: equals
      value: true
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_to_output
    - field: metadata.authority_classes
      op: includes
      value: secret_materialization
    - field: data_classes
      op: includes
      value: credential
    - field: secret_exposure
      op: equals
      value: true
    - field: actions
      op: includes
      value: send
recommendation:
  control: quarantine
  text: Quarantine source-defined tools that return raw environment secrets. Replace raw secret output with scoped aliases or redacted status, keep secret values outside model-visible tool results, and require approval before any credential-derived data can enter agent context.
