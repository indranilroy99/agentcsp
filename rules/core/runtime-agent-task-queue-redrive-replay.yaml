id: AGENTCSP-RUNTIME-073
name: Background agent queue can replay poisoned privileged jobs
description: A background agent queue accepts untrusted prompt or tool-output payloads, retries and replays them through a dead-letter queue, and auto-executes privileged credential-backed tools without approval.
category: background_agent_queue_replay
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_task_queue_config
      op: equals
      value: true
    - field: metadata.agent_task_queue_background_consumer
      op: equals
      value: true
    - field: metadata.agent_task_queue_auto_execute
      op: equals
      value: true
    - field: metadata.agent_task_queue_untrusted_payload
      op: equals
      value: true
    - field: metadata.agent_task_queue_prompt_passthrough
      op: equals
      value: true
    - field: metadata.agent_task_queue_tool_output_passthrough
      op: equals
      value: true
    - field: metadata.agent_task_queue_retry_enabled
      op: equals
      value: true
    - field: metadata.agent_task_queue_dead_letter_queue
      op: equals
      value: true
    - field: metadata.agent_task_queue_replay_enabled
      op: equals
      value: true
    - field: metadata.agent_task_queue_privileged_tool_authority
      op: equals
      value: true
    - field: metadata.agent_task_queue_approval_required
      op: equals
      value: false
    - field: data_classes
      op: contains_any
      value:
        - credential
        - confidential
        - pii
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine failed or replayed agent jobs that contain untrusted prompt or tool-output context, disable automatic DLQ redrive into privileged workers, deduplicate side-effecting jobs, and require approval before retried jobs can use external, database, browser, memory, or secret-backed tools.
