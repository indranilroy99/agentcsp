id: AGENTCSP-TOOL-039
name: Source tool handler persists to caller-selected memory scope
description: A source-defined agent tool handler passes a caller-selected namespace, tenant, collection, index, or memory key into a memory, vector, RAG, or state-store write, allowing model-reachable input to choose where durable context is stored and later replayed.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_memory_write
      op: equals
      value: true
    - field: metadata.handler_tainted_memory_scope
      op: equals
      value: true
    - field: metadata.memory_write
      op: equals
      value: true
    - field: metadata.tainted_memory_scope
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: memory_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_memory_scope
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_memory_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_memory_scope
    - field: metadata.schema_properties
      op: contains_any
      value:
        - collection
        - collection_name
        - index_name
        - memory_key
        - memory_namespace
        - memory_scope
        - namespace
        - tenant_id
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - pii
    - field: actions
      op: includes
      value: remember
    - field: actions
      op: includes
      value: write
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined memory-write tools that accept caller-selected memory scope until namespaces are policy-resolved outside the model path, isolated by trust boundary and tenant, stripped of instruction-like content, bounded by retention, and protected by approval before durable replay.
