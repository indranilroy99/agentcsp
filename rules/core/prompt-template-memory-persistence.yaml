id: AGENTCSP-PROMPT-002
name: Prompt template persists untrusted input to memory
description: A prompt template accepts user, customer, ticket, web, or retrieved-context variables and combines them with memory persistence directives, creating a cross-session contamination path.
category: prompt_template_injection
severity: high
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM06:2025 Excessive Agency
    - LLM08:2025 Vector and Embedding Weaknesses
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.2
match:
  object_type: prompt
  where:
    - field: metadata.prompt_template
      op: equals
      value: true
    - field: metadata.untrusted_template_input
      op: equals
      value: true
    - field: metadata.memory_write_directive
      op: equals
      value: true
    - field: metadata.template_bridge_memory
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Do not persist untrusted template variables into reusable memory until they are summarized, provenance-tagged, and stripped of instructions.
