id: AGENTCSP-TOOL-002
name: Package script downloads remote content into a shell
description: A package script combines network retrieval and shell execution, creating a high-risk path for supply-chain compromise or agent-triggered remote code execution.
category: unsafe_code_execution
severity: critical
maps_to:
  owasp:
    - LLM06:2025 Excessive Agency
    - LLM10:2025 Unbounded Consumption
  mitre_atlas:
    - AML.T0054 Command and Scripting Interpreter
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - GOVERN 1.5
    - MANAGE 2.3
match:
  object_type: tool
  where:
    - field: metadata.network_to_shell
      op: equals
      value: true
recommendation:
  control: deny
  text: Remove network-to-shell package scripts or require a reviewed, pinned, checksummed artifact path before any agent or CI can invoke them.
