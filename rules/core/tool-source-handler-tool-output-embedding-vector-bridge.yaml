id: AGENTCSP-TOOL-090
name: Source tool handler embeds raw tool observation into vector memory
description: A source-defined agent tool handler invokes a nested tool, sends the raw tool observation to an embedding provider with runtime credentials, and persists the resulting vector into durable memory, RAG, or state storage.
category: tool_output_embedding_vector_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
    - AML.T0063 Poison Training Data
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_tool_invocation
      op: equals
      value: true
    - field: metadata.handler_embedding_provider_call
      op: equals
      value: true
    - field: metadata.handler_memory_write
      op: equals
      value: true
    - field: metadata.handler_tool_output_embedding_vector_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.nested_tool_invocation
      op: equals
      value: true
    - field: metadata.embedding_provider_call
      op: equals
      value: true
    - field: metadata.memory_write
      op: equals
      value: true
    - field: metadata.tool_output_embedding_vector_bridge
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: nested_tool_invocation
    - field: metadata.authority_classes
      op: includes
      value: embedding_provider_call
    - field: metadata.authority_classes
      op: includes
      value: memory_write
    - field: metadata.authority_classes
      op: includes
      value: tool_output_embedding_vector_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tool_invocation
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_embedding_provider_call
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_memory_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tool_output_embedding_vector_bridge
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: remember
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined tool-output-to-vector bridges until nested tool observations are treated as tainted, blocked from external embedding providers by default, redacted and instruction-stripped before embedding, written only to policy-owned tenant-scoped vector namespaces with provenance labels, retention is bounded, and approval is required before replay into future agent context.
