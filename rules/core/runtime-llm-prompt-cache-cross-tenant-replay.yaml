id: AGENTCSP-RUNTIME-050
name: Shared semantic prompt cache can replay untrusted context across tenants
description: A shared semantic prompt or response cache accepts user-controlled cache keys and can reuse cached responses across tenant boundaries while sensitive context is captured without redaction or approval.
category: prompt_cache_boundary
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.2
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_llm_prompt_cache_config
      op: equals
      value: true
    - field: metadata.llm_prompt_cache_remote
      op: equals
      value: true
    - field: metadata.llm_prompt_cache_shared
      op: equals
      value: true
    - field: metadata.llm_prompt_cache_semantic_reuse_enabled
      op: equals
      value: true
    - field: metadata.llm_prompt_cache_user_controlled_key
      op: equals
      value: true
    - field: metadata.llm_prompt_cache_broad_match_threshold
      op: equals
      value: true
    - field: metadata.llm_prompt_cache_cross_tenant_replay
      op: equals
      value: true
    - field: metadata.llm_prompt_cache_tenant_isolation_disabled
      op: equals
      value: true
    - field: metadata.llm_prompt_cache_sensitive_capture
      op: equals
      value: true
    - field: metadata.llm_prompt_cache_redaction_disabled
      op: equals
      value: true
    - field: metadata.llm_prompt_cache_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Disable cross-tenant semantic cache reuse, scope cache keys by tenant and trust boundary, raise semantic match thresholds, redact sensitive context before cache writes, and require approval before untrusted prompts can populate shared response caches.
