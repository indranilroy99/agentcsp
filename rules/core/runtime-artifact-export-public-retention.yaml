id: AGENTCSP-RUNTIME-093
name: Public artifact export retains raw agent run context
description: A generated-output artifact export writes and retains public agent run artifacts containing prompts, tool outputs, browser artifacts, retrieval context, memory, PII, and secrets while redaction and approval are disabled.
category: artifact_export_public_retention
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_artifact_export_config
      op: equals
      value: true
    - field: metadata.agent_artifact_export_remote
      op: equals
      value: true
    - field: metadata.agent_artifact_export_public_access
      op: equals
      value: true
    - field: metadata.agent_artifact_export_write_enabled
      op: equals
      value: true
    - field: metadata.agent_artifact_export_retention_enabled
      op: equals
      value: true
    - field: metadata.agent_artifact_export_prompt_capture
      op: equals
      value: true
    - field: metadata.agent_artifact_export_tool_output_capture
      op: equals
      value: true
    - field: metadata.agent_artifact_export_browser_capture
      op: equals
      value: true
    - field: metadata.agent_artifact_export_retrieval_capture
      op: equals
      value: true
    - field: metadata.agent_artifact_export_memory_capture
      op: equals
      value: true
    - field: metadata.agent_artifact_export_secret_capture
      op: equals
      value: true
    - field: metadata.agent_artifact_export_sensitive_capture
      op: equals
      value: true
    - field: metadata.agent_artifact_export_pii_capture
      op: equals
      value: true
    - field: metadata.agent_artifact_export_redaction_disabled
      op: equals
      value: true
    - field: metadata.agent_artifact_export_approval_required
      op: equals
      value: false
    - field: metadata.agent_artifact_export_capture_categories
      op: contains_any
      value:
        - browser_artifact
        - memory_context
        - prompt_context
        - retrieval_context
        - secret_material
        - tool_output
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine generated run artifacts before export, disable public access and long retention for raw prompts, tool outputs, browser artifacts, retrieval context, memory, PII, and secrets, require approval before artifact upload, and store only redacted artifacts in private retention boundaries.
