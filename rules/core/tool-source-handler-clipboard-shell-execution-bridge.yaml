id: AGENTCSP-TOOL-196
name: Source tool handler executes clipboard contents through shell
description: A source-defined agent tool handler reads browser or desktop clipboard material and passes copied text into shell or subprocess execution using runtime environment authority.
category: clipboard_shell_execution_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0054 Reverse Shell
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0060 Run Malicious Code
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_clipboard_read
      op: equals
      value: true
    - field: metadata.handler_shell_execution
      op: equals
      value: true
    - field: metadata.handler_clipboard_shell_execution_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.clipboard_read
      op: equals
      value: true
    - field: metadata.shell_execution
      op: equals
      value: true
    - field: metadata.clipboard_shell_execution_bridge
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: clipboard_read
    - field: metadata.authority_classes
      op: includes
      value: shell_execution
    - field: metadata.authority_classes
      op: includes
      value: clipboard_shell_execution_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_clipboard_read
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_shell_execution
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_clipboard_shell_execution_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - customer_id
        - working_directory
        - clipboard_execution_reason_text
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: execute
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine clipboard-to-shell handlers until clipboard content is always treated as untrusted data, cannot become a command or subprocess argument, command allowlists and working-directory constraints are enforced, runtime environment secrets are isolated, and independent approval plus audit provenance are required before host execution.
