id: AGENTCSP-RUNTIME-061
name: Secret manager materializes credentials into model context
description: A secret manager connector reads broad or sensitive secret scope and materializes raw credential values into model-visible prompt context from untrusted inputs while redaction and approval controls are disabled.
category: secret_prompt_materialization
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_secret_manager_config
      op: equals
      value: true
    - field: metadata.secret_manager_read_enabled
      op: equals
      value: true
    - field: metadata.secret_manager_broad_scope
      op: equals
      value: true
    - field: metadata.secret_manager_injects_into_prompt_context
      op: equals
      value: true
    - field: metadata.secret_manager_untrusted_input
      op: equals
      value: true
    - field: metadata.secret_manager_redaction_disabled
      op: equals
      value: true
    - field: metadata.secret_manager_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: redact
  text: Never materialize raw secret values into model-visible prompts or context. Use scoped secret aliases, keep redaction enabled, block untrusted secret selectors, and require approval before secret retrieval can influence agent prompts or tools.
