id: AGENTCSP-AUTOMATION-004
name: Untrusted workflow payload is passed as an agent shell argument
description: A GitHub Actions workflow maps issue, pull request, or repository-dispatch payload text into an environment variable and passes it as a shell argument to an agent package script that runs with secrets and write permissions.
category: automation_shell_argument_injection
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0054 Command and Scripting Interpreter
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - GOVERN 1.5
    - MAP 5.1
    - MANAGE 2.4
match:
  object_type: automation
  where:
    - field: metadata.untrusted_event_trigger
      op: equals
      value: true
    - field: metadata.untrusted_event_payload_used
      op: equals
      value: true
    - field: metadata.untrusted_event_agent_input
      op: equals
      value: true
    - field: metadata.untrusted_event_shell_argument
      op: equals
      value: true
    - field: metadata.untrusted_event_shell_argument_env_key_count
      op: gt
      value: 0
    - field: metadata.package_manager_run
      op: equals
      value: true
    - field: metadata.agent_run_command
      op: equals
      value: true
    - field: metadata.agent_package_script_bridge
      op: equals
      value: true
    - field: metadata.write_permissions
      op: equals
      value: true
    - field: metadata.mentions_secrets_context
      op: equals
      value: true
    - field: actions
      op: contains_any
      value:
        - execute
    - field: actions
      op: contains_any
      value:
        - write
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine external workflow payloads before they become shell arguments; avoid passing issue, pull request, or dispatch text directly to agent scripts, use reviewed artifacts or sanitized summaries, and split untrusted event handling from secret-backed write permissions.
