id: AGENTCSP-TOOL-056
name: Source tool handler weakens guardrail or approval policy
description: A source-defined agent tool handler uses runtime credentials to update guardrail, approval, moderation, or safety policy from caller-controlled policy content and caller-selected controls while disabling enforcement or defaulting to allow.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM06:2025 Excessive Agency
    - LLM07:2025 System Prompt Leakage
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0053 LLM Plugin Supply Chain Compromise
    - AML.T0054 LLM Data Poisoning
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_safety_policy_write
      op: equals
      value: true
    - field: metadata.handler_tainted_safety_policy_payload
      op: equals
      value: true
    - field: metadata.handler_tainted_safety_policy_selector
      op: equals
      value: true
    - field: metadata.handler_safety_policy_weakening
      op: equals
      value: true
    - field: metadata.safety_policy_write
      op: equals
      value: true
    - field: metadata.tainted_safety_policy_payload
      op: equals
      value: true
    - field: metadata.tainted_safety_policy_selector
      op: equals
      value: true
    - field: metadata.safety_policy_weakening
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: safety_policy_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_safety_policy_payload
    - field: metadata.authority_classes
      op: includes
      value: tainted_safety_policy_selector
    - field: metadata.authority_classes
      op: includes
      value: safety_policy_weakening
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_safety_policy_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_safety_policy_payload
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_safety_policy_selector
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_safety_policy_weakening
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined safety and approval policy writers until policy targets are owned by configuration, caller/customer text cannot alter enforcement instructions, default-allow or disabled modes are rejected, and human approval is required for guardrail, moderation, and approval-policy changes.
