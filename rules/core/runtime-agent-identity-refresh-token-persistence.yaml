id: AGENTCSP-RUNTIME-072
name: Agent identity delegation persists refreshable privileged credentials
description: An agent identity delegation config can mint or impersonate broad credentials, keep refresh enabled, inject those credentials into tools, and let untrusted subject context influence the credential boundary without approval.
category: identity_refresh_token_persistence
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.2
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_identity_config
      op: equals
      value: true
    - field: metadata.agent_identity_credential_issuance_enabled
      op: equals
      value: true
    - field: metadata.agent_identity_impersonation_enabled
      op: equals
      value: true
    - field: metadata.agent_identity_token_refresh_enabled
      op: equals
      value: true
    - field: metadata.agent_identity_broad_scope
      op: equals
      value: true
    - field: metadata.agent_identity_tool_injection
      op: equals
      value: true
    - field: metadata.agent_identity_untrusted_input
      op: equals
      value: true
    - field: metadata.agent_identity_approval_required
      op: equals
      value: false
    - field: data_classes
      op: includes
      value: credential
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Disable refreshable delegated credentials for agent-selected subjects, require approval for token issuance and impersonation, keep untrusted context out of subject and scope selection, and issue short-lived task-scoped credentials instead of broad tool-injected tokens.
