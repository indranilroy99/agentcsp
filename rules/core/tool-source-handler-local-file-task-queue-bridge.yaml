id: AGENTCSP-TOOL-148
name: Local file content queued for background agents
description: A source-defined agent tool handler reads a caller-selected local file path and enqueues the file material into asynchronous background-agent or task-queue work using runtime credentials and caller-controlled routing.
category: local_file_task_queue_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0060 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_filesystem_read
      op: equals
      value: true
    - field: metadata.handler_tainted_filesystem_path
      op: equals
      value: true
    - field: metadata.handler_task_queue_enqueue
      op: equals
      value: true
    - field: metadata.handler_tainted_task_payload
      op: equals
      value: true
    - field: metadata.handler_tainted_task_routing
      op: equals
      value: true
    - field: metadata.handler_local_file_task_queue_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.task_queue_enqueue
      op: equals
      value: true
    - field: metadata.tainted_task_payload
      op: equals
      value: true
    - field: metadata.tainted_task_routing
      op: equals
      value: true
    - field: metadata.local_file_task_queue_bridge
      op: equals
      value: true
    - field: metadata.tainted_filesystem_path
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: filesystem_read
    - field: metadata.authority_classes
      op: includes
      value: tainted_filesystem_path
    - field: metadata.authority_classes
      op: includes
      value: task_queue_enqueue
    - field: metadata.authority_classes
      op: includes
      value: tainted_task_payload
    - field: metadata.authority_classes
      op: includes
      value: tainted_task_routing
    - field: metadata.authority_classes
      op: includes
      value: local_file_task_queue_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_filesystem_read
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_filesystem_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_task_queue_enqueue
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_task_payload
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_task_routing
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_local_file_task_queue_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - local_file_path
        - workspace_path
        - target_queue_name
        - task_route
        - job_goal_text
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: remember
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine local-file-to-task-queue handlers until local file reads are allowlisted, file contents are classified and redacted before enqueue, queue names and worker routes are policy-owned, replay and dead-letter redrive are bounded, queue credentials are least privilege, and background workers enforce the same approval boundary as foreground tools.
