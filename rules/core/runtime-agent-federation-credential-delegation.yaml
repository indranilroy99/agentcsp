id: AGENTCSP-RUNTIME-102
name: Remote agent federation delegates credentials to unverified peers
description: An A2A or remote-agent federation configuration can dynamically select unverified third-party peers from untrusted context and auto-forward prompts, retrieval context, tool results, memory, authorization headers, or tokens without allowlists or approval.
category: agent_federation_credential_delegation
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Supply Chain Vulnerabilities
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0018 Supply Chain Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_federation_config
      op: equals
      value: true
    - field: metadata.agent_federation_provider
      op: equals
      value: a2a
    - field: metadata.agent_federation_remote
      op: equals
      value: true
    - field: metadata.agent_federation_dynamic_discovery
      op: equals
      value: true
    - field: metadata.agent_federation_untrusted_selector
      op: equals
      value: true
    - field: metadata.agent_federation_auto_delegation_enabled
      op: equals
      value: true
    - field: metadata.agent_federation_context_forwarding_enabled
      op: equals
      value: true
    - field: metadata.agent_federation_sensitive_context_forwarding
      op: equals
      value: true
    - field: metadata.agent_federation_pii_context_forwarding
      op: equals
      value: true
    - field: metadata.agent_federation_secret_forwarding
      op: equals
      value: true
    - field: metadata.agent_federation_tool_result_forwarding
      op: equals
      value: true
    - field: metadata.agent_federation_memory_forwarding
      op: equals
      value: true
    - field: metadata.agent_federation_credential_forwarding
      op: equals
      value: true
    - field: metadata.agent_federation_signature_verification_disabled
      op: equals
      value: true
    - field: metadata.agent_federation_identity_verification_missing
      op: equals
      value: true
    - field: metadata.agent_federation_allowlist_missing
      op: equals
      value: true
    - field: metadata.agent_federation_approval_required
      op: equals
      value: false
    - field: data_classes
      op: includes
      value: credential
    - field: data_classes
      op: includes
      value: secret
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine remote agent federation until peer registries and agent cards are pinned, signed, identity-verified, and allowlisted, and strip credentials, authorization headers, memory, tool results, and sensitive context before any untrusted or third-party delegation.
