id: AGENTCSP-TOOL-137
name: Source tool handler delegates network response to remote agent
description: A source-defined agent tool handler fetches a caller-selected URL, captures the response body, and delegates that network response to a caller-selected remote agent or A2A peer using runtime credentials.
category: network_response_agent_delegation_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0060 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_external_network_call
      op: equals
      value: true
    - field: metadata.handler_tainted_network_destination
      op: equals
      value: true
    - field: metadata.handler_credentialed_network_read
      op: equals
      value: true
    - field: metadata.handler_agent_delegation
      op: equals
      value: true
    - field: metadata.handler_tainted_agent_delegation_target
      op: equals
      value: true
    - field: metadata.handler_agent_delegation_context_forwarding
      op: equals
      value: true
    - field: metadata.handler_network_response_agent_delegation_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.tainted_network_destination
      op: equals
      value: true
    - field: metadata.credentialed_network_read
      op: equals
      value: true
    - field: metadata.agent_delegation
      op: equals
      value: true
    - field: metadata.tainted_agent_delegation_target
      op: equals
      value: true
    - field: metadata.agent_delegation_context_forwarding
      op: equals
      value: true
    - field: metadata.network_response_agent_delegation_bridge
      op: equals
      value: true
    - field: metadata.accepts_url_input
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: tainted_network_destination
    - field: metadata.authority_classes
      op: includes
      value: credentialed_network_read
    - field: metadata.authority_classes
      op: includes
      value: agent_delegation
    - field: metadata.authority_classes
      op: includes
      value: tainted_agent_delegation_target
    - field: metadata.authority_classes
      op: includes
      value: agent_delegation_context_forwarding
    - field: metadata.authority_classes
      op: includes
      value: network_response_agent_delegation_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_network_destination
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_credentialed_network_read
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_agent_delegation
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_agent_delegation_target
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_agent_delegation_context_forwarding
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_network_response_agent_delegation_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - target_agent_id
        - remote_agent_url
        - target_url
        - delegation_goal_text
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: data_classes
      op: includes
      value: credential
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine network-response-to-remote-agent handlers until fetched content is treated as untrusted, stripped of executable instructions and secrets, remote agents and A2A peers are identity-verified and allowlisted, delegated context is minimized and provenance-labeled, delegation credentials are scoped per peer, and approval plus audit provenance are required before network-derived content crosses an agent trust boundary.
