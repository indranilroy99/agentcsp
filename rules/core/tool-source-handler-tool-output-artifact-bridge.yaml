id: AGENTCSP-TOOL-080
name: Source tool handler exports raw tool observation to public artifact storage
description: A source-defined agent tool handler invokes a nested tool and exports the raw tool observation into public or shareable artifact storage using runtime credentials.
category: tool_output_artifact_bridge
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_tool_invocation
      op: equals
      value: true
    - field: metadata.handler_artifact_export
      op: equals
      value: true
    - field: metadata.handler_tool_output_artifact_bridge
      op: equals
      value: true
    - field: metadata.handler_public_artifact_destination
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.nested_tool_invocation
      op: equals
      value: true
    - field: metadata.artifact_export
      op: equals
      value: true
    - field: metadata.tool_output_artifact_bridge
      op: equals
      value: true
    - field: metadata.public_artifact_destination
      op: equals
      value: true
    - field: metadata.external_write
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: nested_tool_invocation
    - field: metadata.authority_classes
      op: includes
      value: artifact_export
    - field: metadata.authority_classes
      op: includes
      value: tool_output_artifact_bridge
    - field: metadata.authority_classes
      op: includes
      value: public_artifact_destination
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tool_invocation
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_artifact_export
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tool_output_artifact_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_public_artifact_destination
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: publish
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined tool-output-to-artifact bridges until raw tool observations are blocked from public or shareable artifact storage, storage destinations are policy-owned, object keys and access modes are not caller-selected, runtime credentials are scoped to approved private buckets, and redaction, retention, approval, and audit provenance are enforced before export.
