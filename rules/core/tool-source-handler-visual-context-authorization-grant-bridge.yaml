id: AGENTCSP-TOOL-189
name: Source tool handler grants authorization from authenticated visual context
description: A source-defined agent tool handler captures authenticated browser or screen visual context from a caller-selected target and uses screenshot or OCR-derived context to write broad authorization grants using runtime credentials.
category: visual_context_authorization_grant_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0060 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
