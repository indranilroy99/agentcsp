recommendation:
  control: quarantine
  text: Quarantine visual-context-to-authorization handlers until screenshot and OCR-derived content cannot become tools, roles, scopes, resources, subjects, or grant reasons; visual content is classified and redacted; grants are policy-owned and allowlisted; broad or approval-free grants are rejected deterministically; runtime grant credentials are least privilege; and security-owner approval plus immutable audit provenance are required before visual context can change authorization.
