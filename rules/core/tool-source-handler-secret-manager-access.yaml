id: AGENTCSP-TOOL-028
name: Source tool handler reads secret manager from caller context
description: A source-defined agent tool handler reads a secret manager, vault, key vault, or cloud secret store using caller or model supplied secret paths, customer context, or tickets, then exposes credential material through model-visible tool output.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_manager_access
      op: equals
      value: true
    - field: metadata.secret_manager_access
      op: equals
      value: true
    - field: metadata.handler_model_visible_output
      op: equals
      value: true
    - field: metadata.accepts_secret_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_access
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: secret_exposure
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined secret-manager readers until secret names and paths are policy-checked outside the model path, restricted to explicit allowlists, never returned through model-visible tool output, and independently approved with audited least-privilege secret scopes.
