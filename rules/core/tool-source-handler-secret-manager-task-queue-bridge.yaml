id: AGENTCSP-TOOL-084
name: Source tool handler enqueues secret-manager output to background agent
description: A source-defined agent tool handler reads a caller-selected secret-manager value and enqueues the raw secret into a background-agent or task queue using runtime credentials.
category: secret_manager_task_queue_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_manager_access
      op: equals
      value: true
    - field: metadata.handler_tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.handler_task_queue_enqueue
      op: equals
      value: true
    - field: metadata.handler_tainted_task_payload
      op: equals
      value: true
    - field: metadata.handler_tainted_task_routing
      op: equals
      value: true
    - field: metadata.handler_secret_manager_task_queue_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.secret_manager_access
      op: equals
      value: true
    - field: metadata.tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.task_queue_enqueue
      op: equals
      value: true
    - field: metadata.tainted_task_payload
      op: equals
      value: true
    - field: metadata.tainted_task_routing
      op: equals
      value: true
    - field: metadata.secret_manager_task_queue_bridge
      op: equals
      value: true
    - field: metadata.accepts_secret_like_input
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_access
    - field: metadata.authority_classes
      op: includes
      value: tainted_secret_manager_path
    - field: metadata.authority_classes
      op: includes
      value: task_queue_enqueue
    - field: metadata.authority_classes
      op: includes
      value: tainted_task_payload
    - field: metadata.authority_classes
      op: includes
      value: tainted_task_routing
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_task_queue_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_secret_manager_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_task_queue_enqueue
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_task_payload
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_task_routing
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_task_queue_bridge
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: remember
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined secret-manager-to-task-queue bridges until caller-selected vault paths are policy-owned, secret values are never placed into queued payloads, queue names and routes are allowlisted, replay/redrive is disabled for sensitive data, queue credentials are scoped, and approval plus audit provenance are required before background agents can process secret-bearing jobs.
