id: AGENTCSP-TOOL-165
name: Source tool handler replays env secret through browser automation
description: A source-defined agent tool handler reads environment-backed secret material and inserts it into a caller-influenced browser automation flow, allowing runtime credentials to be replayed into external pages or forms.
category: env_secret_browser_automation_bridge
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
    - LLM08:2025 Vector and Embedding Weaknesses
  mitre_atlas:
    - AML.T0059 Data from Information Repositories
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.handler_browser_automation
      op: equals
      value: true
    - field: metadata.handler_tainted_browser_automation_target
      op: equals
      value: true
    - field: metadata.handler_env_secret_browser_automation_bridge
      op: equals
      value: true
    - field: metadata.browser_automation
      op: equals
      value: true
    - field: metadata.tainted_browser_automation_target
      op: equals
      value: true
    - field: metadata.env_secret_browser_automation_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_browser_automation_bridge
      op: not_equals
      value: true
    - field: metadata.model_output_browser_automation_bridge
      op: not_equals
      value: true
    - field: metadata.network_response_browser_automation_bridge
      op: not_equals
      value: true
    - field: metadata.tool_output_browser_automation_bridge
      op: not_equals
      value: true
    - field: metadata.rag_retrieval_browser_automation_bridge
      op: not_equals
      value: true
    - field: metadata.local_file_browser_automation_bridge
      op: not_equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_env_access
    - field: metadata.authority_classes
      op: includes
      value: browser_automation
    - field: metadata.authority_classes
      op: includes
      value: tainted_browser_automation_target
    - field: metadata.authority_classes
      op: includes
      value: env_secret_browser_automation_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_env_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_browser_automation
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_browser_automation_target
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_env_secret_browser_automation_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - browser_target_url
        - form_selector
        - secret_selector
        - submit_selector
        - target_url
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: send
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined env-secret-to-browser bridges until environment-backed secrets cannot be inserted into browser automation actions, caller-controlled URLs and selectors are policy allowlisted, browser sessions isolate credentials from untrusted context, and every credential replay path requires explicit approval with audit evidence.
