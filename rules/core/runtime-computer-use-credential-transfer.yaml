id: AGENTCSP-RUNTIME-099
name: Computer-use agent can transfer credentialed desktop state
description: A computer-use agent can operate a signed-in desktop with credential-store or autofill access while untrusted context can drive clipboard/file transfer and auto-accepted downloads without redaction or approval.
category: computer_use_credential_transfer_boundary
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_computer_use_config
      op: equals
      value: true
    - field: metadata.agent_computer_use_enabled
      op: equals
      value: true
    - field: metadata.agent_computer_use_remote_session
      op: equals
      value: true
    - field: metadata.agent_computer_use_authenticated_session
      op: equals
      value: true
    - field: metadata.agent_computer_use_credential_store_access
      op: equals
      value: true
    - field: metadata.agent_computer_use_screen_capture
      op: equals
      value: true
    - field: metadata.agent_computer_use_ocr_capture
      op: equals
      value: true
    - field: metadata.agent_computer_use_clipboard_write
      op: equals
      value: true
    - field: metadata.agent_computer_use_file_transfer
      op: equals
      value: true
    - field: metadata.agent_computer_use_download_auto_accept
      op: equals
      value: true
    - field: metadata.agent_computer_use_local_path_redacted
      op: equals
      value: true
    - field: metadata.agent_computer_use_untrusted_input
      op: equals
      value: true
    - field: metadata.agent_computer_use_sensitive_context
      op: equals
      value: true
    - field: metadata.agent_computer_use_pii_context
      op: equals
      value: true
    - field: metadata.agent_computer_use_redaction_disabled
      op: equals
      value: true
    - field: metadata.agent_computer_use_approval_required
      op: equals
      value: false
    - field: data_classes
      op: includes
      value: credential
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine credentialed computer-use sessions until credential stores and autofill are isolated, clipboard and file transfer are disabled for untrusted tasks, downloads are manually approved, and screen, OCR, clipboard, PII, and secret redaction are enforced.
