id: AGENTCSP-SUPPLYCHAIN-001
name: Agent package manifest combines risky dependencies with install-time execution
description: A package manifest used by an agent project declares agent, MCP, model, or RAG dependencies with floating or remote dependency references while also running lifecycle scripts with credential exposure.
category: agent_supply_chain
severity: critical
maps_to:
  owasp:
    - LLM05:2025 Supply Chain Vulnerabilities
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0010 Supply Chain Compromise
    - AML.T0054 Command and Scripting Interpreter
  nist_ai_rmf:
    - GOVERN 1.5
    - MAP 5.1
    - MANAGE 2.3
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_package_manifest_config
      op: equals
      value: true
    - field: metadata.package_manifest_agent_dependency_count
      op: gt
      value: 0
    - field: metadata.package_manifest_risky_dependency_count
      op: gt
      value: 0
    - field: metadata.package_manifest_lifecycle_script
      op: equals
      value: true
    - field: metadata.package_manifest_lifecycle_secret_env
      op: equals
      value: true
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Pin agent and MCP dependencies to reviewed versions, replace remote dependency specs with verified artifacts, remove credentialed lifecycle scripts, and require approval before install-time code can run in agent environments.
