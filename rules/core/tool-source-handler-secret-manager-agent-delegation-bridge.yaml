id: AGENTCSP-TOOL-085
name: Source tool handler delegates secret-manager output to remote agent
description: A source-defined agent tool handler reads a caller-selected secret-manager value and delegates the raw secret to a caller-selected remote agent or A2A peer using runtime credentials.
category: secret_manager_agent_delegation_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_manager_access
      op: equals
      value: true
    - field: metadata.handler_tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.handler_agent_delegation
      op: equals
      value: true
    - field: metadata.handler_tainted_agent_delegation_target
      op: equals
      value: true
    - field: metadata.handler_agent_delegation_context_forwarding
      op: equals
      value: true
    - field: metadata.handler_secret_manager_agent_delegation_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.secret_manager_access
      op: equals
      value: true
    - field: metadata.tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.agent_delegation
      op: equals
      value: true
    - field: metadata.tainted_agent_delegation_target
      op: equals
      value: true
    - field: metadata.agent_delegation_context_forwarding
      op: equals
      value: true
    - field: metadata.secret_manager_agent_delegation_bridge
      op: equals
      value: true
    - field: metadata.accepts_secret_like_input
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.accepts_url_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_access
    - field: metadata.authority_classes
      op: includes
      value: tainted_secret_manager_path
    - field: metadata.authority_classes
      op: includes
      value: agent_delegation
    - field: metadata.authority_classes
      op: includes
      value: tainted_agent_delegation_target
    - field: metadata.authority_classes
      op: includes
      value: agent_delegation_context_forwarding
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_agent_delegation_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_secret_manager_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_agent_delegation
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_agent_delegation_target
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_agent_delegation_context_forwarding
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_agent_delegation_bridge
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: execute
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined secret-manager-to-remote-agent delegation bridges until caller-selected vault paths are policy-owned, raw secret values are never forwarded to remote peers, agent targets are allowlisted and identity-verified outside model context, A2A credentials are scoped per peer, forwarded context is classified and redacted, and approval plus audit provenance are required before delegated agents receive secret-bearing context.
