id: AGENTCSP-RUNTIME-108
name: Public model gateway auto-executes tools while logging secrets
description: A public anonymous model gateway disables authentication, allows broad cross-origin access, disables rate limits, logs prompts, retrieval context, memory, tool calls, tool outputs, PII, and secrets without redaction, and auto-executes exposed database or external-response tools without approval.
category: model_gateway_public_auto_tool_secret_logging
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0054 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_ai_model_config
      op: equals
      value: true
    - field: metadata.ai_model_custom_endpoint
      op: equals
      value: true
    - field: metadata.ai_model_public_endpoint
      op: equals
      value: true
    - field: metadata.ai_model_anonymous_clients
      op: equals
      value: true
    - field: metadata.ai_model_cors_broad
      op: equals
      value: true
    - field: metadata.ai_model_rate_limit_missing
      op: equals
      value: true
    - field: metadata.ai_model_auth_disabled
      op: equals
      value: true
    - field: metadata.ai_model_sends_prompts
      op: equals
      value: true
    - field: metadata.ai_model_sends_tool_outputs
      op: equals
      value: true
    - field: metadata.ai_model_sends_retrieval_context
      op: equals
      value: true
    - field: metadata.ai_model_sends_memory
      op: equals
      value: true
    - field: metadata.ai_model_pii_context
      op: equals
      value: true
    - field: metadata.ai_model_secret_context
      op: equals
      value: true
    - field: metadata.ai_model_untrusted_input
      op: equals
      value: true
    - field: metadata.ai_model_request_logging_enabled
      op: equals
      value: true
    - field: metadata.ai_model_redaction_disabled
      op: equals
      value: true
    - field: metadata.ai_model_tool_calling_enabled
      op: equals
      value: true
    - field: metadata.ai_model_tool_auto_execute
      op: equals
      value: true
    - field: metadata.ai_model_tool_authority_categories
      op: includes
      value: database_write
    - field: metadata.ai_model_tool_authority_categories
      op: includes
      value: external_response
    - field: metadata.ai_model_tool_write_authority
      op: equals
      value: true
    - field: metadata.ai_model_tool_external_authority
      op: equals
      value: true
    - field: metadata.ai_model_approval_required
      op: equals
      value: false
    - field: data_classes
      op: includes
      value: credential
    - field: data_classes
      op: includes
      value: secret
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: write
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: deny
  text: Deny public model gateway access until authentication, rate limits, and scoped CORS are enforced; disable auto-executed tool calls, stop logging secrets and raw agent context, enable redaction, and require approval before gateway-mediated database or external-response tools can run.
