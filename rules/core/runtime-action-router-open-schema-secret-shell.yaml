id: AGENTCSP-RUNTIME-104
name: Open-schema model-output action router executes secret and shell authority
description: A model-output action router accepts untrusted model text through an open or repaired action schema, allows unknown batch actions, and auto-executes database, external-response, memory, secret-manager, or shell authority without redaction, dry-run, or approval.
category: action_router_open_schema_secret_shell
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0054 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_action_router_config
      op: equals
      value: true
    - field: metadata.agent_action_router_enabled
      op: equals
      value: true
    - field: metadata.agent_action_router_model_output_input
      op: equals
      value: true
    - field: metadata.agent_action_router_untrusted_input
      op: equals
      value: true
    - field: metadata.agent_action_router_schema_validation_disabled
      op: equals
      value: true
    - field: metadata.agent_action_router_strict_schema
      op: equals
      value: false
    - field: metadata.agent_action_router_open_action_schema
      op: equals
      value: true
    - field: metadata.agent_action_router_unknown_actions_allowed
      op: equals
      value: true
    - field: metadata.agent_action_router_json_repair_enabled
      op: equals
      value: true
    - field: metadata.agent_action_router_batch_execution_enabled
      op: equals
      value: true
    - field: metadata.agent_action_router_auto_execute
      op: equals
      value: true
    - field: metadata.agent_action_router_tool_authority_categories
      op: contains_any
      value:
        - database_write
        - external_response
        - memory_write
        - secret_manager_access
        - shell_execution
    - field: metadata.agent_action_router_privileged_tool_authority
      op: equals
      value: true
    - field: metadata.agent_action_router_write_authority
      op: equals
      value: true
    - field: metadata.agent_action_router_external_authority
      op: equals
      value: true
    - field: metadata.agent_action_router_memory_authority
      op: equals
      value: true
    - field: metadata.agent_action_router_secret_access
      op: equals
      value: true
    - field: metadata.agent_action_router_shell_authority
      op: equals
      value: true
    - field: metadata.agent_action_router_sensitive_context
      op: equals
      value: true
    - field: metadata.agent_action_router_pii_context
      op: equals
      value: true
    - field: metadata.agent_action_router_redaction_disabled
      op: equals
      value: true
    - field: metadata.agent_action_router_dry_run_disabled
      op: equals
      value: true
    - field: metadata.agent_action_router_approval_required
      op: equals
      value: false
    - field: data_classes
      op: includes
      value: credential
    - field: data_classes
      op: includes
      value: secret
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine open-schema model-output action routing until actions are restricted to a closed strict schema, unknown actions and JSON repair are denied, batch execution is bounded, tool arguments are redacted, dry-run is the default, and approval gates protect database, external-response, memory, secret-manager, and shell authority.
