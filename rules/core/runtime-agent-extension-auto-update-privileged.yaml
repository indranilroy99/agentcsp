id: AGENTCSP-RUNTIME-098
name: Remote extension auto-update grants privileged agent authority
description: A remote extension loader can auto-install and auto-update unpinned skills or plugins selected from untrusted context while signature and provenance verification are disabled and the loaded capabilities receive browser, database, filesystem, memory, external-response, or secret-manager authority without approval.
category: agent_extension_auto_update_privileged
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Supply Chain Vulnerabilities
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0054 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.2
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_extension_loader_config
      op: equals
      value: true
    - field: metadata.agent_extension_loader_remote
      op: equals
      value: true
    - field: metadata.agent_extension_loader_unpinned_reference
      op: equals
      value: true
    - field: metadata.agent_extension_loader_auto_install_enabled
      op: equals
      value: true
    - field: metadata.agent_extension_loader_auto_update_enabled
      op: equals
      value: true
    - field: metadata.agent_extension_loader_signature_verification_disabled
      op: equals
      value: true
    - field: metadata.agent_extension_loader_provenance_verification_missing
      op: equals
      value: true
    - field: metadata.agent_extension_loader_untrusted_input
      op: equals
      value: true
    - field: metadata.agent_extension_loader_tool_authority_categories
      op: contains_any
      value:
        - browser_action
        - database_access
        - external_response
        - memory_write
        - repo_or_filesystem_write
        - secret_manager_access
    - field: metadata.agent_extension_loader_privileged_authority
      op: equals
      value: true
    - field: metadata.agent_extension_loader_external_authority
      op: equals
      value: true
    - field: metadata.agent_extension_loader_sensitive_data
      op: equals
      value: true
    - field: metadata.agent_extension_loader_pii_data
      op: equals
      value: true
    - field: metadata.agent_extension_loader_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine remote extension auto-install and auto-update flows until every skill or plugin is pinned, signed, provenance-verified, reviewed, and explicitly approved before receiving browser, database, filesystem, memory, external-response, or secret-manager authority.
