id: AGENTCSP-RUNTIME-026
name: Agent container runtime exposes host escape boundary
description: An agent container or sandbox runtime is configured with privileged execution, Docker socket access, host path mounts, host networking, credential exposure, untrusted inputs, and no approval gate.
category: container_isolation_boundary
severity: critical
maps_to:
  owasp:
    - LLM06:2025 Excessive Agency
    - LLM07:2025 System Prompt Leakage
  mitre_atlas:
    - AML.T0054 Command and Scripting Interpreter
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_container_runtime_config
      op: equals
      value: true
    - field: metadata.agent_container_privileged
      op: equals
      value: true
    - field: metadata.agent_container_docker_socket_mount
      op: equals
      value: true
    - field: metadata.agent_container_host_path_mount
      op: equals
      value: true
    - field: metadata.agent_container_host_network
      op: equals
      value: true
    - field: metadata.agent_container_untrusted_input
      op: equals
      value: true
    - field: metadata.agent_container_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: deny
  text: Deny privileged agent containers by default, remove Docker socket and host-root mounts, disable host networking and host namespaces, run as a non-root user, and require approval before untrusted agent context can reach host-level execution.
