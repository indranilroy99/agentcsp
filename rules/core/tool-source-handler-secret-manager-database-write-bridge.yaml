id: AGENTCSP-TOOL-091
name: Source tool handler writes secret-manager output to database
description: A source-defined agent tool handler reads a caller-selected secret-manager path and writes the returned secret material into a database or record store using runtime authority.
category: secret_manager_database_write_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_manager_access
      op: equals
      value: true
    - field: metadata.handler_tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.handler_database_query
      op: equals
      value: true
    - field: metadata.handler_database_write
      op: equals
      value: true
    - field: metadata.handler_secret_manager_database_write_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.secret_manager_access
      op: equals
      value: true
    - field: metadata.tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.database_access
      op: equals
      value: true
    - field: metadata.database_write
      op: equals
      value: true
    - field: metadata.secret_manager_database_write_bridge
      op: equals
      value: true
    - field: metadata.accepts_secret_like_input
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_access
    - field: metadata.authority_classes
      op: includes
      value: tainted_secret_manager_path
    - field: metadata.authority_classes
      op: includes
      value: database_write
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_database_write_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_secret_manager_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_database_query
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_database_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_database_write_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - customer_id
        - database_record_id
        - record_id
        - requester_ticket
        - secret_path
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined secret-manager-to-database bridges until secret paths are policy-owned, raw secret values are blocked from database records by default, database writes use reviewed parameterized fields, sensitive values are redacted or tokenized before persistence, and approval plus audit provenance are required for any break-glass database mutation.
