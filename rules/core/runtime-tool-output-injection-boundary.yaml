id: AGENTCSP-RUNTIME-039
name: Raw tool outputs can request privileged follow-up actions
description: A tool-output policy sends raw browser, shell, MCP, API, or customer-provided outputs into privileged model context while allowing follow-up tool calls without sanitization, prompt-injection filtering, delimiting, or approval.
category: tool_output_injection_boundary
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_tool_output_policy_config
      op: equals
      value: true
    - field: metadata.tool_output_untrusted_sources
      op: equals
      value: true
    - field: metadata.tool_output_raw_output_enabled
      op: equals
      value: true
    - field: metadata.tool_output_prompt_context
      op: equals
      value: true
    - field: metadata.tool_output_sanitization_disabled
      op: equals
      value: true
    - field: metadata.tool_output_prompt_injection_filter_disabled
      op: equals
      value: true
    - field: metadata.tool_output_followup_tool_calls
      op: equals
      value: true
    - field: metadata.tool_output_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Treat tool outputs as tainted data, isolate them from system and developer context, sanitize and delimit raw observations, disable tool-output-requested follow-up actions, and require approval before tool results can trigger writes, external sends, memory persistence, shell execution, or secret access.
