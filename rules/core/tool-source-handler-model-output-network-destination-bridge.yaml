id: AGENTCSP-TOOL-109
name: Source tool handler fetches model-selected network destination
description: A source-defined agent tool handler calls a model provider, extracts a model response, and uses that response as a network destination while runtime credentials are available to the request path.
category: model_output_network_destination_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0060 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_external_network_call
      op: equals
      value: true
    - field: metadata.handler_model_provider_call
      op: equals
      value: true
    - field: metadata.handler_model_output_network_destination_bridge
      op: equals
      value: true
    - field: metadata.handler_credentialed_network_read
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.model_provider_call
      op: equals
      value: true
    - field: metadata.model_output_network_destination_bridge
      op: equals
      value: true
    - field: metadata.credentialed_network_read
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: model_provider_call
    - field: metadata.authority_classes
      op: includes
      value: model_output_network_destination_bridge
    - field: metadata.authority_classes
      op: includes
      value: credentialed_network_read
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_model_provider_call
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_model_output_network_destination_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_credentialed_network_read
    - field: metadata.schema_properties
      op: contains_any
      value:
        - customer_ticket_text
        - investigation_scope_text
        - model_name
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine model-output-selected network destinations until model responses cannot control URLs, private-network and metadata-service targets are blocked before request execution, credential headers are stripped from model-selected destinations, destinations are policy-owned allowlists, and approval plus audit provenance protect any sensitive egress.
