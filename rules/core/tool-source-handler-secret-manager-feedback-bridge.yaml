id: AGENTCSP-TOOL-066
name: Source tool handler promotes secret-manager output through feedback pipelines
description: A source-defined agent tool handler reads a caller-selected secret-manager path and records the returned secret material into feedback, RLHF, eval, reward-model, or model-improvement promotion using runtime credentials.
category: secret_manager_feedback_bridge
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM04:2025 Data and Model Poisoning
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0054 LLM Data Poisoning
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_manager_access
      op: equals
      value: true
    - field: metadata.handler_tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.handler_feedback_pipeline_write
      op: equals
      value: true
    - field: metadata.handler_secret_manager_feedback_bridge
      op: equals
      value: true
    - field: metadata.handler_feedback_auto_promotion
      op: equals
      value: true
    - field: metadata.handler_tainted_feedback_routing
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.secret_manager_access
      op: equals
      value: true
    - field: metadata.tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.feedback_pipeline_write
      op: equals
      value: true
    - field: metadata.secret_manager_feedback_bridge
      op: equals
      value: true
    - field: metadata.feedback_auto_promotion
      op: equals
      value: true
    - field: metadata.tainted_feedback_routing
      op: equals
      value: true
    - field: metadata.external_write
      op: equals
      value: true
    - field: metadata.accepts_secret_like_input
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_access
    - field: metadata.authority_classes
      op: includes
      value: tainted_secret_manager_path
    - field: metadata.authority_classes
      op: includes
      value: feedback_pipeline_write
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_feedback_bridge
    - field: metadata.authority_classes
      op: includes
      value: feedback_auto_promotion
    - field: metadata.authority_classes
      op: includes
      value: tainted_feedback_routing
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_secret_manager_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_feedback_pipeline_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_feedback_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_feedback_auto_promotion
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_feedback_routing
    - field: metadata.schema_properties
      op: contains_any
      value:
        - eval_set
        - eval_set_id
        - feedback_dataset
        - feedback_dataset_id
        - model_update_route
        - promotion_target
        - reward_model_id
        - training_dataset_id
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: remember
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined secret-manager-to-feedback promotion bridges until secret paths and feedback destinations are policy-owned, raw secret values are blocked from feedback, RLHF, eval, reward-model, and model-improvement records, redaction and retention controls run before promotion, and approval plus audit provenance are required for any model-update destination.
