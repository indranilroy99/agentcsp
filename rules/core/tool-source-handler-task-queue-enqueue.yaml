id: AGENTCSP-TOOL-053
name: Source tool handler enqueues caller-controlled background agent job
description: A source-defined agent tool handler uses runtime credentials to enqueue caller-controlled payloads into a background agent or task queue with caller-selected routing, creating an async prompt-to-privileged-action path outside the current approval boundary.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM06:2025 Excessive Agency
    - LLM08:2025 Vector and Embedding Weaknesses
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0053 LLM Plugin Supply Chain Compromise
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_task_queue_enqueue
      op: equals
      value: true
    - field: metadata.handler_tainted_task_payload
      op: equals
      value: true
    - field: metadata.handler_tainted_task_routing
      op: equals
      value: true
    - field: metadata.task_queue_enqueue
      op: equals
      value: true
    - field: metadata.tainted_task_payload
      op: equals
      value: true
    - field: metadata.tainted_task_routing
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: task_queue_enqueue
    - field: metadata.authority_classes
      op: includes
      value: tainted_task_payload
    - field: metadata.authority_classes
      op: includes
      value: tainted_task_routing
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_task_queue_enqueue
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_task_payload
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_task_routing
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined queue tools until queue names, topics, routes, tenants, and payload schemas are policy-owned or allowlisted, queued jobs are authenticated and idempotent, background workers enforce the same approval policy as foreground tools, and untrusted/customer content is sanitized before it can trigger async agent actions.
