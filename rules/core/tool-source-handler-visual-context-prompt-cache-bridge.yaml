id: AGENTCSP-TOOL-103
name: Source tool handler writes authenticated visual context to prompt cache
description: A source-defined agent tool handler captures authenticated browser or screen visual context from a caller-selected target and writes that screenshot or OCR context into a prompt, LLM, response, or semantic cache using runtime credentials.
category: visual_context_prompt_cache_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_browser_automation
      op: equals
      value: true
    - field: metadata.handler_tainted_browser_automation_target
      op: equals
      value: true
    - field: metadata.handler_visual_context_capture
      op: equals
      value: true
    - field: metadata.handler_prompt_cache_write
      op: equals
      value: true
    - field: metadata.handler_visual_context_prompt_cache_bridge
      op: equals
      value: true
    - field: metadata.handler_tainted_prompt_cache_key
      op: equals
      value: true
    - field: metadata.browser_automation
      op: equals
      value: true
    - field: metadata.tainted_browser_automation_target
      op: equals
      value: true
    - field: metadata.visual_context_capture
      op: equals
      value: true
    - field: metadata.prompt_cache_write
      op: equals
      value: true
    - field: metadata.visual_context_prompt_cache_bridge
      op: equals
      value: true
    - field: metadata.tainted_prompt_cache_key
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_url_input
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: visual_context_capture
    - field: metadata.authority_classes
      op: includes
      value: prompt_cache_write
    - field: metadata.authority_classes
      op: includes
      value: visual_context_prompt_cache_bridge
    - field: metadata.authority_classes
      op: includes
      value: tainted_prompt_cache_key
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_visual_context_capture
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_prompt_cache_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_visual_context_prompt_cache_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_prompt_cache_key
    - field: metadata.schema_properties
      op: contains_any
      value:
        - target_url
        - page_url
        - browser_url
    - field: metadata.schema_properties
      op: contains_any
      value:
        - prompt_cache_key
        - cache_key
        - semantic_cache_key
        - visual_cache_note_text
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: remember
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined visual-context prompt-cache writers until authenticated screenshots and OCR text are classified and redacted before caching, cache keys are tenant-scoped and policy-owned, replay and semantic reuse are bounded, cache retention is enforced, and approval plus audit provenance are required before visual context can enter reusable prompt context.
