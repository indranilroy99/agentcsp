id: AGENTCSP-MCP-002
name: MCP server has secret-backed tool authority
description: An MCP server is configured with credential key names and exposes agent-callable authority, creating a direct path from agent context to privileged tool execution.
category: mcp_authority
severity: high
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MANAGE 2.4
match:
  object_type: mcp_server
  where:
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Require explicit tool approval and least-privilege credentials before enabling this MCP server for agent runtime use.
