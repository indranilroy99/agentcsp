id: AGENTCSP-MCP-012
name: Remote MCP server can elicit sensitive fields without approval
description: A remote credential-backed MCP server can ask the client for sensitive or credential-like fields while elicitation redaction, sanitization, and approval controls are disabled.
category: mcp_sensitive_elicitation
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0054 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.3
match:
  object_type: mcp_server
  where:
    - field: metadata.remote
      op: equals
      value: true
    - field: metadata.mcp_elicitation_enabled
      op: equals
      value: true
    - field: metadata.mcp_elicitation_sensitive_fields
      op: equals
      value: true
    - field: metadata.mcp_elicitation_sensitive_field_kinds
      op: contains_any
      value:
        - credential
    - field: metadata.mcp_elicitation_sensitive_field_kinds
      op: contains_any
      value:
        - pii
    - field: metadata.mcp_elicitation_redaction_disabled
      op: equals
      value: true
    - field: metadata.mcp_elicitation_sanitization_disabled
      op: equals
      value: true
    - field: metadata.mcp_elicitation_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
    - field: external_reach
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Disable sensitive MCP elicitation for remote servers by default, require explicit user approval for every sensitive field request, redact credential-like responses before server delivery, validate elicitation schemas locally, and allowlist remote servers that can request user or client-provided context.
