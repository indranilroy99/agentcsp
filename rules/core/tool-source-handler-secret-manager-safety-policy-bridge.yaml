id: AGENTCSP-TOOL-089
name: Source tool handler weakens safety policy from secret-manager output
description: A source-defined agent tool handler reads a caller-selected secret-manager value and uses the raw secret to update guardrail, approval, moderation, or safety policy while weakening enforcement.
category: secret_manager_safety_policy_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM06:2025 Excessive Agency
    - LLM07:2025 System Prompt Leakage
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0053 LLM Plugin Supply Chain Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_manager_access
      op: equals
      value: true
    - field: metadata.handler_tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.handler_safety_policy_write
      op: equals
      value: true
    - field: metadata.handler_tainted_safety_policy_payload
      op: equals
      value: true
    - field: metadata.handler_tainted_safety_policy_selector
      op: equals
      value: true
    - field: metadata.handler_safety_policy_weakening
      op: equals
      value: true
    - field: metadata.handler_secret_manager_safety_policy_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_access
      op: equals
      value: true
    - field: metadata.tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.safety_policy_write
      op: equals
      value: true
    - field: metadata.tainted_safety_policy_payload
      op: equals
      value: true
    - field: metadata.tainted_safety_policy_selector
      op: equals
      value: true
    - field: metadata.safety_policy_weakening
      op: equals
      value: true
    - field: metadata.secret_manager_safety_policy_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_access
    - field: metadata.authority_classes
      op: includes
      value: tainted_secret_manager_path
    - field: metadata.authority_classes
      op: includes
      value: safety_policy_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_safety_policy_payload
    - field: metadata.authority_classes
      op: includes
      value: tainted_safety_policy_selector
    - field: metadata.authority_classes
