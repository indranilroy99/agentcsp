recommendation:
  control: quarantine
  text: Quarantine secret-manager-to-safety-policy bridges until secret paths are config-owned, secret values cannot enter policy payloads, safety targets are allowlisted outside model context, default-allow or disabled modes are rejected, and guardrail or approval-policy writes require separate human authorization with provenance.
