id: AGENTCSP-TOOL-161
name: Source tool handler exports env secret into telemetry
description: A source-defined agent tool handler reads environment-backed secret material and writes it into AI traces, logs, telemetry events, or observability payloads.
category: env_secret_telemetry_bridge
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
    - LLM10:2025 Unbounded Consumption
  mitre_atlas:
    - AML.T0059 Data from Information Repositories
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.handler_telemetry_export
      op: equals
      value: true
    - field: metadata.handler_env_secret_telemetry_bridge
      op: equals
      value: true
    - field: metadata.telemetry_export
      op: equals
      value: true
    - field: metadata.env_secret_telemetry_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_telemetry_bridge
      op: not_equals
      value: true
    - field: metadata.model_output_telemetry_bridge
      op: not_equals
      value: true
    - field: metadata.network_response_telemetry_bridge
      op: not_equals
      value: true
    - field: metadata.local_file_telemetry_bridge
      op: not_equals
      value: true
    - field: metadata.tool_output_telemetry_bridge
      op: not_equals
      value: true
    - field: metadata.visual_context_telemetry_bridge
      op: not_equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_env_access
    - field: metadata.authority_classes
      op: includes
      value: telemetry_export
    - field: metadata.authority_classes
      op: includes
      value: env_secret_telemetry_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_env_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_telemetry_export
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_env_secret_telemetry_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - trace_project
        - trace_session_id
        - trace_id
        - span_id
        - telemetry_project
        - observability_project
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: publish
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined env-secret-to-telemetry bridges until runtime secrets cannot enter traces or logs, telemetry payloads are classified and redacted before export, retention and viewer access are bounded, replay systems cannot expose credential material, and telemetry credentials are scoped to approved non-secret observability events.
