id: AGENTCSP-SECRET-001
name: Secret reference exposed to agent context
description: A file or configuration surface exposes credential key names or secret references to the agent security surface.
category: secret_exposure
severity: medium
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MANAGE 2.4
match:
  object_type: secret
  where:
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: redact
  text: Keep secret values out of agent-readable context and expose only scoped references required at runtime.
