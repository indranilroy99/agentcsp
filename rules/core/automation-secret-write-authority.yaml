id: AGENTCSP-AUTOMATION-001
name: Automation trigger has secret-backed write authority
description: A scheduled, manual, or externally dispatched workflow can run with secrets and write permissions, creating unattended agent authority outside normal review flow.
category: automation_authority
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - GOVERN 1.5
    - MANAGE 2.4
match:
  object_type: automation
  where:
    - field: metadata.write_permissions
      op: equals
      value: true
    - field: metadata.mentions_secrets_context
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Require approval and least-privilege credentials before scheduled or externally dispatched agent automation can run with write authority.
