id: AGENTCSP-RUNTIME-106
name: Public anonymous shared session exposes control and secrets
description: A public anonymous shared agent session allows external collaborators to inject prompts, control tools and approvals, resume or replay execution, and capture sensitive prompts, retrieval context, memory, tool outputs, transcripts, and secrets without redaction or approval.
category: agent_session_public_control_secret_capture
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0054 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_session_sharing_config
      op: equals
      value: true
    - field: metadata.agent_session_sharing_enabled
      op: equals
      value: true
    - field: metadata.agent_session_sharing_external
      op: equals
      value: true
    - field: metadata.agent_session_sharing_public_access
      op: equals
      value: true
    - field: metadata.agent_session_sharing_anonymous_access
      op: equals
      value: true
    - field: metadata.agent_session_sharing_auth_disabled
      op: equals
      value: true
    - field: metadata.agent_session_sharing_external_collaborators
      op: equals
      value: true
    - field: metadata.agent_session_sharing_broad_collaborator_scope
      op: equals
      value: true
    - field: metadata.agent_session_sharing_live_control_enabled
      op: equals
      value: true
    - field: metadata.agent_session_sharing_prompt_injection_enabled
      op: equals
      value: true
    - field: metadata.agent_session_sharing_tool_control_enabled
      op: equals
      value: true
    - field: metadata.agent_session_sharing_tool_write_authority
      op: equals
      value: true
    - field: metadata.agent_session_sharing_approval_control_enabled
      op: equals
      value: true
    - field: metadata.agent_session_sharing_resume_replay_enabled
      op: equals
      value: true
    - field: metadata.agent_session_sharing_control_categories
      op: includes
      value: approval_control
    - field: metadata.agent_session_sharing_control_categories
      op: includes
      value: database_write
    - field: metadata.agent_session_sharing_control_categories
      op: includes
      value: live_control
    - field: metadata.agent_session_sharing_control_categories
      op: includes
      value: prompt_injection
    - field: metadata.agent_session_sharing_control_categories
      op: includes
      value: resume_replay
    - field: metadata.agent_session_sharing_control_categories
      op: includes
      value: secret_manager_access
    - field: metadata.agent_session_sharing_control_categories
      op: includes
      value: tool_call
    - field: metadata.agent_session_sharing_capture_categories
      op: includes
      value: prompt_context
    - field: metadata.agent_session_sharing_capture_categories
      op: includes
      value: retrieval_context
    - field: metadata.agent_session_sharing_capture_categories
      op: includes
      value: memory_context
    - field: metadata.agent_session_sharing_capture_categories
      op: includes
      value: tool_output
    - field: metadata.agent_session_sharing_capture_categories
      op: includes
      value: transcript
    - field: metadata.agent_session_sharing_capture_categories
      op: includes
      value: secret_context
    - field: metadata.agent_session_sharing_transcript_capture
      op: equals
      value: true
    - field: metadata.agent_session_sharing_sensitive_context
      op: equals
      value: true
    - field: metadata.agent_session_sharing_pii_context
      op: equals
      value: true
    - field: metadata.agent_session_sharing_secret_capture
      op: equals
      value: true
    - field: metadata.agent_session_sharing_redaction_disabled
      op: equals
      value: true
    - field: metadata.agent_session_sharing_untrusted_input
      op: equals
      value: true
    - field: metadata.agent_session_sharing_approval_required
      op: equals
      value: false
    - field: data_classes
      op: includes
      value: credential
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine public anonymous live-session sharing until links are revoked, collaborators are authenticated and scoped, sessions are read-only by default, prompt injection, tool control, approval control, and replay are separated from viewing, captured context is redacted, credentials are rotated, and privileged actions require independent approval.
