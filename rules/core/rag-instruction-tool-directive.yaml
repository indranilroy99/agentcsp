id: AGENTCSP-RAG-002
name: RAG source contains instruction-like tool directive
description: A retrievable source contains instruction-like content plus a tool or external directive, creating a concrete path for indirect prompt injection into agent actions.
category: rag_poisoning
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM06:2025 Excessive Agency
    - LLM08:2025 Vector and Embedding Weaknesses
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
match:
  object_type: rag_source
  where:
    - field: metadata.content_analyzed
      op: equals
      value: true
    - field: metadata.instruction_like_content
      op: equals
      value: true
    - field: metadata.tool_directive
      op: equals
      value: true
    - field: metadata.external_directive
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine this retrieval content until provenance, instruction stripping, and tool-use boundaries are verified.
