id: AGENTCSP-TOOL-095
name: Source tool handler publishes retrieved RAG context externally
description: A source-defined agent tool handler retrieves caller-selected RAG or vector content and publishes the raw retrieved chunks through an external-service SDK using runtime credentials, allowing tenant/customer retrieval context to cross an external recipient boundary.
category: rag_retrieval_external_service_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_rag_retrieval
      op: equals
      value: true
    - field: metadata.handler_tainted_rag_retrieval_query
      op: equals
      value: true
    - field: metadata.handler_external_service_write
      op: equals
      value: true
    - field: metadata.handler_tainted_external_service_recipient
      op: equals
      value: true
    - field: metadata.handler_rag_retrieval_external_service_bridge
      op: equals
      value: true
    - field: metadata.rag_retrieval
      op: equals
      value: true
    - field: metadata.tainted_rag_retrieval_query
      op: equals
      value: true
    - field: metadata.external_service_write
      op: equals
      value: true
    - field: metadata.tainted_external_service_recipient
      op: equals
      value: true
    - field: metadata.rag_retrieval_external_service_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: rag_retrieval
    - field: metadata.authority_classes
      op: includes
      value: tainted_rag_retrieval_query
    - field: metadata.authority_classes
      op: includes
      value: external_service_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_external_service_recipient
    - field: metadata.authority_classes
      op: includes
      value: rag_retrieval_external_service_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_rag_retrieval
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_rag_retrieval_query
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_external_service_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_external_service_recipient
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_rag_retrieval_external_service_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - retrieval_query_text
        - query
        - search_query
    - field: metadata.schema_properties
      op: contains_any
      value:
        - retrieval_namespace
        - vector_namespace
        - collection
        - collection_name
        - index_name
    - field: metadata.schema_properties
      op: contains_any
      value:
        - destination_channel_id
        - channel
        - recipient
        - webhook_url
        - destination
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: publish
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine retrieved-context external publication until retrieval selectors and external recipients are policy-owned or allowlisted, retrieved chunks carry provenance and trust labels, sensitive context is redacted before publication, external-service credentials are scoped, and approval is required before retrieved context can leave the agent boundary.
