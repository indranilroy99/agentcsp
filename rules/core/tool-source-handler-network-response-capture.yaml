id: AGENTCSP-TOOL-022
name: Source tool handler returns caller-controlled URL responses
description: A source-defined agent tool handler fetches a URL-like tool argument and returns the network response through model-visible output, creating an SSRF-style response oracle for private-network or metadata-service data.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_external_network_call
      op: equals
      value: true
    - field: metadata.handler_network_response_to_output
      op: equals
      value: true
    - field: metadata.handler_model_visible_output
      op: equals
      value: true
    - field: metadata.accepts_url_input
      op: equals
      value: true
    - field: metadata.network_response_capture
      op: equals
      value: true
    - field: metadata.handler_external_write
      op: equals
      value: false
    - field: metadata.authority_classes
      op: includes
      value: network_response_capture
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_network_response_to_output
    - field: external_reach
      op: equals
      value: true
    - field: actions
      op: includes
      value: send
    - field: side_effect
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine source-defined URL fetch-and-return tools until URL destinations are allowlisted, private-network and metadata-service targets are denied before fetch, redirects and DNS rebinding are controlled, response bodies are redacted by default, and approval gates protect any untrusted URL response capture.
