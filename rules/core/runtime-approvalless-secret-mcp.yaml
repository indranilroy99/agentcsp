id: AGENTCSP-RUNTIME-003
maturity: stable
disposition: advisory
suppressibility: policy
support_tier: structured
name: Runtime allows secret-backed MCP server without approval
description: An agent runtime configuration explicitly allows an MCP server with credential exposure while approval gates are bypassed, creating a concrete path from agent tool use to secret-backed authority.
category: runtime_posture
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - GOVERN 1.5
    - MANAGE 2.3
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_runtime_config
      op: equals
      value: true
    - field: metadata.approval_bypass
      op: equals
      value: true
    - field: metadata.secret_backed_mcp_runtime_bridge
      op: equals
      value: true
    - field: metadata.referenced_secret_backed_mcp_count
      op: gt
      value: 0
recommendation:
  control: require_approval
  text: Require approval for secret-backed MCP servers, remove broad runtime MCP allowlists, and scope credential exposure before agent-controlled tool calls can reach this server.
