id: AGENTCSP-RUNTIME-114
name: Anonymous agent card exposes callback secrets and privileged tools
description: A public A2A agent card allows anonymous external agents to invoke secret-manager, memory, and write-capable tools while callback or signing credentials are configured and approval and rate limiting are disabled.
category: agent_exposure_callback_secret_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Supply Chain Vulnerabilities
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_exposure_config
      op: equals
      value: true
    - field: metadata.agent_exposure_provider
      op: equals
      value: a2a_agent_card
    - field: metadata.agent_exposure_public_discovery
      op: equals
      value: true
    - field: metadata.agent_exposure_auth_disabled
      op: equals
      value: true
    - field: metadata.agent_exposure_anonymous_access
      op: equals
      value: true
    - field: metadata.agent_exposure_external_callers
      op: equals
      value: true
    - field: metadata.agent_exposure_tool_invocation_enabled
      op: equals
      value: true
    - field: metadata.agent_exposure_privileged_authority
      op: equals
      value: true
    - field: metadata.agent_exposure_write_authority
      op: equals
      value: true
    - field: metadata.agent_exposure_memory_access
      op: equals
      value: true
    - field: metadata.agent_exposure_secret_access
      op: equals
      value: true
    - field: metadata.agent_exposure_callback_credential_reference
      op: equals
      value: true
    - field: metadata.agent_exposure_rate_limit_missing
      op: equals
      value: true
    - field: metadata.agent_exposure_approval_required
      op: equals
      value: false
    - field: metadata.agent_exposure_tool_authority_categories
      op: contains_any
      value:
        - secret_manager_access
    - field: metadata.agent_exposure_tool_authority_categories
      op: contains_any
      value:
        - memory_access
    - field: metadata.agent_exposure_tool_authority_categories
      op: contains_any
      value:
        - browser_action
        - database_access
    - field: data_classes
      op: contains_any
      value:
        - secret
    - field: data_classes
      op: contains_any
      value:
        - pii
    - field: actions
      op: contains_any
      value:
        - execute
    - field: actions
      op: contains_any
      value:
        - remember
    - field: actions
      op: contains_any
      value:
        - write
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Remove callback or signing credentials from public anonymous agent cards, require authenticated caller allowlists, split secret-manager and memory/write authority behind approval-gated internal tools, and enforce rate limits before enabling A2A discovery.
