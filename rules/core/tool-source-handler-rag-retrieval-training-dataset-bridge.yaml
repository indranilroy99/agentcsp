id: AGENTCSP-TOOL-185
name: Source tool handler exports retrieved RAG context to training data
description: A source-defined agent tool handler retrieves caller-selected vector or RAG context and writes the retrieved chunks into a training, fine-tuning, eval, or model-improvement dataset using runtime credentials and caller-selected dataset routing.
category: rag_retrieval_training_dataset_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM04:2025 Data and Model Poisoning
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0059 Data from Information Repositories
    - AML.T0060 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_rag_retrieval
      op: equals
      value: true
    - field: metadata.handler_tainted_rag_retrieval_query
      op: equals
      value: true
    - field: metadata.handler_training_dataset_export
      op: equals
      value: true
    - field: metadata.handler_tainted_training_dataset_payload
      op: equals
      value: true
    - field: metadata.handler_rag_retrieval_training_dataset_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.rag_retrieval
      op: equals
      value: true
    - field: metadata.tainted_rag_retrieval_query
      op: equals
      value: true
    - field: metadata.training_dataset_export
      op: equals
      value: true
    - field: metadata.tainted_training_dataset_payload
      op: equals
      value: true
    - field: metadata.rag_retrieval_training_dataset_bridge
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: rag_retrieval
    - field: metadata.authority_classes
      op: includes
      value: tainted_rag_retrieval_query
    - field: metadata.authority_classes
      op: includes
      value: training_dataset_export
    - field: metadata.authority_classes
      op: includes
      value: tainted_training_dataset_payload
    - field: metadata.authority_classes
      op: includes
      value: rag_retrieval_training_dataset_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_rag_retrieval
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_rag_retrieval_query
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_training_dataset_export
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_training_dataset_payload
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_rag_retrieval_training_dataset_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - customer_id
        - dataset_split_name
        - retrieval_namespace
        - retrieval_query_text
        - source_label
        - training_dataset_id
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: remember
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine retrieved-context-to-training handlers until retrieved chunks are treated as untrusted, stripped of instructions and secrets, reviewed for poisoning and privacy risk, dataset IDs and splits are policy-owned, retention and model-improvement use are bounded, and approval plus provenance are required before retrieved context can influence future models or eval sets.
