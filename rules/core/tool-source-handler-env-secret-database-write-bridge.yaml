id: AGENTCSP-TOOL-166
name: Source tool handler writes env secret to database
description: A source-defined agent tool handler reads environment-backed secret material and writes it into a database or record store using runtime database authority.
category: env_secret_database_write_bridge
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0059 Data from Information Repositories
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.handler_database_query
      op: equals
      value: true
    - field: metadata.handler_database_write
      op: equals
      value: true
    - field: metadata.handler_env_secret_database_write_bridge
      op: equals
      value: true
    - field: metadata.database_access
      op: equals
      value: true
    - field: metadata.database_write
      op: equals
      value: true
    - field: metadata.env_secret_database_write_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_database_write_bridge
      op: not_equals
      value: true
    - field: metadata.model_output_database_write_bridge
      op: not_equals
      value: true
    - field: metadata.local_file_database_write_bridge
      op: not_equals
      value: true
    - field: metadata.tool_output_database_write_bridge
      op: not_equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_env_access
    - field: metadata.authority_classes
      op: includes
      value: database_write
    - field: metadata.authority_classes
      op: includes
      value: env_secret_database_write_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_env_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_database_query
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_database_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_env_secret_database_write_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - customer_id
        - database_record_id
        - record_id
        - reviewer_note
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined env-secret-to-database bridges until environment-backed secrets cannot be persisted into records by default, database writes use reviewed parameterized fields, sensitive values are tokenized or redacted before persistence, and approval plus audit provenance are required for any break-glass database mutation.
