id: AGENTCSP-TOOL-157
name: Source tool handler forwards env secret into model prompt
description: A source-defined agent tool handler reads environment-backed secret material and forwards it into model-provider prompt, message, input, or content fields.
category: env_secret_prompt_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.handler_model_provider_call
      op: equals
      value: true
    - field: metadata.handler_env_secret_prompt_bridge
      op: equals
      value: true
    - field: metadata.model_provider_call
      op: equals
      value: true
    - field: metadata.env_secret_prompt_bridge
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_env_access
    - field: metadata.authority_classes
      op: includes
      value: model_provider_call
    - field: metadata.authority_classes
      op: includes
      value: env_secret_prompt_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_env_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_model_provider_call
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_env_secret_prompt_bridge
    - field: actions
      op: includes
      value: send
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined env-secret-to-model prompt bridges until environment secrets cannot enter model prompts, prompts are classified and redacted before provider egress, model destinations are policy-owned, provider retention is disabled or bounded, and any secret analysis requires independent approval outside the agent path.
