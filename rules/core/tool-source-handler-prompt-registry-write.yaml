id: AGENTCSP-TOOL-054
name: Source tool handler writes caller-controlled prompt registry content
description: A source-defined agent tool handler uses runtime credentials to publish caller-controlled prompt or instruction content into a remote prompt registry with caller-selected prompt or role selectors, creating a persistent instruction supply-chain path.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM06:2025 Excessive Agency
    - LLM10:2025 Unbounded Consumption
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0053 LLM Plugin Supply Chain Compromise
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_prompt_registry_write
      op: equals
      value: true
    - field: metadata.handler_tainted_prompt_registry_payload
      op: equals
      value: true
    - field: metadata.handler_tainted_prompt_registry_selector
      op: equals
      value: true
    - field: metadata.prompt_registry_write
      op: equals
      value: true
    - field: metadata.tainted_prompt_registry_payload
      op: equals
      value: true
    - field: metadata.tainted_prompt_registry_selector
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: prompt_registry_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_prompt_registry_payload
    - field: metadata.authority_classes
      op: includes
      value: tainted_prompt_registry_selector
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_prompt_registry_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_prompt_registry_payload
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_prompt_registry_selector
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined prompt-registry writers until prompt IDs, roles, namespaces, and versions are policy-owned or allowlisted, prompt content is reviewed and signed before publish, untrusted/customer text cannot become system or developer instructions, and registry writes require human approval with audit trails.
