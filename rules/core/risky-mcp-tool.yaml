id: AGENTCSP-MCP-001
name: MCP server exposes agent-callable authority
description: An MCP server is configured as an agent-callable capability and should be reviewed for tool scope, auth, and side effects.
category: mcp_authority
severity: medium
maps_to:
  owasp:
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
match:
  object_type: mcp_server
  where:
    - field: side_effect
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Review MCP tool schemas, auth scope, network reach, and side effects before enabling runtime policy adapters.
