id: AGENTCSP-TOOL-014
name: Source tool handler mutates local workspace from path input
description: A source-defined agent tool handler performs filesystem mutation or shell execution while accepting path-like input, creating a concrete path from model-controlled arguments to local workspace destruction or host-side effects.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0054 Command and Scripting Interpreter
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.3
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.handler_authority_classes
      op: contains_any
      value:
        - handler_filesystem_delete
        - handler_filesystem_write
        - handler_shell_execution
    - field: metadata.destructive_action
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine source-defined tools that mutate local paths until handlers enforce path allowlists, sandboxed execution, approval gates, and non-recursive safe defaults for model-supplied path arguments.
