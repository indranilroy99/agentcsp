id: AGENTCSP-TOOL-072
name: Source tool handler embeds secrets into vector memory
description: A source-defined agent tool handler reads caller-selected secret-manager material, sends the secret-derived value to an embedding provider with runtime credentials, and persists the resulting vector into memory, RAG, or state storage.
category: secret_manager_embedding_vector_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0059 Data from Information Repositories
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_manager_access
      op: equals
      value: true
    - field: metadata.handler_tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.handler_embedding_provider_call
      op: equals
      value: true
    - field: metadata.handler_tainted_embedding_input
      op: equals
      value: true
    - field: metadata.handler_memory_write
      op: equals
      value: true
    - field: metadata.handler_secret_manager_embedding_vector_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_access
      op: equals
      value: true
    - field: metadata.tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.embedding_provider_call
      op: equals
      value: true
    - field: metadata.tainted_embedding_input
      op: equals
      value: true
    - field: metadata.memory_write
      op: equals
      value: true
    - field: metadata.secret_manager_embedding_vector_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_memory_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_secret_like_input
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_access
    - field: metadata.authority_classes
      op: includes
      value: tainted_secret_manager_path
    - field: metadata.authority_classes
      op: includes
      value: embedding_provider_call
    - field: metadata.authority_classes
      op: includes
      value: tainted_embedding_input
    - field: metadata.authority_classes
      op: includes
      value: memory_write
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_embedding_vector_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_secret_manager_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_embedding_provider_call
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_embedding_input
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_memory_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_embedding_vector_bridge
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: remember
    - field: actions
      op: includes
      value: write
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined secret-to-vector-memory bridges until secret-manager outputs are blocked from embedding providers by default, vector writes require policy-owned namespaces and provenance labels, sensitive text is redacted before embedding, retention is bounded, and approval plus audit trails are required before secret-derived vectors can be replayed into agent context.
