id: AGENTCSP-RUNTIME-080
name: Multi-agent shared memory bridges untrusted intake to privileged executors
description: A multi-agent orchestration routes untrusted intake through automatic delegation into shared memory used by privileged executor agents with browser, database, filesystem, external-response, memory-write, and secret-manager authority without approval.
category: agent_orchestration_shared_memory_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - GOVERN 1.5
    - MAP 5.1
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_orchestration_config
      op: equals
      value: true
    - field: metadata.agent_orchestration_multi_agent
      op: equals
      value: true
    - field: metadata.agent_orchestration_delegation_enabled
      op: equals
      value: true
    - field: metadata.agent_orchestration_delegation_categories
      op: contains_any
      value:
        - automatic_delegation
        - peer_handoff
        - supervisor_routing
    - field: metadata.agent_orchestration_untrusted_input
      op: equals
      value: true
    - field: metadata.agent_orchestration_shared_memory
      op: equals
      value: true
    - field: metadata.agent_orchestration_memory_redacted
      op: equals
      value: true
    - field: metadata.agent_orchestration_privileged_agent
      op: equals
      value: true
    - field: metadata.agent_orchestration_write_authority
      op: equals
      value: true
    - field: metadata.agent_orchestration_external_authority
      op: equals
      value: true
    - field: metadata.agent_orchestration_secret_authority
      op: equals
      value: true
    - field: metadata.agent_orchestration_approval_required
      op: equals
      value: false
    - field: metadata.agent_orchestration_tool_authority_categories
      op: contains_any
      value:
        - browser_action
        - database_access
        - external_response
        - memory_write
        - repo_or_filesystem_write
        - secret_manager_access
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine shared memory written by untrusted intake agents, require approval before handoff to privileged executor agents, isolate memory namespaces per trust boundary, and prevent shared-memory context from granting browser, database, filesystem, external-response, or secret-manager authority.
