id: AGENTCSP-TOOL-077
name: Source tool handler issues credentials from tool output
description: A source-defined agent tool handler invokes a nested tool, captures the raw tool observation, and uses that observation to mint, sign, assume, impersonate, or issue agent credentials.
category: tool_output_credential_issuance_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0059 Data from Information Repositories
    - AML.T0065 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_tool_invocation
      op: equals
      value: true
    - field: metadata.handler_credential_issuance
      op: equals
      value: true
    - field: metadata.handler_tainted_credential_issuance_input
      op: equals
      value: true
    - field: metadata.handler_tool_output_credential_issuance_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.nested_tool_invocation
      op: equals
      value: true
    - field: metadata.credential_issuance
      op: equals
      value: true
    - field: metadata.tainted_credential_issuance_input
      op: equals
      value: true
    - field: metadata.tool_output_credential_issuance_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.accepts_secret_like_input
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: nested_tool_invocation
    - field: metadata.authority_classes
      op: includes
      value: credential_issuance
    - field: metadata.authority_classes
      op: includes
      value: tainted_credential_issuance_input
    - field: metadata.authority_classes
      op: includes
      value: tool_output_credential_issuance_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tool_invocation
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_credential_issuance
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_credential_issuance_input
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tool_output_credential_issuance_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - target_tool_name
        - tool_request_body
        - requested_subject
        - requested_scope
        - token_audience
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - credential
        - confidential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined tool-output-to-credential issuance bridges until nested tool observations are treated as tainted, raw observations cannot become signing keys, token templates, grant material, subjects, scopes, roles, audiences, or impersonation selectors, runtime broker credentials are least-privilege, issued credentials are short-lived, and security-owner approval is required before credential issuance.
