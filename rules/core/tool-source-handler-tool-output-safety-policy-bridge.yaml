id: AGENTCSP-TOOL-088
name: Source tool handler weakens safety policy from tool output
description: A source-defined agent tool handler invokes a nested tool and uses the raw tool observation to update guardrail, approval, moderation, or safety policy while weakening enforcement.
category: tool_output_safety_policy_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0054 LLM Data Poisoning
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_tool_invocation
      op: equals
      value: true
    - field: metadata.handler_safety_policy_write
      op: equals
      value: true
    - field: metadata.handler_tainted_safety_policy_payload
      op: equals
      value: true
    - field: metadata.handler_tainted_safety_policy_selector
      op: equals
      value: true
    - field: metadata.handler_safety_policy_weakening
      op: equals
      value: true
    - field: metadata.handler_tool_output_safety_policy_bridge
      op: equals
      value: true
    - field: metadata.nested_tool_invocation
      op: equals
      value: true
    - field: metadata.safety_policy_write
      op: equals
      value: true
    - field: metadata.tainted_safety_policy_payload
      op: equals
      value: true
    - field: metadata.tainted_safety_policy_selector
      op: equals
      value: true
    - field: metadata.safety_policy_weakening
      op: equals
      value: true
    - field: metadata.tool_output_safety_policy_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: nested_tool_invocation
    - field: metadata.authority_classes
      op: includes
      value: safety_policy_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_safety_policy_payload
    - field: metadata.authority_classes
      op: includes
      value: tainted_safety_policy_selector
    - field: metadata.authority_classes
      op: includes
      value: safety_policy_weakening
    - field: metadata.authority_classes
      op: includes
      value: tool_output_safety_policy_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tool_invocation
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_safety_policy_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_safety_policy_payload
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_safety_policy_selector
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_safety_policy_weakening
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tool_output_safety_policy_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - override_reason
        - policy_id
        - target_control_id
        - target_tool_name
        - tool_request_body
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine tool-output-to-safety-policy bridges until nested tool observations are classified and approved before policy use, safety targets are config-owned, default-allow or disabled modes are rejected, and guardrail or approval-policy writes require separate human authorization with provenance.
