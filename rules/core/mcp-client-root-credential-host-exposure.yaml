id: AGENTCSP-MCP-014
name: Remote MCP server receives credential and host root client roots
description: A remote credential-backed MCP server is configured with client roots that include credential paths and host root filesystem scope while root exposure approval is missing.
category: mcp_client_root_exposure
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
    - LLM10:2025 Unbounded Consumption
  mitre_atlas:
    - AML.T0054 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.3
match:
  object_type: mcp_server
  where:
    - field: metadata.remote
      op: equals
      value: true
    - field: metadata.mcp_roots_redacted
      op: equals
      value: true
    - field: metadata.mcp_root_broad_scope
      op: equals
      value: true
    - field: metadata.mcp_root_credential_scope
      op: equals
      value: true
    - field: metadata.mcp_root_host_scope
      op: equals
      value: true
    - field: metadata.mcp_root_sensitive_scope
      op: equals
      value: true
    - field: metadata.mcp_root_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
    - field: external_reach
      op: equals
      value: true
recommendation:
  control: deny
  text: Remove host root and credential-path client roots from remote MCP servers, restrict roots to task-scoped project directories, require explicit approval before exposing local roots to remote servers, and isolate credential material from any MCP client-root boundary.
