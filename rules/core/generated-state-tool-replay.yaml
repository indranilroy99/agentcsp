id: AGENTCSP-GENSTATE-001
name: Generated agent state can replay tool directive
description: A transcript, log, cached output, or generated state file contains instruction-like content with tool or external directives, creating a replay path into future agent runs.
category: generated_state_replay
severity: high
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM06:2025 Excessive Agency
    - LLM08:2025 Vector and Embedding Weaknesses
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
match:
  object_type: memory
  where:
    - field: metadata.content_analyzed
      op: equals
      value: true
    - field: metadata.generated_state
      op: equals
      value: true
    - field: metadata.instruction_like_content
      op: equals
      value: true
    - field: metadata.tool_directive
      op: equals
      value: true
    - field: metadata.external_directive
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine generated state before it can be replayed into future agent context, and strip tool or external directives from persisted transcripts and cached outputs.
