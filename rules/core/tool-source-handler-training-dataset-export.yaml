id: AGENTCSP-TOOL-047
name: Source tool handler exports caller context into training dataset
description: A source-defined agent tool handler writes caller-controlled prompt, customer, completion, or tool-output content into an AI training or fine-tuning dataset using runtime credentials, creating sensitive-data retention and model-poisoning risk.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM04:2025 Data and Model Poisoning
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_training_dataset_export
      op: equals
      value: true
    - field: metadata.handler_tainted_training_dataset_payload
      op: equals
      value: true
    - field: metadata.training_dataset_export
      op: equals
      value: true
    - field: metadata.tainted_training_dataset_payload
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: training_dataset_export
    - field: metadata.authority_classes
      op: includes
      value: tainted_training_dataset_payload
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_training_dataset_export
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_training_dataset_payload
    - field: metadata.external_write
      op: equals
      value: true
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined training dataset exporters until dataset writes are separated from agent tools, payloads are classified and redacted, customer opt-in and retention controls are enforced, poisoning-resistant review gates exist, and runtime credentials are scoped to approved dataset sinks.
