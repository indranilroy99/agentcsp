id: AGENTCSP-RUNTIME-059
name: Agent workspace context sync exposes sensitive local files
description: An agent workspace-context sync configuration can automatically ingest sensitive local files, credential paths, or repository-wide context into remote model, RAG, or memory surfaces while untrusted selectors are allowed, redaction is disabled, and approval is missing.
category: workspace_context_exposure
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_workspace_context_config
      op: equals
      value: true
    - field: metadata.agent_workspace_context_enabled
      op: equals
      value: true
    - field: metadata.agent_workspace_context_auto_sync_enabled
      op: equals
      value: true
    - field: metadata.agent_workspace_context_remote_sync
      op: equals
      value: true
    - field: metadata.agent_workspace_context_sensitive_paths
      op: equals
      value: true
    - field: metadata.agent_workspace_context_secret_path_exposure
      op: equals
      value: true
    - field: metadata.agent_workspace_context_untrusted_input
      op: equals
      value: true
    - field: metadata.agent_workspace_context_redaction_disabled
      op: equals
      value: true
    - field: metadata.agent_workspace_context_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: redact
  text: Scope workspace context sync to explicit low-risk paths, deny env files and credential directories, respect .agentcspignore, redact secrets before model or remote indexing, and require approval before untrusted context can select files for prompt, RAG, memory, or remote sync.
