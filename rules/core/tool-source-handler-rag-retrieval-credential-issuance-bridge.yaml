id: AGENTCSP-TOOL-179
name: Source tool handler issues credentials from retrieved RAG context
description: A source-defined agent tool handler retrieves caller-selected RAG or vector content and uses the retrieved chunks to mint, sign, assume, impersonate, or issue agent credentials.
category: rag_retrieval_credential_issuance_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_rag_retrieval
      op: equals
      value: true
    - field: metadata.handler_tainted_rag_retrieval_query
      op: equals
      value: true
    - field: metadata.handler_credential_issuance
      op: equals
      value: true
    - field: metadata.handler_tainted_credential_issuance_input
      op: equals
      value: true
    - field: metadata.handler_rag_retrieval_credential_issuance_bridge
      op: equals
      value: true
    - field: metadata.rag_retrieval
      op: equals
      value: true
    - field: metadata.tainted_rag_retrieval_query
      op: equals
      value: true
    - field: metadata.credential_issuance
      op: equals
      value: true
    - field: metadata.tainted_credential_issuance_input
      op: equals
      value: true
    - field: metadata.rag_retrieval_credential_issuance_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.local_file_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.env_secret_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.network_response_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.model_output_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.tool_output_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: rag_retrieval
    - field: metadata.authority_classes
      op: includes
      value: tainted_rag_retrieval_query
    - field: metadata.authority_classes
      op: includes
      value: credential_issuance
    - field: metadata.authority_classes
      op: includes
      value: tainted_credential_issuance_input
    - field: metadata.authority_classes
      op: includes
      value: rag_retrieval_credential_issuance_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_rag_retrieval
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_rag_retrieval_query
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_credential_issuance
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_credential_issuance_input
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_rag_retrieval_credential_issuance_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - customer_id
        - account_id
        - tenant_id
    - field: metadata.schema_properties
      op: contains_any
      value:
        - retrieval_query_text
        - retrieval_query
        - vector_namespace
        - retrieval_namespace
        - collection
        - collection_name
    - field: metadata.schema_properties
      op: contains_any
      value:
        - requested_subject
        - requested_scope
        - token_audience
        - requester_ticket
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine retrieved-context-to-credential issuance bridges until retrieval selectors and namespaces are policy-owned or allowlisted, retrieved chunks carry provenance and trust labels, retrieved text cannot become signing keys, token templates, grant material, subjects, scopes, roles, audiences, or impersonation selectors, runtime issuer credentials are least-privilege, issued credentials are short-lived and audience-bound, and security-owner approval plus audit provenance are required before credential issuance.
