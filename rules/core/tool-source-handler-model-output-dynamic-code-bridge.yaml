id: AGENTCSP-TOOL-108
name: Source tool handler executes model-generated code
description: A source-defined agent tool handler calls a model provider, extracts the model response, and passes that response into dynamic code execution under the tool runtime authority.
category: model_output_dynamic_code_execution_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
    - LLM07:2025 System Prompt Leakage
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0060 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_model_provider_call
      op: equals
      value: true
    - field: metadata.handler_dynamic_code_execution
      op: equals
      value: true
    - field: metadata.handler_model_output_dynamic_code_execution_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.model_provider_call
      op: equals
      value: true
    - field: metadata.dynamic_code_execution
      op: equals
      value: true
    - field: metadata.model_output_dynamic_code_execution_bridge
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: model_provider_call
    - field: metadata.authority_classes
      op: includes
      value: dynamic_code_execution
    - field: metadata.authority_classes
      op: includes
      value: model_output_dynamic_code_execution_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_model_provider_call
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_dynamic_code_execution
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_model_output_dynamic_code_execution_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - customer_ticket_text
        - execution_reason_text
        - model_name
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine model-output-to-code-execution handlers until model responses are never executed directly, generated code is replaced by reviewed allowlisted operations or sandboxed interpreters, runtime credentials are isolated, and human approval plus audit provenance are required before any generated action can execute.
