id: AGENTCSP-TOOL-143
name: Local file content written to database
description: A source-defined agent tool handler reads a caller-selected local file path and writes the file material into a customer or operational database using runtime database credentials.
category: local_file_database_write_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_filesystem_read
      op: equals
      value: true
    - field: metadata.handler_tainted_filesystem_path
      op: equals
      value: true
    - field: metadata.handler_database_query
      op: equals
      value: true
    - field: metadata.handler_database_write
      op: equals
      value: true
    - field: metadata.handler_local_file_database_write_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.tainted_filesystem_path
      op: equals
      value: true
    - field: metadata.database_access
      op: equals
      value: true
    - field: metadata.database_write
      op: equals
      value: true
    - field: metadata.local_file_database_write_bridge
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: filesystem_read
    - field: metadata.authority_classes
      op: includes
      value: tainted_filesystem_path
    - field: metadata.authority_classes
      op: includes
      value: database_write
    - field: metadata.authority_classes
      op: includes
      value: local_file_database_write_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_filesystem_read
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_filesystem_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_database_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_local_file_database_write_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - customer_id
        - database_record_id
        - local_file_path
        - record_id
        - reviewer_note
        - workspace_path
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine local-file-to-database handlers until local file reads are allowlisted, file contents are classified and redacted, database writes use reviewed parameterized fields with least-privilege credentials, and approval plus audit provenance protect every customer or operational record mutation.
