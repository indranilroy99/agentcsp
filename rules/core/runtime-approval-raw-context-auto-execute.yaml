id: AGENTCSP-RUNTIME-078
name: Approval request forwards raw untrusted context into auto-executed actions
description: A human approval request forwards raw untrusted customer, retrieval, or tool context through an external approval channel and then auto-executes privileged write, browser, external, or secret-backed actions.
category: approval_prompt_injection
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - GOVERN 1.5
    - MAP 5.1
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_approval_config
      op: equals
      value: true
    - field: metadata.agent_approval_human_required
      op: equals
      value: true
    - field: metadata.agent_approval_external_channel
      op: equals
      value: true
    - field: metadata.agent_approval_context_untrusted
      op: equals
      value: true
    - field: metadata.agent_approval_raw_context_included
      op: equals
      value: true
    - field: metadata.agent_approval_auto_execute_after_approval
      op: equals
      value: true
    - field: metadata.agent_approval_privileged_actions
      op: equals
      value: true
    - field: metadata.agent_approval_write_actions
      op: equals
      value: true
    - field: metadata.agent_approval_external_actions
      op: equals
      value: true
    - field: metadata.agent_approval_secret_access
      op: equals
      value: true
    - field: metadata.agent_approval_prompt_source_categories
      op: contains_any
      value:
        - retrieval_context
        - tool_output
        - untrusted_user_input
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Remove raw untrusted context from approval requests, show reviewers a sanitized summary with source provenance, require a separate execution approval for write or secret-backed actions, and keep external approval channels from directly invoking approved actions.
