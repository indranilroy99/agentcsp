id: AGENTCSP-TOOL-055
name: Source tool handler auto-promotes feedback into model improvement
description: A source-defined agent tool handler uses runtime credentials to record caller-controlled feedback and raw agent context into feedback, RLHF, eval, or model-improvement pipelines with caller-selected promotion routing.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM06:2025 Excessive Agency
    - LLM08:2025 Vector and Embedding Weaknesses
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0053 LLM Plugin Supply Chain Compromise
    - AML.T0054 LLM Data Poisoning
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_feedback_pipeline_write
      op: equals
      value: true
    - field: metadata.handler_tainted_feedback_payload
      op: equals
      value: true
    - field: metadata.handler_feedback_auto_promotion
      op: equals
      value: true
    - field: metadata.handler_tainted_feedback_routing
      op: equals
      value: true
    - field: metadata.feedback_pipeline_write
      op: equals
      value: true
    - field: metadata.tainted_feedback_payload
      op: equals
      value: true
    - field: metadata.feedback_auto_promotion
      op: equals
      value: true
    - field: metadata.tainted_feedback_routing
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: feedback_pipeline_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_feedback_payload
    - field: metadata.authority_classes
      op: includes
      value: feedback_auto_promotion
    - field: metadata.authority_classes
      op: includes
      value: tainted_feedback_routing
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_feedback_pipeline_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_feedback_payload
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_feedback_auto_promotion
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_feedback_routing
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: remember
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined feedback and RLHF writers until feedback records are redacted, consented, reviewed, and signed before promotion; training, eval, reward-model, and model-update destinations are policy-owned; and caller/customer text cannot auto-promote into future model behavior without human approval and auditable provenance.
