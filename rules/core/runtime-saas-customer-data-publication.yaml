id: AGENTCSP-RUNTIME-110
name: SaaS connector can publish untrusted customer data
description: A messaging SaaS connector combines credential-backed read and write scopes with untrusted customer or retrieval context, sensitive and PII-bearing data, external publication authority, and no approval gate.
category: saas_connector_customer_data_publication
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0054 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_saas_connector_config
      op: equals
      value: true
    - field: metadata.saas_connector_provider
      op: equals
      value: slack
    - field: metadata.saas_connector_external_reach
      op: equals
      value: true
    - field: metadata.saas_connector_destination_redacted
      op: equals
      value: true
    - field: metadata.saas_connector_scope_redacted
      op: equals
      value: true
    - field: metadata.saas_connector_scope_categories
      op: includes
      value: messaging_read
    - field: metadata.saas_connector_scope_categories
      op: includes
      value: messaging_write
    - field: metadata.saas_connector_broad_scope
      op: equals
      value: true
    - field: metadata.saas_connector_read_enabled
      op: equals
      value: true
    - field: metadata.saas_connector_external_write_enabled
      op: equals
      value: true
    - field: metadata.saas_connector_untrusted_input
      op: equals
      value: true
    - field: metadata.saas_connector_sensitive_data
      op: equals
      value: true
    - field: metadata.saas_connector_pii_data
      op: equals
      value: true
    - field: metadata.saas_connector_approval_required
      op: equals
      value: false
    - field: data_classes
      op: includes
      value: credential
    - field: data_classes
      op: includes
      value: confidential
    - field: data_classes
      op: includes
      value: pii
    - field: actions
      op: includes
      value: publish
    - field: actions
      op: includes
      value: write
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Split messaging read and write credentials, remove write scopes from untrusted-context paths, redact customer data before publication, and require approval before agent-generated or retrieved content can post or upload through SaaS connectors.
