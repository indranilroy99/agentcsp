id: AGENTCSP-RUNTIME-127
name: MCP OAuth client allows wildcard callback capture
description: An MCP OAuth client uses dynamic public-client registration with wildcard or user-selected redirect callbacks, disabled redirect validation, disabled PKCE and state checks, broad delegated scopes, persisted refresh tokens, and token forwarding to untrusted MCP servers without approval.
category: mcp_oauth_redirect_capture
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Supply Chain Vulnerabilities
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0018 Supply Chain Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_mcp_authorization_config
      op: equals
      value: true
    - field: metadata.mcp_authorization_provider
      op: equals
      value: mcp_oauth
    - field: metadata.mcp_authorization_remote
      op: equals
      value: true
    - field: metadata.mcp_authorization_dynamic_client_registration
      op: equals
      value: true
    - field: metadata.mcp_authorization_public_client
      op: equals
      value: true
    - field: metadata.mcp_authorization_wildcard_redirect_uri
      op: equals
      value: true
    - field: metadata.mcp_authorization_user_or_model_selected_redirect_uri
      op: equals
      value: true
    - field: metadata.mcp_authorization_redirect_validation_disabled
      op: equals
      value: true
    - field: metadata.mcp_authorization_pkce_disabled
      op: equals
      value: true
    - field: metadata.mcp_authorization_state_validation_disabled
      op: equals
      value: true
    - field: metadata.mcp_authorization_resource_indicator_missing
      op: equals
      value: true
    - field: metadata.mcp_authorization_broad_scope
      op: equals
      value: true
    - field: metadata.mcp_authorization_sensitive_scope
      op: equals
      value: true
    - field: metadata.mcp_authorization_pii_scope
      op: equals
      value: true
    - field: metadata.mcp_authorization_refresh_token_storage
      op: equals
      value: true
    - field: metadata.mcp_authorization_token_forwarding
      op: equals
      value: true
    - field: metadata.mcp_authorization_untrusted_server
      op: equals
      value: true
    - field: metadata.mcp_authorization_approval_required
      op: equals
      value: false
    - field: data_classes
      op: contains_any
      value:
        - secret
    - field: data_classes
      op: contains_any
      value:
        - pii
    - field: actions
      op: contains_any
      value:
        - remember
    - field: actions
      op: contains_any
      value:
        - send
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine MCP OAuth clients that allow wildcard or user-selected redirect callbacks; require exact registered redirect URIs, PKCE, state validation, audience/resource binding, server allowlists, scoped tokens per MCP resource, and approval before delegated credentials can be issued or forwarded.
