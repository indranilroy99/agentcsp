id: AGENTCSP-RUNTIME-075
name: Agent authorization broker issues fail-open persistent grants
description: An agent authorization broker can issue dynamic wildcard tool or resource grants from untrusted subjects, defaults open or fails open, omits grant TTLs and audit logging, and exposes destructive or secret-backed authority without approval.
category: authorization_fail_open_grants
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - GOVERN 1.5
    - MAP 5.1
    - MANAGE 2.2
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_authorization_broker_config
      op: equals
      value: true
    - field: metadata.agent_authorization_enabled
      op: equals
      value: true
    - field: metadata.agent_authorization_dynamic_grants_enabled
      op: equals
      value: true
    - field: metadata.agent_authorization_untrusted_subject
      op: equals
      value: true
    - field: metadata.agent_authorization_untrusted_resource
      op: equals
      value: true
    - field: metadata.agent_authorization_default_allow_or_fail_open
      op: equals
      value: true
    - field: metadata.agent_authorization_wildcard_tool_scope
      op: equals
      value: true
    - field: metadata.agent_authorization_wildcard_resource_scope
      op: equals
      value: true
    - field: metadata.agent_authorization_grant_ttl_missing
      op: equals
      value: true
    - field: metadata.agent_authorization_audit_disabled
      op: equals
      value: true
    - field: metadata.agent_authorization_destructive_authority
      op: equals
      value: true
    - field: metadata.agent_authorization_secret_authority
      op: equals
      value: true
    - field: metadata.agent_authorization_approval_required
      op: equals
      value: false
    - field: data_classes
      op: contains_any
      value:
        - credential
        - confidential
        - pii
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: deny
  text: Default authorization brokers to deny, require explicit TTLs and audit logs for every grant, remove wildcard tool and resource scopes, block fail-open grant paths, and require approval before untrusted subjects can receive destructive or secret-backed authority.
