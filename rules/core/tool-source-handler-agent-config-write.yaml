id: AGENTCSP-TOOL-024
name: Source tool handler rewrites agent control-plane files
description: A source-defined agent tool handler writes caller or customer supplied content into persistent agent control-plane files such as instructions, prompts, policy, runtime config, MCP config, or tool catalogs, creating a direct self-modification path for future agent behavior.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_agent_config_write
      op: equals
      value: true
    - field: metadata.agent_config_write
      op: equals
      value: true
    - field: metadata.handler_filesystem_write
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: agent_config_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_agent_config_write
    - field: actions
      op: includes
      value: write
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined agent control-plane writers until untrusted content cannot modify instructions, prompts, policies, runtime config, MCP config, or tool definitions; require human approval, signed change review, rollback checkpoints, and provenance before any persistent agent behavior update is applied.
