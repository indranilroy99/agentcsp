id: AGENTCSP-RUNTIME-022
name: Context composer promotes untrusted context into privileged roles
description: A prompt or context composer places untrusted customer, retrieval, tool, browser, or memory context into system or developer role assembly while privileged tools remain available and sanitization or delimiting is disabled.
category: context_role_boundary
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_context_composer_config
      op: equals
      value: true
    - field: metadata.agent_context_composer_untrusted_sources
      op: equals
      value: true
    - field: metadata.agent_context_composer_privileged_role_injection
      op: equals
      value: true
    - field: metadata.agent_context_composer_privileged_tool_authority
      op: equals
      value: true
    - field: metadata.agent_context_composer_sanitization_disabled
      op: equals
      value: true
    - field: metadata.agent_context_composer_delimiter_disabled
      op: equals
      value: true
    - field: metadata.agent_context_composer_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Keep untrusted retrieval, browser, tool-output, memory, and customer context out of system and developer roles; place it in delimited user/context blocks, sanitize tool outputs, and require approval before privileged tools can consume composed context.
