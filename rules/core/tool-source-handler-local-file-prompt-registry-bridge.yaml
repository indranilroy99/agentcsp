id: AGENTCSP-TOOL-171
name: Source tool handler publishes local file material to prompt registry
description: A source-defined agent tool handler reads a caller-selected local file and publishes the file material into a prompt or instruction registry using runtime credentials and caller-selected prompt metadata.
category: local_file_prompt_registry_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0053 LLM Plugin Supply Chain Compromise
    - AML.T0059 Data from Information Repositories
    - AML.T0065 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_filesystem_read
      op: equals
      value: true
    - field: metadata.handler_tainted_filesystem_path
      op: equals
      value: true
    - field: metadata.handler_prompt_registry_write
      op: equals
      value: true
    - field: metadata.handler_local_file_prompt_registry_bridge
      op: equals
      value: true
    - field: metadata.handler_tainted_prompt_registry_selector
      op: equals
      value: true
    - field: metadata.tainted_filesystem_path
      op: equals
      value: true
    - field: metadata.prompt_registry_write
      op: equals
      value: true
    - field: metadata.local_file_prompt_registry_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_prompt_registry_bridge
      op: equals
      value: false
    - field: metadata.env_secret_prompt_registry_bridge
      op: equals
      value: false
    - field: metadata.model_output_prompt_registry_bridge
      op: equals
      value: false
    - field: metadata.network_response_prompt_registry_bridge
      op: equals
      value: false
    - field: metadata.tool_output_prompt_registry_bridge
      op: equals
      value: false
    - field: metadata.tainted_prompt_registry_selector
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: filesystem_access
    - field: metadata.authority_classes
      op: includes
      value: tainted_filesystem_path
    - field: metadata.authority_classes
      op: includes
      value: prompt_registry_write
    - field: metadata.authority_classes
      op: includes
      value: local_file_prompt_registry_bridge
    - field: metadata.authority_classes
      op: includes
      value: tainted_prompt_registry_selector
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_filesystem_read
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_filesystem_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_prompt_registry_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_local_file_prompt_registry_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_prompt_registry_selector
    - field: metadata.schema_properties
      op: contains_any
      value:
        - local_file_path
        - workspace_path
        - prompt_id
        - prompt_name
        - prompt_role
        - registry_namespace
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: publish
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine local-file-to-prompt-registry bridges until file paths and prompt registry selectors are policy-owned or allowlisted, local file material cannot become system or developer prompt content without review, prompt entries are signed, version-pinned, and rollbackable, and registry writes require approval plus audit provenance.
