id: AGENTCSP-TOOL-203
name: Source tool handler exports clipboard contents to public artifacts
description: A source-defined agent tool handler reads browser or desktop clipboard material and exports copied text into public or shareable artifact storage using runtime credentials.
category: clipboard_artifact_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_clipboard_read
      op: equals
      value: true
    - field: metadata.handler_artifact_export
      op: equals
      value: true
    - field: metadata.handler_tainted_artifact_export_payload
      op: equals
      value: true
    - field: metadata.handler_public_artifact_destination
      op: equals
      value: true
    - field: metadata.handler_clipboard_artifact_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.clipboard_read
      op: equals
      value: true
    - field: metadata.artifact_export
      op: equals
      value: true
    - field: metadata.tainted_artifact_export_payload
      op: equals
      value: true
    - field: metadata.public_artifact_destination
      op: equals
      value: true
    - field: metadata.clipboard_artifact_bridge
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: clipboard_read
    - field: metadata.authority_classes
      op: includes
      value: artifact_export
    - field: metadata.authority_classes
      op: includes
      value: tainted_artifact_export_payload
    - field: metadata.authority_classes
      op: includes
      value: public_artifact_destination
    - field: metadata.authority_classes
      op: includes
      value: clipboard_artifact_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_clipboard_read
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_artifact_export
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_artifact_export_payload
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_public_artifact_destination
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_clipboard_artifact_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - customer_id
        - artifact_bucket
        - artifact_key
        - clipboard_artifact_note_text
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: publish
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine clipboard-to-artifact export handlers until clipboard material is treated as untrusted, public or shareable artifact destinations are denied by default, copied text is classified and redacted before export, artifact buckets and object keys are policy-owned, and approval plus audit evidence are required before desktop or browser clipboard content can become durable run output.
