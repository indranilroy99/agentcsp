id: AGENTCSP-RUNTIME-070
name: Public reasoning state exposes model internals
description: An agent reasoning-state or scratchpad configuration captures reasoning traces or tool observations into shared or public remote state while redaction, access controls, and approval are disabled.
category: reasoning_state_public_exposure
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_reasoning_state_config
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_enabled
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_capture_enabled
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_capture_categories
      op: contains_any
      value:
        - reasoning_trace
        - tool_observation
        - prompt_context
    - field: metadata.agent_reasoning_state_remote
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_shared
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_public_access
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_redaction_disabled
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_access_control_disabled
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_approval_required
      op: equals
      value: false
    - field: data_classes
      op: contains_any
      value:
        - credential
        - confidential
        - pii
recommendation:
  control: redact
  text: Keep reasoning state private by default, disable public scratchpad access, enforce RBAC and tenant isolation, redact reasoning traces and tool observations before persistence, and require approval before shared reasoning state can be viewed outside the agent runtime.
