id: AGENTCSP-RUNTIME-007
name: Runtime auto-approves broad web access
description: An agent runtime configuration auto-approves broad web access while exposing credential key names, creating a concrete path from agent-controlled context to external network reach without per-call review.
category: runtime_posture
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - GOVERN 1.5
    - MANAGE 2.3
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_runtime_config
      op: equals
      value: true
    - field: metadata.auto_approved_broad_network_scope
      op: equals
      value: true
    - field: metadata.network_enabled
      op: equals
      value: true
    - field: metadata.secret_env_exposure
      op: equals
      value: true
    - field: metadata.approval_bypass
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Remove wildcard or unscoped web permissions, restrict network destinations to explicit approved domains, and require per-call approval before agent-controlled context can use external web access with credential-backed runtime state.
