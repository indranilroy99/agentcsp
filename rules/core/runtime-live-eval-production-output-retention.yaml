id: AGENTCSP-RUNTIME-096
name: Production red-team eval records privileged tool outputs
description: A live adversarial eval harness targets a production agent, invokes privileged tools with external write authority, records sensitive tool outputs and eval results, exposes credentials, and lacks an approval gate.
category: live_eval_production_output_retention
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0054 LLM Jailbreak
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_ai_eval_harness_config
      op: equals
      value: true
    - field: metadata.ai_eval_live_execution
      op: equals
      value: true
    - field: metadata.ai_eval_adversarial_cases
      op: equals
      value: true
    - field: metadata.ai_eval_untrusted_prompts
      op: equals
      value: true
    - field: metadata.ai_eval_invokes_agent
      op: equals
      value: true
    - field: metadata.ai_eval_invokes_tools
      op: equals
      value: true
    - field: metadata.ai_eval_tool_authority_categories
      op: contains_any
      value:
        - browser_action
        - database_access
        - external_response
        - secret_manager_access
    - field: metadata.ai_eval_write_authority
      op: equals
      value: true
    - field: metadata.ai_eval_external_write_authority
      op: equals
      value: true
    - field: metadata.ai_eval_remote_target
      op: equals
      value: true
    - field: metadata.ai_eval_production_target
      op: equals
      value: true
    - field: metadata.ai_eval_records_outputs
      op: equals
      value: true
    - field: metadata.ai_eval_sensitive_data
      op: equals
      value: true
    - field: metadata.ai_eval_pii_data
      op: equals
      value: true
    - field: metadata.ai_eval_secret_exposure
      op: equals
      value: true
    - field: metadata.ai_eval_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine adversarial eval suites away from production agents, run red-team cases against isolated staging targets, disable production credentials and external writes during evals, avoid retaining raw tool outputs or sensitive results, and require approval before any live eval can invoke privileged tools.
