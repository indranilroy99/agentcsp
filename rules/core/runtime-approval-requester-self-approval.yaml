id: AGENTCSP-RUNTIME-119
name: Requester can self-approve privileged agent actions
description: A human approval gate allows the requester or payload-provided approver to approve their own privileged action through an unauthenticated external channel that auto-executes write, external, or secret-backed actions.
category: approval_self_authorization_bypass
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - GOVERN 1.5
    - MAP 5.1
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_approval_config
      op: equals
      value: true
    - field: metadata.agent_approval_human_required
      op: equals
      value: true
    - field: metadata.agent_approval_external_channel
      op: equals
      value: true
    - field: metadata.agent_approval_channel_auth_disabled
      op: equals
      value: true
    - field: metadata.agent_approval_approver_identity_unverified
      op: equals
      value: true
    - field: metadata.agent_approval_requester_self_approval
      op: equals
      value: true
    - field: metadata.agent_approval_replay_protection_disabled
      op: equals
      value: true
    - field: metadata.agent_approval_broad_approver_scope
      op: equals
      value: true
    - field: metadata.agent_approval_context_untrusted
      op: equals
      value: true
    - field: metadata.agent_approval_raw_context_included
      op: equals
      value: true
    - field: metadata.agent_approval_auto_execute_after_approval
      op: equals
      value: true
    - field: metadata.agent_approval_privileged_actions
      op: equals
      value: true
    - field: metadata.agent_approval_write_actions
      op: equals
      value: true
    - field: metadata.agent_approval_external_actions
      op: equals
      value: true
    - field: metadata.agent_approval_secret_access
      op: equals
      value: true
    - field: data_classes
      op: contains_any
      value:
        - credential
    - field: data_classes
      op: contains_any
      value:
        - pii
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: deny
  text: Deny self-approval for requester-originated agent actions; require SSO-backed approver identity, approver/requester separation, signed approval requests, replay protection, scoped approver allowlists, and a separate execution approval before privileged actions run.
