id: AGENTCSP-RUNTIME-086
name: Model gateway logs unredacted sensitive agent requests
description: A remote or custom AI model gateway receives prompts, tool outputs, retrieval context, memory, and PII from untrusted agent context while raw request logging is enabled, redaction is disabled, credential references are present, and approval is missing.
category: model_gateway_logging_boundary
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_ai_model_config
      op: equals
      value: true
    - field: metadata.ai_model_remote_endpoint
      op: equals
      value: true
    - field: metadata.ai_model_custom_endpoint
      op: equals
      value: true
    - field: metadata.ai_model_public_endpoint
      op: equals
      value: false
    - field: metadata.ai_model_auth_disabled
      op: equals
      value: false
    - field: metadata.ai_model_sends_prompts
      op: equals
      value: true
    - field: metadata.ai_model_sends_tool_outputs
      op: equals
      value: true
    - field: metadata.ai_model_sends_retrieval_context
      op: equals
      value: true
    - field: metadata.ai_model_sends_memory
      op: equals
      value: true
    - field: metadata.ai_model_sensitive_context
      op: equals
      value: true
    - field: metadata.ai_model_pii_context
      op: equals
      value: true
    - field: metadata.ai_model_untrusted_input
      op: equals
      value: true
    - field: metadata.ai_model_request_logging_enabled
      op: equals
      value: true
    - field: metadata.ai_model_redaction_disabled
      op: equals
      value: true
    - field: metadata.ai_model_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: redact
  text: Disable raw model-gateway request logging for agent traffic, redact prompts, tool outputs, retrieval context, memory, and PII before gateway persistence, isolate gateway logs by trust boundary, and require approval before untrusted context can be sent to logging-enabled model gateways.
