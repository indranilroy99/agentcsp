id: AGENTCSP-TOOL-155
name: Source tool handler issues credentials from environment secrets
description: A source-defined agent tool handler reads environment-backed signing, broker, or grant material and uses that secret-derived value to mint, sign, assume, impersonate, or issue agent credentials.
category: env_secret_credential_issuance_bridge
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.handler_credential_issuance
      op: equals
      value: true
    - field: metadata.handler_tainted_credential_issuance_input
      op: equals
      value: true
    - field: metadata.handler_env_secret_credential_issuance_bridge
      op: equals
      value: true
    - field: metadata.credential_issuance
      op: equals
      value: true
    - field: metadata.tainted_credential_issuance_input
      op: equals
      value: true
    - field: metadata.env_secret_credential_issuance_bridge
      op: equals
      value: true
    - field: metadata.accepts_secret_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: credential_issuance
    - field: metadata.authority_classes
      op: includes
      value: tainted_credential_issuance_input
    - field: metadata.authority_classes
      op: includes
      value: env_secret_credential_issuance_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_env_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_credential_issuance
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_credential_issuance_input
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_env_secret_credential_issuance_bridge
    - field: metadata.handler_env_key_names
      op: contains_any
      value:
        - SOURCE_AGENT_SIGNING_PRIVATE_KEY
        - LANGCHAIN_AGENT_SIGNING_PRIVATE_KEY
        - SOURCE_ENV_SECRET_CREDENTIAL_ISSUER_TOKEN
        - LANGCHAIN_ENV_SECRET_CREDENTIAL_ISSUER_TOKEN
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined env-secret-to-credential issuance bridges until environment secrets cannot become signing keys, token templates, grant material, subjects, scopes, roles, audiences, or impersonation selectors, credential broker authority is moved behind a managed KMS or broker policy boundary, issued credentials are short-lived and audience-bound, and security-owner approval plus audit provenance are required before credential issuance.
