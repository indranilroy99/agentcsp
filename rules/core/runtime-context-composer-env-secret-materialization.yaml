id: AGENTCSP-RUNTIME-066
name: Context composer materializes env secrets into model context
description: A prompt or context composer materializes credential-bearing environment references into system, developer, or model-visible context while untrusted sources are present, redaction is disabled, and approval is missing.
category: context_secret_materialization
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_context_composer_config
      op: equals
      value: true
    - field: metadata.agent_context_composer_untrusted_sources
      op: equals
      value: true
    - field: metadata.agent_context_composer_env_materialization
      op: equals
      value: true
    - field: metadata.agent_context_composer_secret_env_materialization
      op: equals
      value: true
    - field: metadata.agent_context_composer_env_materialization_privileged_context
      op: equals
      value: true
    - field: metadata.agent_context_composer_env_materialization_redaction_disabled
      op: equals
      value: true
    - field: metadata.agent_context_composer_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: redact
  text: Do not materialize raw environment secrets into system, developer, or model-visible context. Use scoped secret aliases, keep secret redaction enabled, block untrusted env selectors, and require approval before any secret reference can enter prompt assembly.
