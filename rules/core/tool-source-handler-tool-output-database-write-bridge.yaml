id: AGENTCSP-TOOL-078
name: Source tool handler writes raw tool output to database
description: A source-defined agent tool handler invokes a nested tool, captures the raw tool observation, and writes that observation into a database or record store using runtime authority.
category: tool_output_database_write_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0059 Data from Information Repositories
    - AML.T0063 Poison Training Data
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_tool_invocation
      op: equals
      value: true
    - field: metadata.handler_database_query
      op: equals
      value: true
    - field: metadata.handler_database_write
      op: equals
      value: true
    - field: metadata.handler_tool_output_database_write_bridge
      op: equals
      value: true
    - field: metadata.nested_tool_invocation
      op: equals
      value: true
    - field: metadata.database_access
      op: equals
      value: true
    - field: metadata.database_write
      op: equals
      value: true
    - field: metadata.tool_output_database_write_bridge
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: nested_tool_invocation
    - field: metadata.authority_classes
      op: includes
      value: database_write
    - field: metadata.authority_classes
      op: includes
      value: tool_output_database_write_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tool_invocation
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_database_query
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_database_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tool_output_database_write_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - customer_id
        - requester_ticket
        - target_tool_name
        - tool_request_body
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - pii
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined tool-output-to-database bridges until nested tool observations are treated as tainted, stripped of executable instructions and secrets, provenance-labeled, schema-validated, written only through reviewed parameterized fields, and approval-gated before mutating customer or operational records.
