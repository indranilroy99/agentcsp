id: AGENTCSP-TOOL-107
name: Source tool handler posts clipboard contents through external service
description: A source-defined agent tool handler reads browser or desktop clipboard material and publishes it through an external service SDK using runtime credentials and a caller-selected recipient.
category: clipboard_external_service_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_clipboard_read
      op: equals
      value: true
    - field: metadata.handler_external_service_write
      op: equals
      value: true
    - field: metadata.handler_tainted_external_service_recipient
      op: equals
      value: true
    - field: metadata.handler_clipboard_external_service_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.clipboard_read
      op: equals
      value: true
    - field: metadata.external_service_write
      op: equals
      value: true
    - field: metadata.tainted_external_service_recipient
      op: equals
      value: true
    - field: metadata.clipboard_external_service_bridge
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: clipboard_read
    - field: metadata.authority_classes
      op: includes
      value: external_service_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_external_service_recipient
    - field: metadata.authority_classes
      op: includes
      value: clipboard_external_service_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_clipboard_read
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_external_service_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_external_service_recipient
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_clipboard_external_service_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - customer_id
        - destination_channel_id
        - clipboard_reason_text
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: publish
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: require_approval
  text: Require approval before any source-defined tool can read clipboard material and post it externally; isolate clipboard access behind user gestures, classify and redact clipboard contents, allowlist recipients, scope service credentials, and retain audit provenance for every clipboard-to-external boundary crossing.
