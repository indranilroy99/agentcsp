id: AGENTCSP-RUNTIME-030
name: AI model router fails over sensitive context to third-party providers
description: An AI model router or fallback policy can automatically send prompts, tool outputs, retrieval context, memory, PII, or secrets from untrusted inputs to third-party model providers without approval.
category: model_routing_boundary
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.2
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_ai_model_router_config
      op: equals
      value: true
    - field: metadata.ai_model_router_remote_providers
      op: equals
      value: true
    - field: metadata.ai_model_router_fallback_enabled
      op: equals
      value: true
    - field: metadata.ai_model_router_auto_fallback
      op: equals
      value: true
    - field: metadata.ai_model_router_sensitive_context
      op: equals
      value: true
    - field: metadata.ai_model_router_redaction_disabled
      op: equals
      value: true
    - field: metadata.ai_model_router_untrusted_input
      op: equals
      value: true
    - field: metadata.ai_model_router_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Restrict fallback providers to an approved allowlist, redact prompts and tool outputs before routing, disable automatic fallback for sensitive agents, and require approval before third-party model failover.
