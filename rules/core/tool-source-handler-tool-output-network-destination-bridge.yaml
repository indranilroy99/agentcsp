id: AGENTCSP-TOOL-113
name: Source tool handler fetches URL from raw tool output
description: A source-defined agent tool handler invokes a nested tool, captures the raw tool observation, and uses that observation as a network destination while runtime credentials are available to the request path.
category: tool_output_network_destination_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_tool_invocation
      op: equals
      value: true
    - field: metadata.handler_external_network_call
      op: equals
      value: true
    - field: metadata.handler_credentialed_network_read
      op: equals
      value: true
    - field: metadata.handler_tool_output_network_destination_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.nested_tool_invocation
      op: equals
      value: true
    - field: metadata.credentialed_network_read
      op: equals
      value: true
    - field: metadata.tool_output_network_destination_bridge
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: nested_tool_invocation
    - field: metadata.authority_classes
      op: includes
      value: credentialed_network_read
    - field: metadata.authority_classes
      op: includes
      value: tool_output_network_destination_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tool_invocation
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_credentialed_network_read
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tool_output_network_destination_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - requester_ticket
        - target_tool_name
        - tool_request_body
        - investigation_reason_text
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine tool-output-to-network-destination bridges until nested tool observations are treated as tainted data, URL destinations are allowlisted and private-network or metadata-service targets are blocked, runtime credentials are stripped from tool-selected requests, and an approval/audit gate is enforced before any external request executes.
