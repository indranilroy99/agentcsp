id: AGENTCSP-TOOL-062
name: Source tool handler posts secret-manager output externally
description: A source-defined agent tool handler reads a caller-selected secret-manager path and publishes the returned secret material through an external service SDK using runtime credentials.
category: secret_manager_external_service_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_manager_access
      op: equals
      value: true
    - field: metadata.handler_tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.handler_external_service_write
      op: equals
      value: true
    - field: metadata.handler_tainted_external_service_recipient
      op: equals
      value: true
    - field: metadata.handler_secret_manager_external_service_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.secret_manager_access
      op: equals
      value: true
    - field: metadata.tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.external_service_write
      op: equals
      value: true
    - field: metadata.tainted_external_service_recipient
      op: equals
      value: true
    - field: metadata.secret_manager_external_service_bridge
      op: equals
      value: true
    - field: metadata.external_write
      op: equals
      value: true
    - field: metadata.accepts_secret_like_input
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_access
    - field: metadata.authority_classes
      op: includes
      value: tainted_secret_manager_path
    - field: metadata.authority_classes
      op: includes
      value: external_service_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_external_service_recipient
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_external_service_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_secret_manager_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_external_service_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_external_service_recipient
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_external_service_bridge
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: publish
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined secret-manager-to-external-service bridges until secret paths are policy-owned, secret values are never posted through collaboration or SaaS SDKs, recipients are allowlisted outside the model path, and any credential disclosure requires independent approval and audited break-glass handling.
