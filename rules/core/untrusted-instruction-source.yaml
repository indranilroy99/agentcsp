id: AGENTCSP-CONTEXT-001
name: Untrusted context can influence privileged behavior
description: A context source with unknown, third-party, or untrusted provenance appears able to influence privileged agent behavior.
category: indirect_prompt_injection
severity: high
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 3.5
    - MEASURE 2.9
match:
  where:
    - field: untrusted_to_privileged
      op: equals
      value: true
    - field: metadata.untrusted_event_agent_input
      op: not_equals
      value: true
    - field: metadata.mcp_context_surface
      op: not_equals
      value: true
    - field: metadata.mcp_client_context_exposure
      op: not_equals
      value: true
    - field: metadata.parsed_browser_session_config
      op: not_equals
      value: true
    - field: metadata.parsed_inbound_trigger_config
      op: not_equals
      value: true
    - field: metadata.parsed_agent_orchestration_config
      op: not_equals
      value: true
    - field: metadata.parsed_agent_safety_config
      op: not_equals
      value: true
    - field: metadata.parsed_ai_eval_harness_config
      op: not_equals
      value: true
    - field: metadata.parsed_agent_memory_store_config
      op: not_equals
      value: true
    - field: metadata.parsed_agent_identity_config
      op: not_equals
      value: true
    - field: metadata.parsed_agent_extension_loader_config
      op: not_equals
