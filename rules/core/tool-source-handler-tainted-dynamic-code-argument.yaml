id: AGENTCSP-TOOL-033
name: Source tool handler evaluates caller supplied code argument
description: A source-defined agent tool handler passes a code-like tool argument into dynamic in-process execution, creating a direct path from model-controlled input to runtime code execution.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0054 Command and Scripting Interpreter
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.3
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_dynamic_code_execution
      op: equals
      value: true
    - field: metadata.handler_tainted_dynamic_code_argument
      op: equals
      value: true
    - field: metadata.dynamic_code_execution
      op: equals
      value: true
    - field: metadata.tainted_dynamic_code_argument
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: dynamic_code_execution
    - field: metadata.authority_classes
      op: includes
      value: tainted_dynamic_code_argument
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_dynamic_code_execution
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_dynamic_code_argument
    - field: metadata.schema_properties
      op: contains_any
      value:
        - code
        - context_code
        - expression
        - program
        - script
        - source
    - field: actions
      op: includes
      value: execute
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined dynamic-code tools that evaluate caller-controlled code arguments until code inputs are removed, safe expression interpreters or reviewed allowlists replace general evaluation, execution is sandboxed, and approval gates protect every evaluation path.
