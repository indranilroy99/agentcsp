id: AGENTCSP-TOOL-041
name: Source tool handler sends to caller-selected network destination
description: A source-defined agent tool handler passes a caller-selected URL, URI, endpoint, webhook, or destination into an HTTP client call, creating a direct path from model-reachable input to outbound network egress.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_external_network_call
      op: equals
      value: true
    - field: metadata.handler_tainted_network_destination
      op: equals
      value: true
    - field: metadata.tainted_network_destination
      op: equals
      value: true
    - field: metadata.accepts_url_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: network_access
    - field: metadata.authority_classes
      op: includes
      value: tainted_network_destination
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_network_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_network_destination
    - field: metadata.schema_properties
      op: contains_any
      value:
        - callback_url
        - destination
        - destination_webhook_url
        - endpoint
        - endpoint_url
        - status_endpoint_url
        - target_url
        - uri
        - url
        - webhook_url
    - field: actions
      op: includes
      value: send
    - field: external_reach
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine source-defined network tools that pass caller-selected destinations into HTTP clients until destinations are resolved by policy outside the model path, constrained to reviewed allowlists, denied for private-network and metadata-service ranges, stripped of credentials on user-selected origins, and approval-gated before outbound egress.
