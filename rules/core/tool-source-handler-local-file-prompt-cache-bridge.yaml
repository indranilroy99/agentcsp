id: AGENTCSP-TOOL-141
name: Local file content persisted into prompt cache
description: A source-defined agent tool handler reads a caller-selected local file path and persists the file content into a prompt, LLM, response, or semantic cache using runtime credentials and caller-selected cache scope.
category: local_file_prompt_cache_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0059 Data from Information Repositories
    - AML.T0060 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_filesystem_read
      op: equals
      value: true
    - field: metadata.handler_tainted_filesystem_path
      op: equals
      value: true
    - field: metadata.handler_prompt_cache_write
      op: equals
      value: true
    - field: metadata.handler_tainted_prompt_cache_key
      op: equals
      value: true
    - field: metadata.handler_tainted_prompt_cache_value
      op: equals
      value: true
    - field: metadata.handler_local_file_prompt_cache_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.tainted_filesystem_path
      op: equals
      value: true
    - field: metadata.prompt_cache_write
      op: equals
      value: true
    - field: metadata.tainted_prompt_cache_key
      op: equals
      value: true
    - field: metadata.tainted_prompt_cache_value
      op: equals
      value: true
    - field: metadata.local_file_prompt_cache_bridge
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: filesystem_read
    - field: metadata.authority_classes
      op: includes
      value: tainted_filesystem_path
    - field: metadata.authority_classes
      op: includes
      value: prompt_cache_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_prompt_cache_key
    - field: metadata.authority_classes
      op: includes
      value: tainted_prompt_cache_value
    - field: metadata.authority_classes
      op: includes
      value: local_file_prompt_cache_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_filesystem_read
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_filesystem_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_prompt_cache_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_prompt_cache_key
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_prompt_cache_value
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_local_file_prompt_cache_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - workspace_path
        - local_file_path
        - prompt_cache_key
        - cache_namespace
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: remember
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine local-file-to-prompt-cache handlers until file paths are policy-owned and allowlisted, sensitive and ignored paths are denied, file content is classified and redacted before caching, cache keys and namespaces are tenant-scoped by policy, retention is bounded, and approval is required before local file material can replay into future prompts.
