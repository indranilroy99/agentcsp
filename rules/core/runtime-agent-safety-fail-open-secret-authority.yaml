id: AGENTCSP-RUNTIME-105
name: Fail-open safety fallback releases secret-backed tool authority
description: An enabled agent safety policy allows privileged actions by default, on timeout, and on error while monitor-only or model-mediated enforcement can still reach database, external-response, and secret-manager authority without approval.
category: agent_safety_fail_open_secret_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0054 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_safety_config
      op: equals
      value: true
    - field: metadata.agent_safety_controls_declared
      op: equals
      value: true
    - field: metadata.agent_safety_fail_open
      op: equals
      value: true
    - field: metadata.agent_safety_fail_open_categories
      op: includes
      value: default_allow
    - field: metadata.agent_safety_fail_open_categories
      op: includes
      value: timeout_allow
    - field: metadata.agent_safety_fail_open_categories
      op: includes
      value: error_allow
    - field: metadata.agent_safety_fail_open_categories
      op: includes
      value: monitor_only
    - field: metadata.agent_safety_default_allow
      op: equals
      value: true
    - field: metadata.agent_safety_timeout_allows
      op: equals
      value: true
    - field: metadata.agent_safety_error_allows
      op: equals
      value: true
    - field: metadata.agent_safety_monitor_only
      op: equals
      value: true
    - field: metadata.agent_safety_model_only_enforcement
      op: equals
      value: true
    - field: metadata.agent_safety_pre_tool_enforcement_missing
      op: equals
      value: true
    - field: metadata.agent_safety_untrusted_input
      op: equals
      value: true
    - field: metadata.agent_safety_privileged_tool_authority
      op: equals
      value: true
    - field: metadata.agent_safety_tool_authority_categories
      op: includes
      value: database_access
    - field: metadata.agent_safety_tool_authority_categories
      op: includes
      value: external_response
    - field: metadata.agent_safety_tool_authority_categories
      op: includes
      value: secret_manager_access
    - field: metadata.agent_safety_write_authority
      op: equals
      value: true
    - field: metadata.agent_safety_external_authority
      op: equals
      value: true
    - field: metadata.agent_safety_secret_exposure
      op: equals
      value: true
    - field: metadata.agent_safety_sensitive_data
      op: equals
      value: true
    - field: metadata.agent_safety_pii_data
      op: equals
      value: true
    - field: metadata.agent_safety_approval_required
      op: equals
      value: false
    - field: data_classes
      op: includes
      value: credential
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine fail-open safety fallback paths until default, timeout, and error behavior deny or isolate privileged actions; replace monitor-only or model-mediated fallback with deterministic pre-tool enforcement, and require approval before database, external-response, or secret-manager authority can execute.
