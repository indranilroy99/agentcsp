id: AGENTCSP-TOOL-127
name: Source tool handler stores model output in prompt cache
description: A source-defined agent tool handler calls a model provider, extracts model output, and writes that output into an LLM, response, or semantic prompt cache using runtime credentials and caller-selected cache routing.
category: model_output_prompt_cache_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0059 Data from Information Repositories
    - AML.T0060 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_model_provider_call
      op: equals
      value: true
    - field: metadata.handler_prompt_cache_write
      op: equals
      value: true
    - field: metadata.handler_tainted_prompt_cache_key
      op: equals
      value: true
    - field: metadata.handler_tainted_prompt_cache_value
      op: equals
      value: true
    - field: metadata.handler_model_output_prompt_cache_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.model_provider_call
      op: equals
      value: true
    - field: metadata.prompt_cache_write
      op: equals
      value: true
    - field: metadata.tainted_prompt_cache_key
      op: equals
      value: true
    - field: metadata.tainted_prompt_cache_value
      op: equals
      value: true
    - field: metadata.model_output_prompt_cache_bridge
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: model_provider_call
    - field: metadata.authority_classes
      op: includes
      value: prompt_cache_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_prompt_cache_key
    - field: metadata.authority_classes
      op: includes
      value: tainted_prompt_cache_value
    - field: metadata.authority_classes
      op: includes
      value: model_output_prompt_cache_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_model_provider_call
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_prompt_cache_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_prompt_cache_key
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_prompt_cache_value
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_model_output_prompt_cache_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - cache_goal_text
        - cache_namespace
        - customer_ticket_text
        - model_name
        - prompt_cache_key
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: remember
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine model-output-to-cache handlers until model responses are classified and redacted before cache writes, cache keys and namespaces are policy-owned, TTLs, tenant isolation, and provenance are enforced, replay into future prompts is disabled by default, and approval is required before generated content is persisted.
