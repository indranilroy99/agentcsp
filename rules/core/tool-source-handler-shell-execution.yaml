id: AGENTCSP-TOOL-015
name: Source tool handler executes shell from tool arguments
description: A source-defined agent tool handler executes shell or subprocess authority while exposing command-like tool inputs, creating a concrete path from model-controlled arguments to host command execution.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0054 Command and Scripting Interpreter
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.3
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_shell_execution
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: shell_execution
    - field: metadata.schema_properties
      op: contains_any
      value:
        - command
        - command_text
        - shell_command
        - script
        - script_text
    - field: actions
      op: includes
      value: execute
    - field: side_effect
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine source-defined shell tools until command inputs are removed or constrained to reviewed allowlists, execution is sandboxed, and approval gates protect every host command invocation.
