id: AGENTCSP-TOOL-006
maturity: stable
disposition: advisory
suppressibility: policy
support_tier: structured
name: Tool read-only hint conflicts with side-effect authority
description: A tool schema is marked read-only while its name, description, or arguments indicate external write, destructive, execution, or state-changing authority.
category: tool_schema_authority
severity: high
maps_to:
  owasp:
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0054 Command and Scripting Interpreter
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.3
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.read_only_hint
      op: equals
      value: true
    - field: metadata.read_only_hint_conflict
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Treat conflicting read-only annotations as unsafe, correct the tool metadata, and require approval until runtime adapters can enforce side-effect classification.
