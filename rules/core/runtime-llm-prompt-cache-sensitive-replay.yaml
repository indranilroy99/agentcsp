id: AGENTCSP-RUNTIME-029
name: LLM prompt cache replays sensitive unredacted context
description: An LLM prompt, response, or semantic cache stores sensitive prompts, completions, retrieval context, memory, tool outputs, PII, or secrets in a shared remote cache and can replay them into future model calls without approval.
category: prompt_cache_boundary
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.2
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_llm_prompt_cache_config
      op: equals
      value: true
    - field: metadata.llm_prompt_cache_remote
      op: equals
      value: true
    - field: metadata.llm_prompt_cache_shared
      op: equals
      value: true
    - field: metadata.llm_prompt_cache_replay_enabled
      op: equals
      value: true
    - field: metadata.llm_prompt_cache_sensitive_capture
      op: equals
      value: true
    - field: metadata.llm_prompt_cache_redaction_disabled
      op: equals
      value: true
    - field: metadata.llm_prompt_cache_untrusted_input
      op: equals
      value: true
    - field: metadata.llm_prompt_cache_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine untrusted prompt-cache writes, disable raw prompt and response caching for sensitive agents, redact PII and secrets before cache storage, isolate cache namespaces by trust boundary, and require approval before shared cached context can hydrate future model calls.
