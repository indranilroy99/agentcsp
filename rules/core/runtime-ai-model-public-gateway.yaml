id: AGENTCSP-RUNTIME-051
name: Public model gateway records sensitive agent context without auth
description: An OpenAI-compatible or custom model gateway is exposed to public or anonymous clients, disables authentication, records sensitive prompts or tool outputs, and allows tool calling without approval.
category: model_gateway_boundary
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_ai_model_config
      op: equals
      value: true
    - field: metadata.ai_model_custom_endpoint
      op: equals
      value: true
    - field: metadata.ai_model_public_endpoint
      op: equals
      value: true
    - field: metadata.ai_model_auth_disabled
      op: equals
      value: true
    - field: metadata.ai_model_sensitive_context
      op: equals
      value: true
    - field: metadata.ai_model_request_logging_enabled
      op: equals
      value: true
    - field: metadata.ai_model_redaction_disabled
      op: equals
      value: true
    - field: metadata.ai_model_tool_calling_enabled
      op: equals
      value: true
    - field: metadata.ai_model_approval_required
      op: equals
      value: false
recommendation:
  control: deny
  text: Remove public or anonymous access to model gateways, require client authentication, disable raw request logging for prompts and tool outputs, and require approval before gateway-mediated tool calls can execute.
