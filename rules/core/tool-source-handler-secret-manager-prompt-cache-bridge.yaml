id: AGENTCSP-TOOL-069
name: Source tool handler writes secret-manager output to prompt cache
description: A source-defined agent tool handler reads a caller-selected secret-manager path and writes the returned secret material into a prompt, LLM, response, or semantic cache using runtime credentials and a caller-controlled cache key.
category: secret_manager_prompt_cache_bridge
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0059 Data from Information Repositories
    - AML.T0065 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_manager_access
      op: equals
      value: true
    - field: metadata.handler_tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.handler_prompt_cache_write
      op: equals
      value: true
    - field: metadata.handler_secret_manager_prompt_cache_bridge
      op: equals
      value: true
    - field: metadata.handler_tainted_prompt_cache_key
      op: equals
      value: true
    - field: metadata.handler_tainted_prompt_cache_value
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.secret_manager_access
      op: equals
      value: true
    - field: metadata.tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.prompt_cache_write
      op: equals
      value: true
    - field: metadata.secret_manager_prompt_cache_bridge
      op: equals
      value: true
    - field: metadata.tainted_prompt_cache_key
      op: equals
      value: true
    - field: metadata.tainted_prompt_cache_value
      op: equals
      value: true
    - field: metadata.accepts_secret_like_input
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_access
    - field: metadata.authority_classes
      op: includes
      value: tainted_secret_manager_path
    - field: metadata.authority_classes
      op: includes
      value: prompt_cache_write
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_prompt_cache_bridge
    - field: metadata.authority_classes
      op: includes
      value: tainted_prompt_cache_key
    - field: metadata.authority_classes
      op: includes
      value: tainted_prompt_cache_value
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_secret_manager_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_prompt_cache_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_prompt_cache_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_prompt_cache_key
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_prompt_cache_value
    - field: metadata.schema_properties
      op: contains_any
      value:
        - cache_key
        - prompt_cache_key
        - semantic_key
        - secret_path
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: remember
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined secret-manager-to-prompt-cache bridges until secret paths and cache keys are policy-owned, raw secrets are blocked from prompt or semantic caches, cache entries are tenant-scoped and non-replayable, redaction and retention controls run before writes, and approval plus audit provenance are required for secret-bearing cache persistence.
