recommendation:
  control: quarantine
  text: Quarantine clipboard-to-safety-policy handlers until copied desktop or browser context is treated as untrusted and cannot select or weaken guardrail, approval, moderation, or safety controls; policy IDs and control IDs are allowlisted; fail-open, monitor-only, default-allow, approval-off, and disabled modes are rejected deterministically; runtime policy credentials are least privilege; and security-owner approval plus immutable audit provenance are required before clipboard material can change safety policy.
