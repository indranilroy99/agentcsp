id: AGENTCSP-TOOL-207
name: Source tool handler weakens safety policy from clipboard content
description: A source-defined agent tool handler reads desktop or browser clipboard material and uses copied text to update guardrail, approval, moderation, or safety policy while weakening enforcement.
category: clipboard_safety_policy_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0060 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_clipboard_read
      op: equals
      value: true
    - field: metadata.handler_safety_policy_write
      op: equals
      value: true
    - field: metadata.handler_tainted_safety_policy_payload
      op: equals
      value: true
    - field: metadata.handler_tainted_safety_policy_selector
      op: equals
      value: true
    - field: metadata.handler_safety_policy_weakening
      op: equals
      value: true
    - field: metadata.handler_clipboard_safety_policy_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.clipboard_read
      op: equals
      value: true
    - field: metadata.safety_policy_write
      op: equals
      value: true
    - field: metadata.tainted_safety_policy_payload
      op: equals
      value: true
    - field: metadata.tainted_safety_policy_selector
      op: equals
      value: true
    - field: metadata.safety_policy_weakening
      op: equals
      value: true
    - field: metadata.clipboard_safety_policy_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_safety_policy_bridge
      op: equals
      value: false
    - field: metadata.env_secret_safety_policy_bridge
      op: equals
      value: false
    - field: metadata.network_response_safety_policy_bridge
      op: equals
      value: false
    - field: metadata.local_file_safety_policy_bridge
