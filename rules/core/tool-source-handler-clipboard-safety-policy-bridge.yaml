      value: false
    - field: metadata.model_output_safety_policy_bridge
      op: equals
      value: false
    - field: metadata.tool_output_safety_policy_bridge
      op: equals
      value: false
    - field: metadata.rag_retrieval_safety_policy_bridge
      op: equals
      value: false
    - field: metadata.visual_context_safety_policy_bridge
      op: equals
      value: false
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: clipboard_read
    - field: metadata.authority_classes
      op: includes
      value: safety_policy_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_safety_policy_payload
    - field: metadata.authority_classes
