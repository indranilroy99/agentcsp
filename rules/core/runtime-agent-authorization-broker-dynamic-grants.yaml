id: AGENTCSP-RUNTIME-041
name: Agent authorization broker grants model-selected tool authority
description: An agent-facing authorization broker can mint dynamic tool or resource grants from untrusted context, lets the model select broad scopes, defaults open, and has no approval gate before privileged credential-backed actions.
category: authorization_boundary
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - GOVERN 1.5
    - MAP 5.1
    - MANAGE 2.2
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_authorization_broker_config
      op: equals
      value: true
    - field: metadata.agent_authorization_dynamic_grants_enabled
      op: equals
      value: true
    - field: metadata.agent_authorization_model_selected_scope
      op: equals
      value: true
    - field: metadata.agent_authorization_untrusted_subject
      op: equals
      value: true
    - field: metadata.agent_authorization_broad_scope
      op: equals
      value: true
    - field: metadata.agent_authorization_privileged_tool_authority
      op: equals
      value: true
    - field: metadata.agent_authorization_default_allow_or_fail_open
      op: equals
      value: true
    - field: metadata.agent_authorization_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Default authorization brokers to deny, keep model-selected scopes out of grant decisions, require human approval for privileged tool grants, constrain resources to explicit allowlists, and audit every grant decision.
