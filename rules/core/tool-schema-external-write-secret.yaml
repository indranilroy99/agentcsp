id: AGENTCSP-TOOL-003
name: Tool schema accepts secret-like input for external write
description: A tool schema accepts credential-like input and can send, publish, or post externally, creating a concrete path for secret misuse or exfiltration through agent tool calls.
category: tool_schema_authority
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.external_write
      op: equals
      value: true
    - field: metadata.accepts_secret_like_input
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Require explicit approval and redaction controls before this tool can send externally with credential-like inputs.
