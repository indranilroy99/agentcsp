id: AGENTCSP-TOOL-180
name: Source tool handler weakens safety policy from retrieved RAG context
description: A source-defined agent tool handler retrieves caller-selected RAG or vector content and uses the retrieved chunks to update guardrail, approval, moderation, or safety policy while weakening enforcement.
category: rag_retrieval_safety_policy_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
