recommendation:
  control: quarantine
  text: Quarantine retrieved-context-to-safety-policy writes until retrieval selectors and namespaces are policy-owned or allowlisted, retrieved chunks carry provenance and trust labels, retrieved text cannot become guardrail instructions, approval policy, moderation settings, bypass flags, or default-allow payloads, runtime policy credentials are least-privilege, and security-owner approval plus audit provenance are required before policy changes.
