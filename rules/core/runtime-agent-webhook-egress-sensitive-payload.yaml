id: AGENTCSP-RUNTIME-025
name: Agent webhook egress sends sensitive model payloads without approval
description: An agent webhook or callback egress configuration sends model-generated or untrusted payloads containing prompts, completions, tool outputs, retrieval context, memory, browser context, PII, or secrets to a remote endpoint while redaction and approval are disabled.
category: webhook_egress_boundary
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_webhook_egress_config
      op: equals
      value: true
    - field: metadata.agent_webhook_egress_remote
      op: equals
      value: true
    - field: metadata.agent_webhook_egress_external_write_enabled
      op: equals
      value: true
    - field: metadata.agent_webhook_egress_untrusted_input
      op: equals
      value: true
    - field: metadata.agent_webhook_egress_sensitive_payload
      op: equals
      value: true
    - field: metadata.agent_webhook_egress_redaction_disabled
      op: equals
      value: true
    - field: metadata.agent_webhook_egress_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Require approval before model-generated webhook delivery, redact prompts, tool outputs, retrieval context, memory, browser context, PII, and secrets from callback payloads, and restrict callback endpoints to an approved allowlist.
