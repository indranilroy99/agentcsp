id: AGENTCSP-TOOL-156
name: Source tool handler forwards env secret to caller-selected external destination
description: A source-defined agent tool handler reads runtime environment secret material and forwards it as auth/header/token material in an outbound external write whose destination is caller controlled.
category: env_secret_external_write_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.handler_external_write
      op: equals
      value: true
    - field: metadata.handler_tainted_network_destination
      op: equals
      value: true
    - field: metadata.handler_env_secret_external_write_bridge
      op: equals
      value: true
    - field: metadata.external_write
      op: equals
      value: true
    - field: metadata.tainted_network_destination
      op: equals
      value: true
    - field: metadata.env_secret_external_write_bridge
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: env_secret_external_write_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_env_secret_external_write_bridge
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined tools that forward environment secret material to caller-selected external destinations until destinations are policy-owned, credentials are injected only by a trusted broker, outbound auth headers cannot be model or caller routed, and approval plus audit are required for any external publication.
