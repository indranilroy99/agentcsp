id: AGENTCSP-TOOL-001
name: Package script exposes shell authority
description: A package script grants shell execution authority that may be reachable by an agent or automation.
category: unsafe_code_execution
severity: medium
maps_to:
  owasp:
    - LLM06:2025 Excessive Agency
    - LLM07:2025 System Prompt Leakage
  mitre_atlas:
    - AML.T0054 Command and Scripting Interpreter
  nist_ai_rmf:
    - GOVERN 1.5
    - MANAGE 2.3
match:
  object_type: tool
  where:
    - field: actions
      op: includes
      value: execute
recommendation:
  control: require_approval
  text: Require approval before agent-triggered shell execution and keep package scripts outside untrusted context paths.
