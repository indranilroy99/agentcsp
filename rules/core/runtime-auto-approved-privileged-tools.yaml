id: AGENTCSP-RUNTIME-004
maturity: stable
disposition: advisory
suppressibility: policy
support_tier: structured
name: Runtime auto-approves secret-backed privileged tools
description: An agent runtime configuration auto-approves privileged tool permissions while exposing credential key names, creating a concrete path from agent-controlled context to secret-backed authority without per-call review.
category: runtime_posture
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0054 Command and Scripting Interpreter
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - GOVERN 1.5
    - MANAGE 2.3
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_runtime_config
      op: equals
      value: true
    - field: metadata.auto_approved_privileged_tools
      op: equals
      value: true
    - field: metadata.secret_env_exposure
      op: equals
      value: true
    - field: metadata.approval_bypass
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Remove broad auto-approved privileged permissions, scope credentials, and require per-call approval before shell, web, MCP, or filesystem authority can run with secret-backed runtime access.
