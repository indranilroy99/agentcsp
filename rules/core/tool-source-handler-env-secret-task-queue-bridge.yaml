id: AGENTCSP-TOOL-163
name: Source tool handler enqueues env secret to background agent
description: A source-defined agent tool handler reads environment-backed secret material and enqueues it into a background-agent or task queue using runtime queue credentials.
category: env_secret_task_queue_bridge
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
    - LLM10:2025 Unbounded Consumption
  mitre_atlas:
    - AML.T0059 Data from Information Repositories
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.handler_task_queue_enqueue
      op: equals
      value: true
    - field: metadata.handler_tainted_task_payload
      op: equals
      value: true
    - field: metadata.handler_tainted_task_routing
      op: equals
      value: true
    - field: metadata.handler_env_secret_task_queue_bridge
      op: equals
      value: true
    - field: metadata.task_queue_enqueue
      op: equals
      value: true
    - field: metadata.tainted_task_payload
      op: equals
      value: true
    - field: metadata.tainted_task_routing
      op: equals
      value: true
    - field: metadata.env_secret_task_queue_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_task_queue_bridge
      op: not_equals
      value: true
    - field: metadata.model_output_task_queue_bridge
      op: not_equals
      value: true
    - field: metadata.network_response_task_queue_bridge
      op: not_equals
      value: true
    - field: metadata.local_file_task_queue_bridge
      op: not_equals
      value: true
    - field: metadata.tool_output_task_queue_bridge
      op: not_equals
      value: true
    - field: metadata.visual_context_task_queue_bridge
      op: not_equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_env_access
    - field: metadata.authority_classes
      op: includes
      value: task_queue_enqueue
    - field: metadata.authority_classes
      op: includes
      value: tainted_task_payload
    - field: metadata.authority_classes
      op: includes
      value: tainted_task_routing
    - field: metadata.authority_classes
      op: includes
      value: env_secret_task_queue_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_env_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_task_queue_enqueue
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_task_payload
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_task_routing
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_env_secret_task_queue_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - job_goal
        - queue_name
        - route_name
        - tenant_id
        - worker_pool
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: remember
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined env-secret-to-task-queue bridges until environment-backed secrets are excluded from queued payloads, queue names and routes are allowlisted, replay/redrive is disabled for sensitive jobs, queue credentials are scoped, and approval plus audit provenance are required before background agents process secret-bearing work.
