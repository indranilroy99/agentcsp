id: AGENTCSP-RUNTIME-107
name: Agent container exposes host filesystem root Docker takeover path
description: A privileged agent container runs as root with Docker socket access, writable host filesystem root and credential mounts, host namespaces, dangerous capabilities, shell/filesystem/Docker authority, untrusted input, secret environment exposure, and no approval gate.
category: container_host_root_docker_secret_takeover
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
    - LLM07:2025 System Prompt Leakage
  mitre_atlas:
    - AML.T0054 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_container_runtime_config
      op: equals
      value: true
    - field: metadata.agent_container_runtime_enabled
      op: equals
      value: true
    - field: metadata.agent_container_privileged
      op: equals
      value: true
    - field: metadata.agent_container_root_user
      op: equals
      value: true
    - field: metadata.agent_container_docker_socket_mount
      op: equals
      value: true
    - field: metadata.agent_container_host_path_mount
      op: equals
      value: true
    - field: metadata.agent_container_host_root_mount
      op: equals
      value: true
    - field: metadata.agent_container_writable_host_mount
      op: equals
      value: true
    - field: metadata.agent_container_credential_mount
      op: equals
      value: true
    - field: metadata.agent_container_sensitive_mount
      op: equals
      value: true
    - field: metadata.agent_container_host_network
      op: equals
      value: true
    - field: metadata.agent_container_host_pid
      op: equals
      value: true
    - field: metadata.agent_container_host_ipc
      op: equals
      value: true
    - field: metadata.agent_container_dangerous_capability
      op: equals
      value: true
    - field: metadata.agent_container_capability_categories
      op: includes
      value: net_admin
    - field: metadata.agent_container_capability_categories
      op: includes
      value: privileged_mode
    - field: metadata.agent_container_capability_categories
      op: includes
      value: sys_admin
    - field: metadata.agent_container_tool_authority_categories
      op: includes
      value: docker
    - field: metadata.agent_container_tool_authority_categories
      op: includes
      value: filesystem
    - field: metadata.agent_container_tool_authority_categories
      op: includes
      value: shell
    - field: metadata.agent_container_shell_authority
      op: equals
      value: true
    - field: metadata.agent_container_filesystem_authority
      op: equals
      value: true
    - field: metadata.agent_container_docker_authority
      op: equals
      value: true
    - field: metadata.agent_container_untrusted_input
      op: equals
      value: true
    - field: metadata.agent_container_secret_env_exposure
      op: equals
      value: true
    - field: metadata.agent_container_approval_required
      op: equals
      value: false
    - field: data_classes
      op: includes
      value: credential
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: write
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: deny
  text: Deny this agent container profile until Docker socket access, host filesystem root and credential mounts, host namespaces, dangerous capabilities, root execution, and secret environment forwarding are removed; require approval before untrusted agent input can reach host-level shell, filesystem, or Docker authority.
