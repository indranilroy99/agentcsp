id: AGENTCSP-TOOL-158
name: Source tool handler persists env secret into memory
description: A source-defined agent tool handler reads environment-backed secret material and persists it into durable memory, RAG, vector, session, or state storage.
category: env_secret_memory_bridge
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
    - LLM08:2025 Vector and Embedding Weaknesses
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.handler_memory_write
      op: equals
      value: true
    - field: metadata.handler_env_secret_memory_bridge
      op: equals
      value: true
    - field: metadata.memory_write
      op: equals
      value: true
    - field: metadata.env_secret_memory_bridge
      op: equals
      value: true
    - field: metadata.local_file_memory_bridge
      op: not_equals
      value: true
    - field: metadata.secret_manager_memory_bridge
      op: not_equals
      value: true
    - field: metadata.model_output_memory_bridge
      op: not_equals
      value: true
    - field: metadata.network_response_memory_bridge
      op: not_equals
      value: true
    - field: metadata.tool_output_memory_bridge
      op: not_equals
      value: true
    - field: metadata.rag_retrieval_memory_bridge
      op: not_equals
      value: true
    - field: metadata.clipboard_memory_bridge
      op: not_equals
      value: true
    - field: metadata.visual_context_memory_bridge
      op: not_equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_env_access
    - field: metadata.authority_classes
      op: includes
      value: memory_write
    - field: metadata.authority_classes
      op: includes
      value: env_secret_memory_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_env_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_memory_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_env_secret_memory_bridge
    - field: actions
      op: includes
      value: remember
    - field: actions
      op: includes
      value: write
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined env-secret-to-memory bridges until runtime secrets are prevented from entering durable memory, memory writes are classified and redacted before persistence, retention and replay are bounded by policy, and any credential retention requires independent approval outside the agent path.
