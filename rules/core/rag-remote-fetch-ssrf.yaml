id: AGENTCSP-RAG-007
name: RAG ingestion can fetch untrusted URLs into internal networks
description: A RAG ingestion pipeline auto-fetches user or model-selected remote URLs, follows redirects, allows private-network and metadata-service destinations, forwards credentials, and lacks an approval or network allowlist boundary.
category: rag_remote_fetch_boundary
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
    - LLM08:2025 Vector and Embedding Weaknesses
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: rag_source
  where:
    - field: metadata.parsed_rag_connector_config
      op: equals
      value: true
    - field: metadata.vector_store_ingestion_enabled
      op: equals
      value: true
    - field: metadata.vector_store_auto_ingest_enabled
      op: equals
      value: true
    - field: metadata.vector_store_remote_fetch_enabled
      op: equals
      value: true
    - field: metadata.vector_store_fetch_user_or_model_selected_url
      op: equals
      value: true
    - field: metadata.vector_store_fetch_follows_redirects
      op: equals
      value: true
    - field: metadata.vector_store_fetch_private_network_allowed
      op: equals
      value: true
    - field: metadata.vector_store_fetch_metadata_service_allowed
      op: equals
      value: true
    - field: metadata.vector_store_fetch_network_allowlist_missing
      op: equals
      value: true
    - field: metadata.vector_store_fetch_credential_forwarding
      op: equals
      value: true
    - field: metadata.vector_store_ingestion_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine remote URL ingestion until URL sources are reviewed or allowlisted, redirects are bounded, private-network and metadata-service targets are denied before fetch, credentials are stripped from fetch requests, and approval is required before fetched content can enter trusted retrieval indexes.
