id: AGENTCSP-RUNTIME-120
maturity: stable
disposition: advisory
suppressibility: policy
support_tier: structured
name: Unsandboxed inbound attachments can drive privileged agent tools
description: An inbound email, chat, ticket, or webhook trigger extracts raw attachment content without sandboxing, malware scanning, or instruction stripping, then routes that content into privileged agent tools with credential-backed authority and no approval gate.
category: inbound_attachment_parser_boundary
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Supply Chain Vulnerabilities
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_inbound_trigger_config
      op: equals
      value: true
    - field: metadata.inbound_trigger_external_source
      op: equals
      value: true
    - field: metadata.inbound_trigger_invokes_agent
      op: equals
      value: true
    - field: metadata.inbound_trigger_invokes_tools
      op: equals
      value: true
    - field: metadata.inbound_trigger_attachment_context
      op: equals
      value: true
    - field: metadata.inbound_trigger_attachment_raw_text
      op: equals
      value: true
    - field: metadata.inbound_trigger_attachment_sandbox_disabled
      op: equals
      value: true
    - field: metadata.inbound_trigger_attachment_scan_disabled
      op: equals
      value: true
    - field: metadata.inbound_trigger_attachment_instruction_stripping_disabled
      op: equals
      value: true
    - field: metadata.inbound_trigger_tool_authority_categories
      op: contains_any
      value:
        - browser_action
        - database_access
        - external_response
        - memory_write
        - secret_manager_access
    - field: metadata.inbound_trigger_write_authority
      op: equals
      value: true
    - field: metadata.inbound_trigger_external_response
      op: equals
      value: true
    - field: metadata.inbound_trigger_memory_write
      op: equals
      value: true
    - field: metadata.inbound_trigger_sensitive_context
      op: equals
      value: true
    - field: metadata.inbound_trigger_pii_context
      op: equals
      value: true
    - field: metadata.inbound_trigger_approval_required
      op: equals
      value: false
    - field: data_classes
      op: contains_any
      value:
        - credential
    - field: data_classes
      op: contains_any
      value:
        - pii
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine inbound attachments before agent invocation; parse attachments in an isolated sandbox, scan and inspect files before text extraction, strip prompt-like instructions from extracted content, and require approval before attachment-derived context can reach browser, database, external-response, memory, or secret-manager tools.
