id: AGENTCSP-RUNTIME-100
name: Workspace context sync persists credential paths into agent context
description: A workspace context sync can automatically ingest env files, SSH keys, cloud credentials, kubeconfig, git history, home-directory, or private-repository paths into remote prompt, RAG, and memory sinks while .agentcspignore is bypassed, redaction is disabled, and untrusted selectors are allowed.
category: workspace_context_credential_persistence
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_workspace_context_config
      op: equals
      value: true
    - field: metadata.agent_workspace_context_enabled
      op: equals
      value: true
    - field: metadata.agent_workspace_context_auto_sync_enabled
      op: equals
      value: true
    - field: metadata.agent_workspace_context_remote_sync
      op: equals
      value: true
    - field: metadata.agent_workspace_context_prompt_context
      op: equals
      value: true
    - field: metadata.agent_workspace_context_rag_indexing
      op: equals
      value: true
    - field: metadata.agent_workspace_context_memory_persistence
      op: equals
      value: true
    - field: metadata.agent_workspace_context_env_file_access
      op: equals
      value: true
    - field: metadata.agent_workspace_context_ssh_key_access
      op: equals
      value: true
    - field: metadata.agent_workspace_context_cloud_credential_access
      op: equals
      value: true
    - field: metadata.agent_workspace_context_kubeconfig_access
      op: equals
      value: true
    - field: metadata.agent_workspace_context_home_directory_access
      op: equals
      value: true
    - field: metadata.agent_workspace_context_git_history_access
      op: equals
      value: true
    - field: metadata.agent_workspace_context_source_categories
      op: contains_any
      value:
        - private_repo
    - field: metadata.agent_workspace_context_untrusted_input
      op: equals
      value: true
    - field: metadata.agent_workspace_context_redaction_disabled
      op: equals
      value: true
    - field: metadata.agent_workspace_context_agentcspignore_bypassed
      op: equals
      value: true
    - field: metadata.agent_workspace_context_approval_required
      op: equals
      value: false
    - field: data_classes
      op: includes
      value: credential
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine remote workspace context sync until credential and home-directory sources are denied, .agentcspignore is enforced, untrusted selectors are disabled, and any prompt, RAG, memory, or remote context sink receives only redacted, explicitly approved low-risk paths.
