id: AGENTCSP-TOOL-151
name: Clipboard content persisted into agent memory
description: A source-defined agent tool handler reads browser or desktop clipboard material and persists the clipboard content into durable agent memory, RAG, vector, or state stores using runtime credentials and caller-selected memory scope.
category: clipboard_memory_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM04:2025 Data and Model Poisoning
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0059 Data from Information Repositories
    - AML.T0062 Data Poisoning
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_clipboard_read
      op: equals
      value: true
    - field: metadata.handler_memory_write
      op: equals
      value: true
    - field: metadata.handler_tainted_memory_scope
      op: equals
      value: true
    - field: metadata.handler_clipboard_memory_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.clipboard_read
      op: equals
      value: true
    - field: metadata.memory_write
      op: equals
      value: true
    - field: metadata.tainted_memory_scope
      op: equals
      value: true
    - field: metadata.clipboard_memory_bridge
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: clipboard_read
    - field: metadata.authority_classes
      op: includes
      value: memory_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_memory_scope
    - field: metadata.authority_classes
      op: includes
      value: clipboard_memory_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_clipboard_read
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_memory_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_memory_scope
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_clipboard_memory_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - customer_id
        - memory_namespace
        - memory_key
        - clipboard_retention_note_text
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: remember
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine clipboard-to-memory handlers until clipboard reads require explicit user intent, clipboard contents are classified and redacted before persistence, memory namespaces and keys are policy-owned, copied secrets and PII are stripped, retention is bounded, and approval plus audit provenance are required before clipboard material can replay into future agent context.
