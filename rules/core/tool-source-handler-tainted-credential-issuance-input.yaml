id: AGENTCSP-TOOL-042
name: Source tool handler issues credentials from caller-selected grant input
description: A source-defined agent tool handler passes caller-selected subject, scope, role, audience, tenant, or account inputs into a credential broker or identity issuance API, creating a direct path from model-reachable context to delegated credential authority.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_credential_issuance
      op: equals
      value: true
    - field: metadata.handler_tainted_credential_issuance_input
      op: equals
      value: true
    - field: metadata.credential_issuance
      op: equals
      value: true
    - field: metadata.tainted_credential_issuance_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: credential_issuance
    - field: metadata.authority_classes
      op: includes
      value: tainted_credential_issuance_input
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_credential_issuance
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_credential_issuance_input
    - field: metadata.schema_properties
      op: contains_any
      value:
        - account
        - audience
        - customer_id
        - requested_role
        - requested_scope
        - requested_subject
        - role
        - scope
        - subject
        - tenant_id
        - token_audience
        - user_id
    - field: actions
      op: includes
      value: send
    - field: side_effect
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined credential issuers that pass caller-selected grant inputs into identity APIs until subject, scope, role, audience, tenant, and account values are resolved by policy outside the model path, constrained to least-privilege allowlists, approval-gated, short-lived, and auditable.
