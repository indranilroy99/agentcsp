id: AGENTCSP-RUNTIME-060
name: Autonomous agent loop can execute privileged actions from untrusted goals
description: An autonomous agent loop can repeatedly plan and execute privileged tools from customer, external, retrieved, or model-selected goals while iteration budgets, stop conditions, kill switches, and approval controls are missing or disabled.
category: autonomous_agent_loop
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM06:2025 Excessive Agency
    - LLM08:2025 Vector and Embedding Weaknesses
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_autonomous_loop_config
      op: equals
      value: true
    - field: metadata.agent_autonomous_loop_enabled
      op: equals
      value: true
    - field: metadata.agent_autonomous_loop_autonomous_mode
      op: equals
      value: true
    - field: metadata.agent_autonomous_loop_auto_execute
      op: equals
      value: true
    - field: metadata.agent_autonomous_loop_untrusted_goal
      op: equals
      value: true
    - field: metadata.agent_autonomous_loop_privileged_tool_authority
      op: equals
      value: true
    - field: metadata.agent_autonomous_loop_tool_output_feedback
      op: equals
      value: true
    - field: metadata.agent_autonomous_loop_unbounded_iterations
      op: equals
      value: true
    - field: metadata.agent_autonomous_loop_kill_switch_disabled
      op: equals
      value: true
    - field: metadata.agent_autonomous_loop_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Require approval before autonomous loops can execute privileged tools from untrusted goals, set strict iteration and runtime budgets, define deterministic stop conditions, enable a kill switch or circuit breaker, and separate tool-output feedback from the next privileged action.
