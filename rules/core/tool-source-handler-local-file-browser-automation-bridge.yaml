id: AGENTCSP-TOOL-106
name: Source tool handler uploads local files through authenticated browser
description: A source-defined agent tool handler reads or accepts a caller-selected local file path and uploads that file through authenticated browser automation to a caller-selected web target using runtime credentials.
category: local_file_browser_automation_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_filesystem_read
      op: equals
      value: true
    - field: metadata.handler_tainted_filesystem_path
      op: equals
      value: true
    - field: metadata.handler_browser_automation
      op: equals
      value: true
    - field: metadata.handler_tainted_browser_automation_target
      op: equals
      value: true
    - field: metadata.handler_local_file_browser_automation_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.browser_automation
      op: equals
      value: true
    - field: metadata.tainted_browser_automation_target
      op: equals
      value: true
    - field: metadata.tainted_filesystem_path
      op: equals
      value: true
    - field: metadata.local_file_browser_automation_bridge
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.accepts_url_input
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: browser_automation
    - field: metadata.authority_classes
      op: includes
      value: tainted_browser_automation_target
    - field: metadata.authority_classes
      op: includes
      value: tainted_filesystem_path
    - field: metadata.authority_classes
      op: includes
      value: local_file_browser_automation_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_browser_automation
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_browser_automation_target
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_filesystem_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_local_file_browser_automation_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - file_input_selector
        - local_file_path
        - target_url
        - upload_note_text
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: execute
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined local-file browser upload bridges until file paths are allowlisted outside the model path, uploaded file classes are inspected and minimized, browser destinations and selectors are policy-owned, authenticated browser profiles are isolated, and human approval plus audit provenance are required before local files can cross web-origin trust boundaries.
