id: AGENTCSP-RUNTIME-090
name: Model approval gate consumes raw untrusted context before privileged execution
description: A model-mediated approval gate consumes raw untrusted customer, retrieval, memory, or tool context, defaults toward approval, and automatically executes database, browser, external response, memory, or secret-manager actions without a required human reviewer.
category: model_approval_prompt_injection
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - GOVERN 1.5
    - MAP 5.1
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_approval_config
      op: equals
      value: true
    - field: metadata.agent_approval_context_untrusted
      op: equals
      value: true
    - field: metadata.agent_approval_raw_context_included
      op: equals
      value: true
    - field: metadata.agent_approval_decision_model_driven
      op: equals
      value: true
    - field: metadata.agent_approval_uses_untrusted_summary
      op: equals
      value: true
    - field: metadata.agent_approval_human_required
      op: equals
      value: false
    - field: metadata.agent_approval_default_allow
      op: equals
      value: true
    - field: metadata.agent_approval_auto_execute_after_approval
      op: equals
      value: true
    - field: metadata.agent_approval_privileged_actions
      op: equals
      value: true
    - field: metadata.agent_approval_write_actions
      op: equals
      value: true
    - field: metadata.agent_approval_external_actions
      op: equals
      value: true
    - field: metadata.agent_approval_memory_write
      op: equals
      value: true
    - field: metadata.agent_approval_secret_access
      op: equals
      value: true
    - field: metadata.agent_approval_sensitive_data
      op: equals
      value: true
    - field: metadata.agent_approval_pii_data
      op: equals
      value: true
    - field: metadata.agent_approval_prompt_source_categories
      op: contains_any
      value:
        - memory_context
        - retrieval_context
        - tool_output
        - untrusted_user_input
    - field: metadata.agent_approval_action_categories
      op: contains_any
      value:
        - database_write
        - secret_manager_access
        - browser_action
        - external_response
        - memory_write
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Keep raw untrusted context out of model-mediated approval prompts, default approval gates to deny, require an independent human reviewer for database, browser, external response, memory, or secret-manager actions, and separate approval decisions from automatic execution.
