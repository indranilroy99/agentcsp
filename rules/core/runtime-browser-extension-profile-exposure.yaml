id: AGENTCSP-RUNTIME-033
name: Browser agent exposes extension and autofill state to untrusted navigation
description: An authenticated browser-agent configuration loads privileged browser extensions or autofill/password-manager state while untrusted context can drive navigation, clicks, forms, downloads, or uploads across broad origins.
category: browser_extension_profile_exposure
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_browser_session_config
      op: equals
      value: true
    - field: metadata.browser_authenticated_session
      op: equals
      value: true
    - field: metadata.browser_untrusted_navigation
      op: equals
      value: true
    - field: metadata.browser_extensions_redacted
      op: equals
      value: true
    - field: metadata.browser_extension_privileged_permissions
      op: equals
      value: true
    - field: metadata.browser_autofill_sensitive_data
      op: equals
      value: true
    - field: metadata.browser_broad_origin_access
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Run browser agents with a clean task-scoped profile, disable password-manager, wallet, and privileged extensions, block untrusted navigation from extension-enabled sessions, and require approval before downloads, uploads, clicks, or forms can use authenticated browser state.
