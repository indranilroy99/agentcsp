id: AGENTCSP-TOOL-018
name: Source tool handler forwards env credential to caller URL
description: A source-defined agent tool handler reads credential-bearing environment material and performs a non-write network request to a URL-like tool argument, creating a concrete path for model-controlled destinations to receive runtime credentials.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_external_network_call
      op: equals
      value: true
    - field: metadata.handler_credentialed_network_read
      op: equals
      value: true
    - field: metadata.model_output_network_destination_bridge
      op: equals
      value: false
    - field: metadata.tool_output_network_destination_bridge
      op: equals
      value: false
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_url_input
      op: equals
      value: true
    - field: metadata.external_write
      op: equals
      value: false
    - field: metadata.handler_external_write
      op: equals
      value: false
    - field: metadata.authority_classes
      op: includes
      value: credentialed_network_read
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_credentialed_network_read
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: actions
      op: includes
      value: send
recommendation:
  control: quarantine
  text: Quarantine source-defined network lookup tools that forward runtime credentials to caller-controlled URLs. Require destination allowlists, block private-network and metadata-service targets, strip authorization headers from user-selected destinations, and require approval before credentialed egress.
