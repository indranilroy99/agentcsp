id: AGENTCSP-MCP-005
name: Secret-backed MCP implementation is missing from scan
description: An MCP server references a project-local implementation path that was not present in the scanned files while credential-backed authority is exposed, making the agent-callable implementation opaque to security review.
category: mcp_authority
severity: high
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0054 Command and Scripting Interpreter
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: mcp_server
  where:
    - field: metadata.opaque_local_mcp_implementation
      op: equals
      value: true
    - field: metadata.local_command_paths_missing_count
      op: gt
      value: 0
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Require the local MCP implementation to be present in the scanned project, reviewed, and approved before exposing credentials or enabling agent runtime access.
