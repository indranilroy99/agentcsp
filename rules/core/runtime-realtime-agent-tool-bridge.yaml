id: AGENTCSP-RUNTIME-043
name: Realtime agent bridges external callers to privileged tools
description: A realtime, voice, or streaming agent session accepts external caller or audio context and can invoke privileged tools over sensitive data without an approval gate.
category: realtime_agent_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_realtime_agent_session_config
      op: equals
      value: true
    - field: metadata.realtime_agent_external_caller
      op: equals
      value: true
    - field: metadata.realtime_agent_voice_or_audio_input
      op: equals
      value: true
    - field: metadata.realtime_agent_tool_calls_enabled
      op: equals
      value: true
    - field: metadata.realtime_agent_privileged_tool_authority
      op: equals
      value: true
    - field: metadata.realtime_agent_prompt_injection_filter_disabled
      op: equals
      value: true
    - field: metadata.realtime_agent_approval_required
      op: equals
      value: false
    - field: data_classes
      op: contains_any
      value:
        - credential
        - confidential
        - pii
recommendation:
  control: require_approval
  text: Require approval before realtime or voice sessions can route external callers, raw audio, or transcripts into function, MCP, database, messaging, memory, or other privileged tools; enable prompt-injection filtering and sanitize transcripts before tool use.
