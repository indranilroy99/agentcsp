id: AGENTCSP-CURSOR-001
name: Always-applied Cursor rule bridges untrusted context to privileged behavior
description: A Cursor project rule is always applied broadly and contains instructions that route untrusted context into memory, tools, external actions, or other privileged agent behavior.
category: cursor_rule_boundary
severity: high
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 3.5
    - MEASURE 2.9
    - MANAGE 2.3
match:
  object_type: instruction
  where:
    - field: metadata.cursor_rule
      op: equals
      value: true
    - field: metadata.cursor_rule_always_apply
      op: equals
      value: true
    - field: metadata.cursor_rule_applies_broadly
      op: equals
      value: true
    - field: metadata.context_bridge_privileged
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Scope always-applied Cursor rules to trusted files only, separate customer or retrieved context from persistent memory writes and tool directives, and require approval before broad project rules influence privileged agent behavior.
