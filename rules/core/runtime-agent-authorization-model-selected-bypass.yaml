id: AGENTCSP-RUNTIME-115
name: Model-selected authorization grants bypass policy boundaries
description: An agent authorization broker lets model-selected or untrusted context request wildcard tool and resource grants while default-allow or fail-open behavior, disabled audit logging, missing grant TTLs, and secret-backed write authority are present.
category: authorization_policy_bypass
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - GOVERN 1.5
    - MAP 5.1
    - MANAGE 2.2
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_authorization_broker_config
      op: equals
      value: true
    - field: metadata.agent_authorization_enabled
      op: equals
      value: true
    - field: metadata.agent_authorization_remote
      op: equals
      value: true
    - field: metadata.agent_authorization_dynamic_grants_enabled
      op: equals
      value: true
    - field: metadata.agent_authorization_model_selected_scope
      op: equals
      value: true
    - field: metadata.agent_authorization_untrusted_subject
      op: equals
      value: true
    - field: metadata.agent_authorization_untrusted_resource
      op: equals
      value: true
    - field: metadata.agent_authorization_default_allow_or_fail_open
      op: equals
      value: true
    - field: metadata.agent_authorization_wildcard_tool_scope
      op: equals
      value: true
    - field: metadata.agent_authorization_wildcard_resource_scope
      op: equals
      value: true
    - field: metadata.agent_authorization_privileged_tool_authority
      op: equals
      value: true
    - field: metadata.agent_authorization_write_authority
      op: equals
      value: true
    - field: metadata.agent_authorization_secret_authority
      op: equals
      value: true
    - field: metadata.agent_authorization_audit_disabled
      op: equals
      value: true
    - field: metadata.agent_authorization_grant_ttl_missing
      op: equals
      value: true
    - field: metadata.agent_authorization_approval_required
      op: equals
      value: false
    - field: metadata.agent_authorization_tool_authority_categories
      op: contains_any
      value:
        - database_access
    - field: metadata.agent_authorization_tool_authority_categories
      op: contains_any
      value:
        - secret_manager_access
    - field: metadata.agent_authorization_tool_authority_categories
      op: contains_any
      value:
        - external_response
        - browser_action
    - field: data_classes
      op: contains_any
      value:
        - credential
    - field: data_classes
      op: contains_any
      value:
        - pii
    - field: actions
      op: contains_any
      value:
        - approve
    - field: actions
      op: contains_any
      value:
        - write
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: deny
  text: Deny model-selected wildcard authorization grants, default the broker to deny, require explicit subject and resource allowlists, enforce short grant TTLs and audit logs, and require independent approval before untrusted context can receive database, browser, external-response, or secret-manager authority.
