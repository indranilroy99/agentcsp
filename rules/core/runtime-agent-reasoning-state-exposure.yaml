id: AGENTCSP-RUNTIME-057
name: Agent reasoning state is persisted and replayed without redaction
description: An agent scratchpad or reasoning-state configuration captures sensitive reasoning, tool observations, prompts, retrieval, or memory into a remote state store, replays it into future model context, disables redaction and access controls, and lacks approval.
category: reasoning_state_exposure
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_reasoning_state_config
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_enabled
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_capture_enabled
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_remote
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_persistent
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_replay_enabled
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_planner_uses_state
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_untrusted_input
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_sensitive_capture
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_redaction_disabled
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_access_control_disabled
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: redact
  text: Keep scratchpad and reasoning state local and ephemeral by default, redact prompts, tool observations, memory, retrieval context, PII, and secrets before persistence, disable replay into privileged planner context, and require approval before shared or remote reasoning state can hydrate future agent runs.
