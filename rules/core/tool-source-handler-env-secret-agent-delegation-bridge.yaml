id: AGENTCSP-TOOL-164
name: Source tool handler delegates env secret to remote agent
description: A source-defined agent tool handler reads environment-backed secret material and forwards it as delegated task context to a remote agent or A2A peer using runtime delegation credentials.
category: env_secret_agent_delegation_bridge
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
    - LLM08:2025 Vector and Embedding Weaknesses
  mitre_atlas:
    - AML.T0059 Data from Information Repositories
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.handler_agent_delegation
      op: equals
      value: true
    - field: metadata.handler_tainted_agent_delegation_target
      op: equals
      value: true
    - field: metadata.handler_agent_delegation_context_forwarding
      op: equals
      value: true
    - field: metadata.handler_env_secret_agent_delegation_bridge
      op: equals
      value: true
    - field: metadata.agent_delegation
      op: equals
      value: true
    - field: metadata.tainted_agent_delegation_target
      op: equals
      value: true
    - field: metadata.agent_delegation_context_forwarding
      op: equals
      value: true
    - field: metadata.env_secret_agent_delegation_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_agent_delegation_bridge
      op: not_equals
      value: true
    - field: metadata.model_output_agent_delegation_bridge
      op: not_equals
      value: true
    - field: metadata.network_response_agent_delegation_bridge
      op: not_equals
      value: true
    - field: metadata.local_file_agent_delegation_bridge
      op: not_equals
      value: true
    - field: metadata.tool_output_agent_delegation_bridge
      op: not_equals
      value: true
    - field: metadata.visual_context_agent_delegation_bridge
      op: not_equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_env_access
    - field: metadata.authority_classes
      op: includes
      value: agent_delegation
    - field: metadata.authority_classes
      op: includes
      value: tainted_agent_delegation_target
    - field: metadata.authority_classes
      op: includes
      value: agent_delegation_context_forwarding
    - field: metadata.authority_classes
      op: includes
      value: env_secret_agent_delegation_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_env_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_agent_delegation
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_agent_delegation_target
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_agent_delegation_context_forwarding
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_env_secret_agent_delegation_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - delegation_goal_text
        - remote_agent_url
        - target_agent_id
        - task_context
        - task_goal
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: send
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined env-secret-to-agent-delegation bridges until environment-backed secrets cannot enter delegated task context, remote agents and A2A peers are allowlisted by policy, delegated goals are approval-gated, runtime delegation credentials are scoped, and provenance is recorded for every cross-agent handoff.
