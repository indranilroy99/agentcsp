id: AGENTCSP-PROMPT-003
name: Prompt template explicitly references privileged tool
description: A prompt template accepts untrusted input and names a discovered privileged tool, creating a concrete path from user-controlled context to a specific agent-callable capability.
category: prompt_tool_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: prompt
  where:
    - field: metadata.untrusted_template_input
      op: equals
      value: true
    - field: metadata.template_bridge_privileged
      op: equals
      value: true
    - field: metadata.explicit_tool_reference
      op: equals
      value: true
    - field: metadata.referenced_privileged_tool_count
      op: gt
      value: 0
recommendation:
  control: require_approval
  text: Require an explicit tool allowlist and approval gate before this prompt can route untrusted variables into the referenced privileged tool.
