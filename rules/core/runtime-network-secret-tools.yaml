id: AGENTCSP-RUNTIME-002
name: Runtime config combines network access, secrets, and privileged tools
description: An agent runtime configuration enables network access while exposing credential key names and privileged tools, creating a concrete path for secret misuse through agent-controlled actions.
category: runtime_posture
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - GOVERN 1.5
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_runtime_config
      op: equals
      value: true
    - field: metadata.network_enabled
      op: equals
      value: true
    - field: metadata.secret_env_exposure
      op: equals
      value: true
    - field: metadata.privileged_tools_allowed
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Restrict network access, scope credential exposure, and require explicit approval for privileged runtime tools.
