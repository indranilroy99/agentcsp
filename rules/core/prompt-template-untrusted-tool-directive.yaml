id: AGENTCSP-PROMPT-001
name: Prompt template routes untrusted input to tool action
description: A prompt template accepts user, customer, ticket, web, or retrieved-context variables and combines them with tool or external directives, creating a concrete path from untrusted input to privileged action.
category: prompt_template_injection
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 3.5
    - MEASURE 2.9
    - MANAGE 2.3
match:
  object_type: prompt
  where:
    - field: metadata.prompt_template
      op: equals
      value: true
    - field: metadata.untrusted_template_input
      op: equals
      value: true
    - field: metadata.tool_directive
      op: equals
      value: true
    - field: metadata.external_directive
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Separate untrusted template variables from tool directives, validate or summarize untrusted input before tool use, and require approval before prompt-driven external actions.
