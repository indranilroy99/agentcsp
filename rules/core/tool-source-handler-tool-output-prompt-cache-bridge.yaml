id: AGENTCSP-TOOL-092
name: Source tool handler writes raw tool output to prompt cache
description: A source-defined agent tool handler invokes a nested tool and writes the raw tool observation into a prompt, LLM, response, or semantic cache using runtime authority.
category: tool_output_prompt_cache_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_tool_invocation
      op: equals
      value: true
    - field: metadata.handler_prompt_cache_write
      op: equals
      value: true
    - field: metadata.handler_tool_output_prompt_cache_bridge
      op: equals
      value: true
    - field: metadata.handler_tainted_prompt_cache_key
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.nested_tool_invocation
      op: equals
      value: true
    - field: metadata.prompt_cache_write
      op: equals
      value: true
    - field: metadata.tool_output_prompt_cache_bridge
      op: equals
      value: true
    - field: metadata.tainted_prompt_cache_key
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: nested_tool_invocation
    - field: metadata.authority_classes
      op: includes
      value: prompt_cache_write
    - field: metadata.authority_classes
      op: includes
      value: tool_output_prompt_cache_bridge
    - field: metadata.authority_classes
      op: includes
      value: tainted_prompt_cache_key
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tool_invocation
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_prompt_cache_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tool_output_prompt_cache_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_prompt_cache_key
    - field: metadata.schema_properties
      op: contains_any
      value:
        - cache_key
        - prompt_cache_key
        - target_tool_name
        - tool_request_body
        - retention_note_text
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: remember
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined tool-output-to-prompt-cache bridges until nested tool observations are summarized and redacted before caching, cache keys are tenant-scoped and policy-owned, raw tool output cannot populate replayable prompt or semantic caches, retention is bounded, and approval plus audit provenance are required for cache writes.
