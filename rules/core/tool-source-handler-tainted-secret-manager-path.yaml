id: AGENTCSP-TOOL-036
name: Source tool handler passes caller secret path to vault API
description: A source-defined agent tool handler passes a caller-selected secret name, secret path, or derived value into a vault, key vault, cloud secret manager, or credential broker read API, creating a direct path from model-controlled arguments to credential retrieval.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_manager_access
      op: equals
      value: true
    - field: metadata.handler_tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.secret_manager_access
      op: equals
      value: true
    - field: metadata.tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.accepts_secret_like_input
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_access
    - field: metadata.authority_classes
      op: includes
      value: tainted_secret_manager_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_secret_manager_path
    - field: actions
      op: includes
      value: read
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine source-defined secret-manager tools that pass caller-selected secret paths into vault APIs until secret identifiers are policy-resolved outside the model path, constrained to explicit allowlists, scoped by least privilege, never returned through model-visible output, and protected by approval.
