id: AGENTCSP-TOOL-204
name: Source tool handler queues clipboard context for background agents
description: A source-defined agent tool handler reads desktop clipboard text and enqueues that copied context into an asynchronous background-agent job using runtime credentials and caller-controlled routing.
category: clipboard_task_queue_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_clipboard_read
      op: equals
      value: true
    - field: metadata.handler_task_queue_enqueue
      op: equals
      value: true
    - field: metadata.handler_clipboard_task_queue_bridge
      op: equals
      value: true
    - field: metadata.handler_tainted_task_payload
      op: equals
      value: true
    - field: metadata.handler_tainted_task_routing
      op: equals
      value: true
    - field: metadata.clipboard_read
      op: equals
      value: true
    - field: metadata.task_queue_enqueue
      op: equals
      value: true
    - field: metadata.clipboard_task_queue_bridge
      op: equals
      value: true
    - field: metadata.tainted_task_payload
      op: equals
      value: true
    - field: metadata.tainted_task_routing
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: clipboard_read
    - field: metadata.authority_classes
      op: includes
      value: task_queue_enqueue
    - field: metadata.authority_classes
      op: includes
      value: clipboard_task_queue_bridge
    - field: metadata.authority_classes
      op: includes
      value: tainted_task_payload
    - field: metadata.authority_classes
      op: includes
      value: tainted_task_routing
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_clipboard_read
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_task_queue_enqueue
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_clipboard_task_queue_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_task_payload
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_task_routing
    - field: metadata.schema_properties
      op: contains_any
      value:
        - customer_id
        - account_id
        - case_id
    - field: metadata.schema_properties
      op: contains_any
      value:
        - queue_name
        - target_queue_name
        - job_route
        - task_route
        - worker_route
        - clipboard_queue_note_text
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: remember
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine clipboard-to-background-job handlers until copied text is classified and redacted before enqueue, queue names and worker routes are policy-owned, replay and redrive are bounded, background workers enforce the same approval boundary as the foreground tool call, and queue provenance is audited end to end.
