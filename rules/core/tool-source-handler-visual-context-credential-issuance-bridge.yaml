id: AGENTCSP-TOOL-191
name: Source tool handler issues credentials from authenticated visual context
description: A source-defined agent tool handler captures authenticated browser or screen visual context from a caller-selected target and uses screenshot or OCR-derived context to mint, sign, assume, impersonate, or issue agent credentials.
category: visual_context_credential_issuance_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0060 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_browser_automation
      op: equals
      value: true
    - field: metadata.handler_tainted_browser_automation_target
      op: equals
      value: true
    - field: metadata.handler_visual_context_capture
      op: equals
      value: true
    - field: metadata.handler_credential_issuance
      op: equals
      value: true
    - field: metadata.handler_tainted_credential_issuance_input
      op: equals
      value: true
    - field: metadata.handler_visual_context_credential_issuance_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.browser_automation
      op: equals
      value: true
    - field: metadata.tainted_browser_automation_target
      op: equals
      value: true
    - field: metadata.visual_context_capture
      op: equals
      value: true
    - field: metadata.credential_issuance
      op: equals
      value: true
    - field: metadata.tainted_credential_issuance_input
      op: equals
      value: true
    - field: metadata.visual_context_credential_issuance_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.local_file_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.env_secret_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.network_response_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.model_output_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.tool_output_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.rag_retrieval_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.accepts_url_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: visual_context_capture
    - field: metadata.authority_classes
      op: includes
      value: credential_issuance
    - field: metadata.authority_classes
      op: includes
      value: tainted_credential_issuance_input
    - field: metadata.authority_classes
      op: includes
      value: visual_context_credential_issuance_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_visual_context_capture
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_credential_issuance
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_credential_issuance_input
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_visual_context_credential_issuance_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - customer_id
        - target_url
        - subject_agent_id
        - credential_scope
        - audience
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine visual-context-to-credential handlers until screenshot and OCR-derived content cannot become signing material, grant material, token templates, impersonation material, subjects, scopes, audiences, or tenants; visual content is classified and redacted; credential subjects and scopes are allowlisted; broker credentials are least privilege; issued credentials are short-lived and audience-bound; and security-owner approval plus immutable audit provenance are required before visual context can mint credentials.
