id: AGENTCSP-TOOL-139
name: Network response written to prompt registry
description: A source-defined agent tool handler fetches a caller-selected URL, captures the response body, and publishes that network response into a prompt or instruction registry using runtime credentials and caller-selected prompt metadata.
category: network_response_prompt_registry_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0059 Data from Information Repositories
    - AML.T0060 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_external_network_call
      op: equals
      value: true
    - field: metadata.handler_tainted_network_destination
      op: equals
      value: true
    - field: metadata.handler_credentialed_network_read
      op: equals
      value: true
    - field: metadata.handler_prompt_registry_write
      op: equals
      value: true
    - field: metadata.handler_tainted_prompt_registry_payload
      op: equals
      value: true
    - field: metadata.handler_tainted_prompt_registry_selector
      op: equals
      value: true
    - field: metadata.handler_network_response_prompt_registry_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.tainted_network_destination
      op: equals
      value: true
    - field: metadata.credentialed_network_read
      op: equals
      value: true
    - field: metadata.prompt_registry_write
      op: equals
      value: true
    - field: metadata.tainted_prompt_registry_payload
      op: equals
      value: true
    - field: metadata.tainted_prompt_registry_selector
      op: equals
      value: true
    - field: metadata.network_response_prompt_registry_bridge
      op: equals
      value: true
    - field: metadata.accepts_url_input
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: tainted_network_destination
    - field: metadata.authority_classes
      op: includes
      value: credentialed_network_read
    - field: metadata.authority_classes
      op: includes
      value: prompt_registry_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_prompt_registry_payload
    - field: metadata.authority_classes
      op: includes
      value: tainted_prompt_registry_selector
    - field: metadata.authority_classes
      op: includes
      value: network_response_prompt_registry_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_network_destination
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_credentialed_network_read
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_prompt_registry_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_prompt_registry_payload
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_prompt_registry_selector
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_network_response_prompt_registry_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - target_url
        - prompt_id
        - prompt_role
        - prompt_namespace
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: publish
    - field: data_classes
      op: includes
      value: credential
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine network-response-to-prompt-registry handlers until fetched content is treated as untrusted, stripped of instructions and secrets, provenance-labeled, prompt IDs, roles, namespaces, and registry destinations are policy-owned, publication requires approval, and registry entries are signed, versioned, and auditable before future agent runs can load them.
