id: AGENTCSP-MEMORY-003
name: Persistent memory explicitly references privileged tool
description: A persisted memory surface contains instruction-like content and names a discovered privileged tool, creating a cross-session replay path from stored context to a specific agent-callable capability.
category: memory_poisoning
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
    - LLM08:2025 Vector and Embedding Weaknesses
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.2
match:
  object_type: memory
  where:
    - field: metadata.content_analyzed
      op: equals
      value: true
    - field: metadata.instruction_like_content
      op: equals
      value: true
    - field: metadata.tool_directive
      op: equals
      value: true
    - field: metadata.explicit_tool_reference
      op: equals
      value: true
    - field: metadata.referenced_privileged_tool_count
      op: gt
      value: 0
recommendation:
  control: quarantine
  text: Quarantine this memory record and require provenance review before future runs can replay it into the referenced privileged tool.
