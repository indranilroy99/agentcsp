id: AGENTCSP-MCP-009
name: MCP server inherits ambient secret environment
description: An MCP server exposes broad process environment passthrough across an external or third-party tool boundary, allowing ambient credentials to reach agent-callable server code.
category: mcp_environment_exposure
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: mcp_server
  where:
    - field: metadata.mcp_env_passthrough
      op: equals
      value: true
    - field: metadata.mcp_env_passthrough_all
      op: equals
      value: true
    - field: metadata.mcp_env_passthrough_secret_risk
      op: equals
      value: true
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
recommendation:
  control: deny
  text: Replace ambient environment inheritance with a least-privilege env allowlist, isolate MCP server credentials per server, and require approval before external or third-party MCP code can receive secret-bearing process environment.
