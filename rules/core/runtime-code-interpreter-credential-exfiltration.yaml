id: AGENTCSP-RUNTIME-081
name: Code interpreter can exfiltrate mounted credentials through networked execution
description: A code interpreter runs model-generated or untrusted code with network access, package installation, shell and filesystem authority, credential mounts, secret environment references, persisted outputs, and no approval gate.
category: code_interpreter_credential_exfiltration
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
    - LLM07:2025 System Prompt Leakage
  mitre_atlas:
    - AML.T0054 Command and Scripting Interpreter
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - GOVERN 1.5
    - MAP 5.1
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_code_interpreter_config
      op: equals
      value: true
    - field: metadata.agent_code_interpreter_enabled
      op: equals
      value: true
    - field: metadata.agent_code_interpreter_executes_model_code
      op: equals
      value: true
    - field: metadata.agent_code_interpreter_untrusted_input
      op: equals
      value: true
    - field: metadata.agent_code_interpreter_network_enabled
      op: equals
      value: true
    - field: metadata.agent_code_interpreter_package_install
      op: equals
      value: true
    - field: metadata.agent_code_interpreter_shell_access
      op: equals
      value: true
    - field: metadata.agent_code_interpreter_filesystem_access
      op: equals
      value: true
    - field: metadata.agent_code_interpreter_workspace_write
      op: equals
      value: true
    - field: metadata.agent_code_interpreter_output_capture
      op: equals
      value: true
    - field: metadata.agent_code_interpreter_output_persistence
      op: equals
      value: true
    - field: metadata.agent_code_interpreter_credential_mount
      op: equals
      value: true
    - field: metadata.agent_code_interpreter_secret_env_exposure
      op: equals
      value: true
    - field: metadata.agent_code_interpreter_approval_required
      op: equals
      value: false
    - field: metadata.agent_code_interpreter_mount_kinds
      op: contains_any
      value:
        - credential_path
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: deny
  text: Do not run untrusted or model-generated code in a network-enabled interpreter with credential mounts. Remove mounted credentials and secret environment references, disable network/package installation and shell access by default, make outputs ephemeral and redacted, and require a separately approved isolated job for exceptional execution.
