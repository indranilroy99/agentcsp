id: AGENTCSP-TOOL-058
name: Source tool handler feeds tool output into model prompt
description: A source-defined agent tool handler invokes a nested tool, captures the raw tool observation, and forwards that observation into a model-provider prompt using runtime credentials, allowing tool-output injection to steer follow-up model behavior.
category: tool_output_prompt_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_tool_invocation
      op: equals
      value: true
    - field: metadata.handler_model_provider_call
      op: equals
      value: true
    - field: metadata.handler_tool_output_prompt_bridge
      op: equals
      value: true
    - field: metadata.nested_tool_invocation
      op: equals
      value: true
    - field: metadata.model_provider_call
      op: equals
      value: true
    - field: metadata.tool_output_prompt_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.handler_model_visible_output
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: nested_tool_invocation
    - field: metadata.authority_classes
      op: includes
      value: model_provider_call
    - field: metadata.authority_classes
      op: includes
      value: tool_output_prompt_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tool_invocation
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_model_provider_call
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tool_output_prompt_bridge
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: send
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined tool-output-to-model bridges until nested tool observations are treated as tainted, sanitized and delimited before prompt use, isolated from privileged model prompts, and blocked from triggering follow-up model behavior without independent policy approval.
