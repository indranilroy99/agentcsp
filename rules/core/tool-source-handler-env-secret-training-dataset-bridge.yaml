id: AGENTCSP-TOOL-160
name: Source tool handler exports env secret into training data
description: A source-defined agent tool handler reads environment-backed secret material and writes it into an AI training, fine-tuning, eval, or model-improvement dataset.
category: env_secret_training_dataset_bridge
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM04:2025 Data and Model Poisoning
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0059 Data from Information Repositories
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.handler_training_dataset_export
      op: equals
      value: true
    - field: metadata.handler_env_secret_training_dataset_bridge
      op: equals
      value: true
    - field: metadata.training_dataset_export
      op: equals
      value: true
    - field: metadata.env_secret_training_dataset_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_training_dataset_bridge
      op: not_equals
      value: true
    - field: metadata.model_output_training_dataset_bridge
      op: not_equals
      value: true
    - field: metadata.network_response_training_dataset_bridge
      op: not_equals
      value: true
    - field: metadata.local_file_training_dataset_bridge
      op: not_equals
      value: true
    - field: metadata.tool_output_training_dataset_bridge
      op: not_equals
      value: true
    - field: metadata.visual_context_training_dataset_bridge
      op: not_equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_env_access
    - field: metadata.authority_classes
      op: includes
      value: training_dataset_export
    - field: metadata.authority_classes
      op: includes
      value: env_secret_training_dataset_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_env_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_training_dataset_export
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_env_secret_training_dataset_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - dataset
        - dataset_id
        - eval_set
        - eval_set_id
        - fine_tune_dataset
        - model_update_route
        - training_dataset
        - training_dataset_id
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: remember
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined env-secret-to-training-data bridges until runtime secrets cannot enter model-improvement corpora, dataset destinations are policy-owned, redaction and retention controls are enforced before export, customer or break-glass approval is recorded, and training credentials are scoped to approved non-secret datasets.
