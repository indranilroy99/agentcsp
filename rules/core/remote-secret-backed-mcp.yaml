id: AGENTCSP-MCP-003
maturity: stable
disposition: advisory
suppressibility: policy
support_tier: structured
name: Remote MCP server uses credential-backed access
description: A third-party remote MCP server is configured with auth headers or credential references, creating a high-impact path from agent context to an external tool boundary.
category: mcp_authority
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MANAGE 2.4
match:
  object_type: mcp_server
  where:
    - field: trust_level
      op: equals
      value: third_party
    - field: metadata.remote
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: external_reach
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Require explicit approval, least-privilege credentials, and a trusted MCP allowlist before enabling this remote server.
