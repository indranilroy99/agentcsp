id: AGENTCSP-TOOL-065
name: Source tool handler exports secret-manager output into training data
description: A source-defined agent tool handler reads a caller-selected secret-manager path and writes the returned secret material into an AI training, fine-tuning, eval, or model-improvement dataset using runtime credentials.
category: secret_manager_training_dataset_bridge
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM04:2025 Data and Model Poisoning
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_manager_access
      op: equals
      value: true
    - field: metadata.handler_tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.handler_training_dataset_export
      op: equals
      value: true
    - field: metadata.handler_secret_manager_training_dataset_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.secret_manager_access
      op: equals
      value: true
    - field: metadata.tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.training_dataset_export
      op: equals
      value: true
    - field: metadata.secret_manager_training_dataset_bridge
      op: equals
      value: true
    - field: metadata.external_write
      op: equals
      value: true
    - field: metadata.accepts_secret_like_input
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_access
    - field: metadata.authority_classes
      op: includes
      value: tainted_secret_manager_path
    - field: metadata.authority_classes
      op: includes
      value: training_dataset_export
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_training_dataset_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_secret_manager_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_training_dataset_export
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_training_dataset_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - dataset
        - dataset_id
        - eval_set
        - eval_set_id
        - fine_tune_dataset
        - model_update_route
        - training_dataset
        - training_dataset_id
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined secret-manager-to-training-data bridges until secret paths and dataset destinations are policy-owned, raw secret values are excluded from model-improvement corpora, redaction and retention controls are enforced before upload, customer or break-glass approval is recorded, and training credentials are scoped to approved non-secret datasets.
