id: AGENTCSP-RUNTIME-089
name: Training pipeline retains raw sensitive production traces
description: An AI training or fine-tuning pipeline uploads and retains raw untrusted prompts, completions, tool outputs, retrieval context, memory, browser context, PII, and secrets for model-update workflows while redaction is disabled, credential references are present, and approval is missing.
category: training_data_retention_boundary
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_ai_training_dataset_config
      op: equals
      value: true
    - field: metadata.ai_training_dataset_model_update_enabled
      op: equals
      value: true
    - field: metadata.ai_training_dataset_remote_upload
      op: equals
      value: true
    - field: metadata.ai_training_dataset_prompt_capture
      op: equals
      value: true
    - field: metadata.ai_training_dataset_completion_capture
      op: equals
      value: true
    - field: metadata.ai_training_dataset_tool_output_capture
      op: equals
      value: true
    - field: metadata.ai_training_dataset_retrieval_capture
      op: equals
      value: true
    - field: metadata.ai_training_dataset_memory_capture
      op: equals
      value: true
    - field: metadata.ai_training_dataset_browser_capture
      op: equals
      value: true
    - field: metadata.ai_training_dataset_secret_capture
      op: equals
      value: true
    - field: metadata.ai_training_dataset_pii_capture
      op: equals
      value: true
    - field: metadata.ai_training_dataset_untrusted_input
      op: equals
      value: true
    - field: metadata.ai_training_dataset_redaction_disabled
      op: equals
      value: true
    - field: metadata.ai_training_dataset_retention_enabled
      op: equals
      value: true
    - field: metadata.ai_training_dataset_approval_required
      op: equals
      value: false
    - field: metadata.ai_training_dataset_capture_categories
      op: contains_any
      value:
        - prompt_context
        - completion_context
        - tool_output
        - retrieval_context
        - memory_context
        - browser_context
        - pii_data
        - secret_material
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine raw production traces before model-update workflows, disable retention for unredacted prompts, completions, tool outputs, retrieval context, memory, browser context, PII, and secrets, require dataset review and approval before fine-tuning uploads, and separate production traces from training pipelines by default.
