id: AGENTCSP-TOOL-176
name: Source tool handler issues credentials from network responses
description: A source-defined agent tool handler fetches a caller-selected network destination and uses the response material to mint, sign, assume, impersonate, or issue agent credentials.
category: network_response_credential_issuance_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_external_network_call
      op: equals
      value: true
    - field: metadata.handler_tainted_network_destination
      op: equals
      value: true
    - field: metadata.handler_credential_issuance
      op: equals
      value: true
    - field: metadata.handler_tainted_credential_issuance_input
      op: equals
      value: true
    - field: metadata.handler_network_response_credential_issuance_bridge
      op: equals
      value: true
    - field: metadata.tainted_network_destination
      op: equals
      value: true
    - field: metadata.credential_issuance
      op: equals
      value: true
    - field: metadata.tainted_credential_issuance_input
      op: equals
      value: true
    - field: metadata.network_response_credential_issuance_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.local_file_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.env_secret_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.model_output_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.tool_output_credential_issuance_bridge
      op: equals
      value: false
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_url_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: network_access
    - field: metadata.authority_classes
      op: includes
      value: tainted_network_destination
    - field: metadata.authority_classes
      op: includes
      value: credential_issuance
    - field: metadata.authority_classes
      op: includes
      value: tainted_credential_issuance_input
    - field: metadata.authority_classes
      op: includes
      value: network_response_credential_issuance_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_network_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_network_destination
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_credential_issuance
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_credential_issuance_input
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_network_response_credential_issuance_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - target_url
        - credential_url
        - requested_subject
        - requested_scope
        - token_audience
        - requester_ticket
        - customer_id
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine network-response-to-credential issuance bridges until network destinations are policy-owned and allowlisted, response-derived values cannot become signing keys, token templates, grant material, subjects, scopes, roles, audiences, or impersonation selectors, runtime issuer credentials are least-privilege, issued credentials are short-lived and audience-bound, and security-owner approval plus audit provenance are required before credential issuance.
