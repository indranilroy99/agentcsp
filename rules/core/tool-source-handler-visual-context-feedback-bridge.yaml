id: AGENTCSP-TOOL-192
name: Source tool handler promotes authenticated visual context into feedback pipeline
description: A source-defined agent tool handler captures authenticated browser or screen visual context from a caller-selected target and promotes screenshot or OCR context into feedback, RLHF, eval, reward-model, or model-improvement pipelines using runtime credentials and caller-selected routing.
category: visual_context_feedback_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_browser_automation
      op: equals
      value: true
    - field: metadata.handler_tainted_browser_automation_target
      op: equals
      value: true
    - field: metadata.handler_visual_context_capture
      op: equals
      value: true
    - field: metadata.handler_feedback_pipeline_write
      op: equals
      value: true
    - field: metadata.handler_feedback_auto_promotion
      op: equals
      value: true
    - field: metadata.handler_tainted_feedback_routing
      op: equals
      value: true
    - field: metadata.handler_visual_context_feedback_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.browser_automation
      op: equals
      value: true
    - field: metadata.tainted_browser_automation_target
      op: equals
      value: true
    - field: metadata.visual_context_capture
      op: equals
      value: true
    - field: metadata.feedback_pipeline_write
      op: equals
      value: true
    - field: metadata.feedback_auto_promotion
      op: equals
      value: true
    - field: metadata.tainted_feedback_routing
      op: equals
      value: true
    - field: metadata.visual_context_feedback_bridge
      op: equals
      value: true
    - field: metadata.model_output_feedback_bridge
      op: equals
      value: false
    - field: metadata.tool_output_feedback_bridge
      op: equals
      value: false
    - field: metadata.secret_manager_feedback_bridge
      op: equals
      value: false
    - field: metadata.env_secret_feedback_bridge
      op: equals
      value: false
    - field: metadata.accepts_url_input
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: visual_context_capture
    - field: metadata.authority_classes
      op: includes
      value: feedback_pipeline_write
    - field: metadata.authority_classes
      op: includes
      value: feedback_auto_promotion
    - field: metadata.authority_classes
      op: includes
      value: tainted_feedback_routing
    - field: metadata.authority_classes
      op: includes
      value: visual_context_feedback_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_visual_context_capture
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_feedback_pipeline_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_feedback_auto_promotion
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_feedback_routing
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_visual_context_feedback_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - target_url
        - feedback_dataset_id
        - eval_set_id
        - promotion_target
        - reviewer_note_text
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: remember
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine visual-context feedback promotion until authenticated screenshots and OCR text cannot enter feedback, RLHF, eval, reward-model, or model-update pipelines without explicit data classification, customer-scoped redaction, allowlisted promotion targets, short retention, security-owner approval, and immutable provenance linking the captured page, policy decision, and promoted record.
