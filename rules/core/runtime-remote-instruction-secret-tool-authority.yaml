id: AGENTCSP-RUNTIME-103
name: Remote instruction refresh grants secret-backed tool authority
description: A remote instruction loader can auto-refresh unpinned system and developer instructions selected from untrusted context while those instructions grant browser, database, external-response, memory, and secret-manager authority without verification or approval.
category: agent_remote_instruction_secret_tool_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Supply Chain Vulnerabilities
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0018 Supply Chain Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_remote_instruction_loader_config
      op: equals
      value: true
    - field: metadata.agent_remote_instruction_provider
      op: equals
      value: remote_instruction_loader
    - field: metadata.agent_remote_instruction_remote
      op: equals
      value: true
    - field: metadata.agent_remote_instruction_system_role
      op: equals
      value: true
    - field: metadata.agent_remote_instruction_developer_role
      op: equals
      value: true
    - field: metadata.agent_remote_instruction_auto_refresh_enabled
      op: equals
      value: true
    - field: metadata.agent_remote_instruction_unpinned_reference
      op: equals
      value: true
    - field: metadata.agent_remote_instruction_signature_verification_disabled
      op: equals
      value: true
    - field: metadata.agent_remote_instruction_provenance_verification_missing
      op: equals
      value: true
    - field: metadata.agent_remote_instruction_untrusted_selector
      op: equals
      value: true
    - field: metadata.agent_remote_instruction_privileged_role_injection
      op: equals
      value: true
    - field: metadata.agent_remote_instruction_tool_authority_categories
      op: contains_any
      value:
        - browser_action
        - database_access
        - external_response
        - memory_write
        - secret_manager_access
    - field: metadata.agent_remote_instruction_privileged_tool_authority
      op: equals
      value: true
    - field: metadata.agent_remote_instruction_write_authority
      op: equals
      value: true
    - field: metadata.agent_remote_instruction_external_authority
      op: equals
      value: true
    - field: metadata.agent_remote_instruction_memory_write
      op: equals
      value: true
    - field: metadata.agent_remote_instruction_secret_access
      op: equals
      value: true
    - field: metadata.agent_remote_instruction_sensitive_context
      op: equals
      value: true
    - field: metadata.agent_remote_instruction_pii_context
      op: equals
      value: true
    - field: metadata.agent_remote_instruction_approval_required
      op: equals
      value: false
    - field: data_classes
      op: includes
      value: credential
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine remote instruction refresh until instruction revisions are pinned, signed, provenance-verified, selected only from trusted control-plane inputs, and reviewed before granting browser, database, external-response, memory, or secret-manager authority.
