id: AGENTCSP-TOOL-044
name: Source tool handler embeds caller content into vector memory
description: A source-defined agent tool handler sends caller or customer supplied content to an embedding provider with runtime credentials and persists the resulting vector into memory, RAG, or state storage.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0059 Data from Information Repositories
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_embedding_provider_call
      op: equals
      value: true
    - field: metadata.handler_tainted_embedding_input
      op: equals
      value: true
    - field: metadata.embedding_provider_call
      op: equals
      value: true
    - field: metadata.tainted_embedding_input
      op: equals
      value: true
    - field: metadata.handler_memory_write
      op: equals
      value: true
    - field: metadata.memory_write
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: embedding_provider_call
    - field: metadata.authority_classes
      op: includes
      value: tainted_embedding_input
    - field: metadata.authority_classes
      op: includes
      value: memory_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_embedding_provider_call
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_embedding_input
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_memory_write
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: remember
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined embedding and vector-write tools until embedding providers are approved, sensitive text is redacted before embedding, vector namespaces are tenant-scoped, provenance labels are mandatory, retention is bounded, and approval gates protect customer or prompt-like content before external embedding and durable vector persistence.
