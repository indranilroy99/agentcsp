id: AGENTCSP-RUNTIME-129
name: Tiny context window can force privileged instruction eviction
description: An agent context-window policy uses a very small token budget while prioritizing untrusted, tool-output, retrieval, or memory context over system, developer, and safety instructions before privileged tools run.
category: context_window_integrity
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_context_window_config
      op: equals
      value: true
    - field: metadata.agent_context_window_enabled
      op: equals
      value: true
    - field: metadata.agent_context_window_token_budget_low
      op: equals
      value: true
    - field: metadata.agent_context_window_truncation_enabled
      op: equals
      value: true
    - field: metadata.agent_context_window_untrusted_priority
      op: equals
      value: true
    - field: metadata.agent_context_window_tool_output_priority
      op: equals
      value: true
    - field: metadata.agent_context_window_memory_priority
      op: equals
      value: true
    - field: metadata.agent_context_window_privileged_instruction_eviction
      op: equals
      value: true
    - field: metadata.agent_context_window_safety_instruction_eviction
      op: equals
      value: true
    - field: metadata.agent_context_window_summary_verification_disabled
      op: equals
      value: true
    - field: metadata.agent_context_window_delimiter_disabled
      op: equals
      value: true
    - field: metadata.agent_context_window_redaction_disabled
      op: equals
      value: true
    - field: metadata.agent_context_window_privileged_tool_authority
      op: equals
      value: true
    - field: metadata.agent_context_window_secret_context
      op: equals
      value: true
    - field: metadata.agent_context_window_approval_required
      op: equals
      value: false
    - field: data_classes
      op: contains_any
      value:
        - credential
        - confidential
        - pii
    - field: actions
      op: contains_any
      value:
        - write
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Pin system, developer, and safety instructions outside the eviction window, reserve a minimum trusted-instruction budget, drop untrusted/tool/memory context first, verify summaries before replay, redact compacted context, and require approval before privileged tools run after low-budget truncation.
