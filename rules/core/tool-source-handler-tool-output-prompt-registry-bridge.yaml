id: AGENTCSP-TOOL-071
name: Source tool handler publishes tool output to prompt registry
description: A source-defined agent tool handler invokes a nested tool, captures the raw tool observation, and publishes that observation into a prompt or instruction registry using runtime credentials and caller-selected prompt metadata.
category: tool_output_prompt_registry_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0053 LLM Plugin Supply Chain Compromise
    - AML.T0059 Data from Information Repositories
    - AML.T0065 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_tool_invocation
      op: equals
      value: true
    - field: metadata.handler_prompt_registry_write
      op: equals
      value: true
    - field: metadata.handler_tool_output_prompt_registry_bridge
      op: equals
      value: true
    - field: metadata.handler_tainted_prompt_registry_payload
      op: equals
      value: true
    - field: metadata.handler_tainted_prompt_registry_selector
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.nested_tool_invocation
      op: equals
      value: true
    - field: metadata.prompt_registry_write
      op: equals
      value: true
    - field: metadata.tool_output_prompt_registry_bridge
      op: equals
      value: true
    - field: metadata.tainted_prompt_registry_payload
      op: equals
      value: true
    - field: metadata.tainted_prompt_registry_selector
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: nested_tool_invocation
    - field: metadata.authority_classes
      op: includes
      value: prompt_registry_write
    - field: metadata.authority_classes
      op: includes
      value: tool_output_prompt_registry_bridge
    - field: metadata.authority_classes
      op: includes
      value: tainted_prompt_registry_payload
    - field: metadata.authority_classes
      op: includes
      value: tainted_prompt_registry_selector
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tool_invocation
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_prompt_registry_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tool_output_prompt_registry_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_prompt_registry_payload
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_prompt_registry_selector
    - field: metadata.schema_properties
      op: contains_any
      value:
        - target_tool_name
        - tool_request_body
        - prompt_id
        - prompt_role
        - registry_namespace
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: publish
    - field: data_classes
      op: contains_any
      value:
        - credential
        - confidential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined tool-output-to-prompt-registry bridges until nested tool observations are treated as tainted, raw observations are blocked from system and developer prompt registry content, prompt IDs, roles, and namespaces are policy-owned, registry writes are reviewed, version-pinned, rollbackable, and audited, and approval is required before persisted prompt changes can affect agents.
