id: AGENTCSP-RUNTIME-005
name: Runtime auto-approves release package script
description: An agent runtime configuration auto-approves a package script with release, publish, deploy, or push authority while credential key names are exposed, creating a concrete path from agent-controlled shell permissions to external state changes.
category: runtime_posture
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0054 Command and Scripting Interpreter
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - GOVERN 1.5
    - MANAGE 2.3
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_runtime_config
      op: equals
      value: true
    - field: metadata.auto_approved_release_package_script_bridge
      op: equals
      value: true
    - field: metadata.secret_env_exposure
      op: equals
      value: true
    - field: metadata.approval_bypass
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Remove auto-approval for release or deploy package scripts, scope credentials, and require explicit approval before agent runtime permissions can trigger external state changes.
