id: AGENTCSP-TOOL-096
name: Source tool handler injects retrieved RAG context into browser automation
description: A source-defined agent tool handler retrieves caller-selected RAG or vector content and injects the raw retrieved chunks into caller-selected authenticated browser automation targets, allowing retrieved prompt-injection or sensitive context to drive signed-in web actions.
category: rag_retrieval_browser_automation_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_rag_retrieval
      op: equals
      value: true
    - field: metadata.handler_tainted_rag_retrieval_query
      op: equals
      value: true
    - field: metadata.handler_browser_automation
      op: equals
      value: true
    - field: metadata.handler_tainted_browser_automation_target
      op: equals
      value: true
    - field: metadata.handler_rag_retrieval_browser_automation_bridge
      op: equals
      value: true
    - field: metadata.rag_retrieval
      op: equals
      value: true
    - field: metadata.tainted_rag_retrieval_query
      op: equals
      value: true
    - field: metadata.browser_automation
      op: equals
      value: true
    - field: metadata.tainted_browser_automation_target
      op: equals
      value: true
    - field: metadata.rag_retrieval_browser_automation_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.accepts_url_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: rag_retrieval
    - field: metadata.authority_classes
      op: includes
      value: tainted_rag_retrieval_query
    - field: metadata.authority_classes
      op: includes
      value: browser_automation
    - field: metadata.authority_classes
      op: includes
      value: tainted_browser_automation_target
    - field: metadata.authority_classes
      op: includes
      value: rag_retrieval_browser_automation_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_rag_retrieval
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_rag_retrieval_query
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_browser_automation
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_browser_automation_target
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_rag_retrieval_browser_automation_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - retrieval_query_text
        - query
        - search_query
    - field: metadata.schema_properties
      op: contains_any
      value:
        - retrieval_namespace
        - vector_namespace
        - collection
        - collection_name
        - index_name
    - field: metadata.schema_properties
      op: contains_any
      value:
        - target_url
        - form_selector
        - submit_selector
        - browser_selector
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: send
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine retrieved-context-to-browser automation bridges until retrieval selectors and browser targets are policy-owned or allowlisted, retrieved chunks carry provenance and trust labels, authenticated browser sessions are task-scoped, sensitive context is stripped before form submission or script execution, and approval is required before retrieved content can drive signed-in web actions.
