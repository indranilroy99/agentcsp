id: AGENTCSP-SUPPLYCHAIN-002
name: Agent deployment uses mutable remote image with privileged runtime
description: An agent workload deployment pulls a mutable remote container image while running with privileged host authority, host mounts, credentials, and no approval gate.
category: agent_supply_chain
severity: critical
maps_to:
  owasp:
    - LLM05:2025 Supply Chain Vulnerabilities
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0010 Supply Chain Compromise
    - AML.T0054 Command and Scripting Interpreter
  nist_ai_rmf:
    - GOVERN 1.5
    - MAP 5.1
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_deployment_config
      op: equals
      value: true
    - field: metadata.agent_deployment_agent_workload
      op: equals
      value: true
    - field: metadata.agent_deployment_remote_image
      op: equals
      value: true
    - field: metadata.agent_deployment_unpinned_image
      op: equals
      value: true
    - field: metadata.agent_deployment_pull_policy_always
      op: equals
      value: true
    - field: metadata.agent_deployment_privileged_container
      op: equals
      value: true
    - field: metadata.agent_deployment_host_mount
      op: equals
      value: true
    - field: metadata.agent_deployment_secret_env_exposure
      op: equals
      value: true
    - field: metadata.agent_deployment_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Pin agent deployment images by digest, disable pull-on-every-start for production agents, remove privileged host mounts and root execution, scope service accounts tightly, and require approval before unverified images can run with credentialed host authority.
