id: AGENTCSP-RUNTIME-097
name: Feedback pipeline auto-promotes raw agent context to training
description: A feedback or RLHF pipeline captures raw prompts, completions, tool outputs, retrieval context, memory, browser context, PII, and secrets from untrusted sources, then auto-promotes the retained data into training, eval, or model-update paths without consent, redaction, or approval.
category: ai_feedback_auto_promotion_retention
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_ai_feedback_pipeline_config
      op: equals
      value: true
    - field: metadata.ai_feedback_collection_enabled
      op: equals
      value: true
    - field: metadata.ai_feedback_remote_export
      op: equals
      value: true
    - field: metadata.ai_feedback_prompt_capture
      op: equals
      value: true
    - field: metadata.ai_feedback_completion_capture
      op: equals
      value: true
    - field: metadata.ai_feedback_tool_output_capture
      op: equals
      value: true
    - field: metadata.ai_feedback_retrieval_capture
      op: equals
      value: true
    - field: metadata.ai_feedback_memory_capture
      op: equals
      value: true
    - field: metadata.ai_feedback_browser_capture
      op: equals
      value: true
    - field: metadata.ai_feedback_secret_capture
      op: equals
      value: true
    - field: metadata.ai_feedback_sensitive_capture
      op: equals
      value: true
    - field: metadata.ai_feedback_pii_capture
      op: equals
      value: true
    - field: metadata.ai_feedback_untrusted_input
      op: equals
      value: true
    - field: metadata.ai_feedback_training_promotion_enabled
      op: equals
      value: true
    - field: metadata.ai_feedback_model_update_enabled
      op: equals
      value: true
    - field: metadata.ai_feedback_eval_set_write
      op: equals
      value: true
    - field: metadata.ai_feedback_redaction_disabled
      op: equals
      value: true
    - field: metadata.ai_feedback_consent_required
      op: equals
      value: false
    - field: metadata.ai_feedback_retention_enabled
      op: equals
      value: true
    - field: metadata.ai_feedback_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine feedback records that contain raw prompts, completions, tool outputs, retrieval context, memory, browser context, PII, or secrets; disable automatic training, eval, and model-policy promotion until redaction, consent, dataset review, and approval controls pass.
