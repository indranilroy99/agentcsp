id: AGENTCSP-RUNTIME-113
name: Public reasoning state can hydrate future privileged prompts
description: A public or shared reasoning-state store captures untrusted scratchpad, prompt, retrieval, memory, tool-observation, PII, and secret context, then replays that state into future planner or system-prompt context without redaction, access controls, or approval.
category: reasoning_state_prompt_replay
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_reasoning_state_config
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_enabled
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_capture_enabled
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_untrusted_input
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_remote
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_shared
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_public_access
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_replay_enabled
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_planner_uses_state
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_system_prompt_injection
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_secret_capture
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_pii_capture
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_redaction_disabled
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_access_control_disabled
      op: equals
      value: true
    - field: metadata.agent_reasoning_state_approval_required
      op: equals
      value: false
    - field: metadata.agent_reasoning_state_capture_categories
      op: contains_any
      value:
        - reasoning_trace
    - field: metadata.agent_reasoning_state_capture_categories
      op: contains_any
      value:
        - tool_observation
    - field: metadata.agent_reasoning_state_capture_categories
      op: contains_any
      value:
        - prompt_context
    - field: metadata.agent_reasoning_state_capture_categories
      op: contains_any
      value:
        - secret_material
    - field: data_classes
      op: contains_any
      value:
        - secret
    - field: data_classes
      op: contains_any
      value:
        - pii
    - field: actions
      op: contains_any
      value:
        - publish
    - field: actions
      op: contains_any
      value:
        - remember
    - field: actions
      op: contains_any
      value:
        - write
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine public or shared reasoning-state replay until scratchpads are private and ephemeral, system/developer prompt hydration is disabled, captured prompts, tool observations, memory, retrieval context, PII, and secrets are redacted, access controls and tenant isolation are enforced, and approval is required before reasoning state can hydrate future privileged agent runs.
