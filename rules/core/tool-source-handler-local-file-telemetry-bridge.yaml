id: AGENTCSP-TOOL-147
name: Local file content exported to telemetry
description: A source-defined agent tool handler reads a caller-selected local file path and exports the file material into telemetry, tracing, logging, or observability systems using runtime credentials and caller-selected trace routing.
category: local_file_telemetry_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_filesystem_read
      op: equals
      value: true
    - field: metadata.handler_tainted_filesystem_path
      op: equals
      value: true
    - field: metadata.handler_telemetry_export
      op: equals
      value: true
    - field: metadata.handler_tainted_telemetry_payload
      op: equals
      value: true
    - field: metadata.handler_local_file_telemetry_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.telemetry_export
      op: equals
      value: true
    - field: metadata.tainted_telemetry_payload
      op: equals
      value: true
    - field: metadata.local_file_telemetry_bridge
      op: equals
      value: true
    - field: metadata.tainted_filesystem_path
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: filesystem_read
    - field: metadata.authority_classes
      op: includes
      value: tainted_filesystem_path
    - field: metadata.authority_classes
      op: includes
      value: telemetry_export
    - field: metadata.authority_classes
      op: includes
      value: tainted_telemetry_payload
    - field: metadata.authority_classes
      op: includes
      value: local_file_telemetry_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_filesystem_read
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_filesystem_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_telemetry_export
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_telemetry_payload
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_local_file_telemetry_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - local_file_path
        - workspace_path
        - trace_session_id
        - telemetry_project
        - trace_goal_text
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: publish
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine local-file-to-telemetry handlers until local file reads are allowlisted, file contents are classified and redacted before trace export, telemetry projects and sessions are policy-owned, observability credentials are least privilege, trace retention and viewer access are bounded, and approval plus audit provenance are required before file material enters telemetry systems.
