id: AGENTCSP-TOOL-099
name: Source tool handler persists authenticated visual context to memory
description: A source-defined agent tool handler captures authenticated browser or screen visual context from a caller-selected target and persists that screenshot or OCR context into durable memory, RAG, vector, or state storage using runtime credentials and a caller-selected memory scope.
category: visual_context_memory_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
    - LLM08:2025 Vector and Embedding Weaknesses
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_browser_automation
      op: equals
      value: true
    - field: metadata.handler_tainted_browser_automation_target
      op: equals
      value: true
    - field: metadata.handler_visual_context_capture
      op: equals
      value: true
    - field: metadata.handler_memory_write
      op: equals
      value: true
    - field: metadata.handler_tainted_memory_scope
      op: equals
      value: true
    - field: metadata.handler_visual_context_memory_bridge
      op: equals
      value: true
    - field: metadata.browser_automation
      op: equals
      value: true
    - field: metadata.tainted_browser_automation_target
      op: equals
      value: true
    - field: metadata.visual_context_capture
      op: equals
      value: true
    - field: metadata.memory_write
      op: equals
      value: true
    - field: metadata.tainted_memory_scope
      op: equals
      value: true
    - field: metadata.visual_context_memory_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_url_input
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: visual_context_capture
    - field: metadata.authority_classes
      op: includes
      value: memory_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_memory_scope
    - field: metadata.authority_classes
      op: includes
      value: visual_context_memory_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_visual_context_capture
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_memory_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_memory_scope
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_visual_context_memory_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - target_url
        - page_url
        - browser_url
    - field: metadata.schema_properties
      op: contains_any
      value:
        - memory_namespace
        - memory_scope
        - namespace
        - collection
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: remember
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined visual-context memory bridges until browser targets and memory scopes are policy-owned or allowlisted, screenshots and OCR text are classified and redacted before persistence, memory entries carry provenance and expiration, replay into future agent context is gated, and approval is required before authenticated visual context can be stored.
