id: AGENTCSP-TOOL-004
maturity: stable
disposition: advisory
suppressibility: policy
support_tier: structured
name: Tool schema exposes destructive filesystem authority
description: A tool schema accepts path-like input and performs destructive action, creating a high-impact path if untrusted context controls tool arguments.
category: tool_schema_authority
severity: high
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0054 Command and Scripting Interpreter
  nist_ai_rmf:
    - MAP 4.1
    - MANAGE 2.3
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.destructive_action
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Require approval and path allowlists before untrusted context can influence destructive filesystem tool arguments.
