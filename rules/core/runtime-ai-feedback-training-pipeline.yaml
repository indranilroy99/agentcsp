id: AGENTCSP-RUNTIME-044
name: AI feedback pipeline promotes untrusted sensitive context to training
description: A feedback, review, or RLHF pipeline collects untrusted agent interactions and promotes sensitive context into training, evaluation, or model-update paths without redaction or approval.
category: ai_feedback_training
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_ai_feedback_pipeline_config
      op: equals
      value: true
    - field: metadata.ai_feedback_remote_export
      op: equals
      value: true
    - field: metadata.ai_feedback_training_promotion_enabled
      op: equals
      value: true
    - field: metadata.ai_feedback_sensitive_capture
      op: equals
      value: true
    - field: metadata.ai_feedback_redaction_disabled
      op: equals
      value: true
    - field: metadata.ai_feedback_untrusted_input
      op: equals
      value: true
    - field: metadata.ai_feedback_approval_required
      op: equals
      value: false
    - field: data_classes
      op: contains_any
      value:
        - credential
        - confidential
        - pii
recommendation:
  control: redact
  text: Redact prompts, completions, tool traces, retrieval context, memory, PII, and secrets before collecting feedback; keep untrusted feedback out of training or eval promotion until consent, approval, and dataset review gates pass.
