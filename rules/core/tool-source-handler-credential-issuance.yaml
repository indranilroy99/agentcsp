id: AGENTCSP-TOOL-025
name: Source tool handler issues credentials from caller-controlled context
description: A source-defined agent tool handler mints, signs, brokers, assumes, or impersonates credentials using caller or model supplied subject, scope, role, audience, or customer context, creating a direct path from untrusted context into credential authority.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_credential_issuance
      op: equals
      value: true
    - field: metadata.credential_issuance
      op: equals
      value: true
    - field: metadata.accepts_secret_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: credential_issuance
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_credential_issuance
    - field: actions
      op: includes
      value: send
    - field: side_effect
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined credential issuers until caller or model supplied subject, scope, role, audience, and customer context cannot mint or impersonate credentials without explicit policy, approval, least-privilege scope binding, short-lived issuance, and auditable provenance outside the agent runtime.
