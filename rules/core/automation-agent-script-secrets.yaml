id: AGENTCSP-AUTOMATION-002
name: Automation runs agent script with secrets and write authority
description: A scheduled, manually dispatched, or externally dispatched workflow runs an agent package script while using secrets and write permissions, creating unattended agent authority with privileged credentials.
category: automation_authority
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - GOVERN 1.5
    - MANAGE 2.4
    - MANAGE 4.1
match:
  object_type: automation
  where:
    - field: metadata.agent_run_command
      op: equals
      value: true
    - field: metadata.agent_package_script_bridge
      op: equals
      value: true
    - field: metadata.write_permissions
      op: equals
      value: true
    - field: metadata.mentions_secrets_context
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Require approval before unattended workflows can run agent package scripts with secrets and write authority, and split agent execution from privileged credentials where possible.
