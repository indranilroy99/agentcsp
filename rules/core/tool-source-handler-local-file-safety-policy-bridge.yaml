id: AGENTCSP-TOOL-175
name: Source tool handler weakens safety policy from local files
description: A source-defined agent tool handler reads a caller-selected local file and uses the file material to update guardrail, approval, moderation, or safety policy while weakening enforcement.
category: local_file_safety_policy_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_filesystem_read
      op: equals
      value: true
    - field: metadata.handler_tainted_filesystem_path
      op: equals
      value: true
    - field: metadata.handler_safety_policy_write
      op: equals
      value: true
    - field: metadata.handler_tainted_safety_policy_payload
      op: equals
      value: true
    - field: metadata.handler_tainted_safety_policy_selector
      op: equals
      value: true
    - field: metadata.handler_safety_policy_weakening
      op: equals
      value: true
    - field: metadata.handler_local_file_safety_policy_bridge
      op: equals
      value: true
    - field: metadata.tainted_filesystem_path
      op: equals
      value: true
    - field: metadata.safety_policy_write
      op: equals
      value: true
    - field: metadata.tainted_safety_policy_payload
      op: equals
      value: true
    - field: metadata.tainted_safety_policy_selector
      op: equals
      value: true
    - field: metadata.safety_policy_weakening
      op: equals
      value: true
    - field: metadata.local_file_safety_policy_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_safety_policy_bridge
      op: equals
      value: false
    - field: metadata.env_secret_safety_policy_bridge
      op: equals
      value: false
    - field: metadata.network_response_safety_policy_bridge
      op: equals
      value: false
    - field: metadata.model_output_safety_policy_bridge
      op: equals
      value: false
    - field: metadata.tool_output_safety_policy_bridge
      op: equals
      value: false
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: filesystem_access
    - field: metadata.authority_classes
      op: includes
      value: tainted_filesystem_path
    - field: metadata.authority_classes
      op: includes
      value: safety_policy_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_safety_policy_payload
    - field: metadata.authority_classes
      op: includes
      value: tainted_safety_policy_selector
    - field: metadata.authority_classes
      op: includes
      value: safety_policy_weakening
    - field: metadata.authority_classes
      op: includes
      value: local_file_safety_policy_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_filesystem_read
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_filesystem_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_safety_policy_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_safety_policy_payload
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_safety_policy_selector
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_safety_policy_weakening
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_local_file_safety_policy_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - local_file_path
        - workspace_path
        - override_reason
        - policy_id
        - target_control_id
        - policy_mode
        - customer_id
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine local-file-to-safety-policy bridges until caller-selected files cannot enter guardrail or approval-policy payloads, policy targets are allowlisted outside caller context, default-allow or approval-off modes are rejected deterministically, runtime policy credentials are least-privilege, and safety-policy writes require separate security-owner approval with provenance.
