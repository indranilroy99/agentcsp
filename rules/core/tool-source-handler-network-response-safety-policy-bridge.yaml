id: AGENTCSP-TOOL-174
name: Source tool handler weakens safety policy from network responses
description: A source-defined agent tool handler fetches a caller-selected network destination and uses the response material to update guardrail, approval, moderation, or safety policy while weakening enforcement.
category: network_response_safety_policy_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_external_network_call
      op: equals
      value: true
    - field: metadata.handler_tainted_network_destination
      op: equals
      value: true
    - field: metadata.handler_safety_policy_write
      op: equals
      value: true
    - field: metadata.handler_tainted_safety_policy_payload
      op: equals
      value: true
    - field: metadata.handler_tainted_safety_policy_selector
      op: equals
      value: true
    - field: metadata.handler_safety_policy_weakening
      op: equals
      value: true
    - field: metadata.handler_network_response_safety_policy_bridge
      op: equals
      value: true
    - field: metadata.tainted_network_destination
      op: equals
      value: true
    - field: metadata.safety_policy_write
      op: equals
      value: true
    - field: metadata.tainted_safety_policy_payload
      op: equals
      value: true
    - field: metadata.tainted_safety_policy_selector
      op: equals
      value: true
    - field: metadata.safety_policy_weakening
      op: equals
      value: true
    - field: metadata.network_response_safety_policy_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_safety_policy_bridge
      op: equals
      value: false
    - field: metadata.env_secret_safety_policy_bridge
      op: equals
      value: false
    - field: metadata.model_output_safety_policy_bridge
      op: equals
      value: false
    - field: metadata.tool_output_safety_policy_bridge
      op: equals
      value: false
    - field: metadata.accepts_url_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: network_access
    - field: metadata.authority_classes
      op: includes
      value: tainted_network_destination
    - field: metadata.authority_classes
      op: includes
      value: safety_policy_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_safety_policy_payload
    - field: metadata.authority_classes
      op: includes
      value: tainted_safety_policy_selector
    - field: metadata.authority_classes
      op: includes
      value: safety_policy_weakening
    - field: metadata.authority_classes
      op: includes
      value: network_response_safety_policy_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_network_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_network_destination
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_safety_policy_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_safety_policy_payload
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_safety_policy_selector
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_safety_policy_weakening
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_network_response_safety_policy_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - target_url
        - status_endpoint_url
        - override_reason
        - policy_id
        - target_control_id
        - policy_mode
        - customer_id
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine network-response-to-safety-policy bridges until network destinations are policy-owned and allowlisted, response-derived values cannot enter guardrail or approval-policy payloads, default-allow or approval-off modes are rejected deterministically, runtime policy credentials are least-privilege, and safety-policy writes require separate security-owner approval with provenance.
