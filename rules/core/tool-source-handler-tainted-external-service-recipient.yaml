id: AGENTCSP-TOOL-037
name: Source tool handler sends to caller-selected external recipient
description: A source-defined agent tool handler passes a caller-selected channel, recipient, destination, or webhook into an external messaging, collaboration, issue-tracker, or SaaS SDK write, allowing model-reachable context to choose where customer content is published.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_external_service_write
      op: equals
      value: true
    - field: metadata.handler_tainted_external_service_recipient
      op: equals
      value: true
    - field: metadata.external_service_write
      op: equals
      value: true
    - field: metadata.tainted_external_service_recipient
      op: equals
      value: true
    - field: metadata.external_write
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: external_service_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_external_service_recipient
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_external_service_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_external_service_recipient
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: publish
    - field: side_effect
      op: equals
      value: true
    - field: external_reach
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined external-service writers that pass caller-selected recipients into SDK writes until recipients are resolved by policy outside the model path, constrained to reviewed allowlists, and every external publication of customer content requires approval with audited service credentials.
