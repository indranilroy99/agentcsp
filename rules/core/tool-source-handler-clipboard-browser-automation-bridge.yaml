id: AGENTCSP-TOOL-202
name: Source tool handler pastes clipboard contents into authenticated browser
description: A source-defined agent tool handler reads browser or desktop clipboard material and pastes copied text into authenticated browser automation at a caller-selected target.
category: clipboard_browser_automation_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_clipboard_read
      op: equals
      value: true
    - field: metadata.handler_browser_automation
      op: equals
      value: true
    - field: metadata.handler_tainted_browser_automation_target
      op: equals
      value: true
    - field: metadata.handler_clipboard_browser_automation_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.clipboard_read
      op: equals
      value: true
    - field: metadata.browser_automation
      op: equals
      value: true
    - field: metadata.tainted_browser_automation_target
      op: equals
      value: true
    - field: metadata.clipboard_browser_automation_bridge
      op: equals
      value: true
    - field: metadata.accepts_url_input
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: clipboard_read
    - field: metadata.authority_classes
      op: includes
      value: browser_automation
    - field: metadata.authority_classes
      op: includes
      value: tainted_browser_automation_target
    - field: metadata.authority_classes
      op: includes
      value: clipboard_browser_automation_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_clipboard_read
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_browser_automation
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_browser_automation_target
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_clipboard_browser_automation_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - customer_id
        - target_url
        - form_selector
        - submit_selector
        - clipboard_browser_reason_text
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine clipboard-to-browser automation handlers until clipboard material is treated as untrusted, browser destinations and selectors are policy-owned, authenticated browser profiles are isolated from sensitive sessions, pasted data is classified and minimized, and human approval plus audit evidence are required before copied desktop or browser content can be submitted through authenticated web sessions.
