id: AGENTCSP-RUNTIME-109
name: Model-only safety review releases secret-backed tool authority
description: An enabled agent safety policy relies on prompt-only, LLM-judge, self-review, or post-hoc model review while deterministic pre-tool controls are missing and untrusted context can reach database, browser, external-response, and secret-manager authority without approval.
category: agent_safety_model_only_secret_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0054 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_safety_config
      op: equals
      value: true
    - field: metadata.agent_safety_controls_declared
      op: equals
      value: true
    - field: metadata.agent_safety_controls_disabled
      op: equals
      value: false
    - field: metadata.agent_safety_model_only_enforcement
      op: equals
      value: true
    - field: metadata.agent_safety_model_only_categories
      op: includes
      value: prompt_only_policy
    - field: metadata.agent_safety_model_only_categories
      op: includes
      value: llm_judge
    - field: metadata.agent_safety_model_only_categories
      op: includes
      value: self_review
    - field: metadata.agent_safety_model_only_categories
      op: includes
      value: post_hoc_review
    - field: metadata.agent_safety_pre_tool_enforcement_missing
      op: equals
      value: true
    - field: metadata.agent_safety_deterministic_policy_missing
      op: equals
      value: true
    - field: metadata.agent_safety_post_hoc_only
      op: equals
      value: true
    - field: metadata.agent_safety_untrusted_input
      op: equals
      value: true
    - field: metadata.agent_safety_privileged_tool_authority
      op: equals
      value: true
    - field: metadata.agent_safety_tool_authority_categories
      op: includes
      value: database_access
    - field: metadata.agent_safety_tool_authority_categories
      op: includes
      value: browser_action
    - field: metadata.agent_safety_tool_authority_categories
      op: includes
      value: external_response
    - field: metadata.agent_safety_tool_authority_categories
      op: includes
      value: secret_manager_access
    - field: metadata.agent_safety_write_authority
      op: equals
      value: true
    - field: metadata.agent_safety_external_authority
      op: equals
      value: true
    - field: metadata.agent_safety_secret_exposure
      op: equals
      value: true
    - field: metadata.agent_safety_sensitive_data
      op: equals
      value: true
    - field: metadata.agent_safety_pii_data
      op: equals
      value: true
    - field: metadata.agent_safety_approval_required
      op: equals
      value: false
    - field: data_classes
      op: includes
      value: credential
    - field: data_classes
      op: includes
      value: secret
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: publish
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine model-only safety review for privileged agents until deterministic pre-tool policy, schema validation, and allowlist enforcement run outside the model; require independent approval before secret-manager, database, browser, or external-response tools can execute.
