id: AGENTCSP-TOOL-038
name: Source tool handler passes caller SQL into database API
description: A source-defined agent tool handler passes caller-controlled SQL, query text, statement text, or derived update input into a database query or execute API, creating a direct path from model-reachable input to mutable application data.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.3
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_database_query
      op: equals
      value: true
    - field: metadata.handler_database_write
      op: equals
      value: true
    - field: metadata.handler_tainted_database_query_argument
      op: equals
      value: true
    - field: metadata.database_write
      op: equals
      value: true
    - field: metadata.tainted_database_query_argument
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: database_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_database_query_argument
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_database_query
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_database_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_database_query_argument
    - field: metadata.schema_properties
      op: contains_any
      value:
        - query
        - query_text
        - raw_sql
        - record_update
        - sql
        - sql_query
        - statement
        - update_fields
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: write
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined database tools that pass caller-controlled SQL or query text into database APIs until the tool exposes only reviewed parameterized operations, rejects free-form statements, uses least-privilege credentials, and requires approval for every mutation.
