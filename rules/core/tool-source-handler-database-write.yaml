id: AGENTCSP-TOOL-016
name: Source tool handler executes database writes from tool arguments
description: A source-defined agent tool handler executes database query authority while exposing SQL or record-update tool inputs, creating a concrete path from model-controlled arguments to mutable application data.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.3
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_database_query
      op: equals
      value: true
    - field: metadata.handler_database_write
      op: equals
      value: true
    - field: metadata.database_write
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: database_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_database_write
    - field: metadata.schema_properties
      op: contains_any
      value:
        - account_id
        - customer_email
        - customer_id
        - query
        - query_text
        - raw_sql
        - record_update
        - sql
        - sql_query
        - statement
        - update_fields
    - field: actions
      op: includes
      value: write
    - field: side_effect
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine source-defined database write tools until raw SQL and free-form update inputs are removed, mutations are restricted to reviewed parameterized operations, least-privilege database credentials are used, and approval gates protect every record change.
