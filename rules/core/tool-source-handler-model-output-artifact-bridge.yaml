id: AGENTCSP-TOOL-125
name: Source tool handler exports model output to public artifacts
description: A source-defined agent tool handler calls a model provider, extracts model output, and writes that output into public or shareable artifact storage using runtime credentials and caller-selected artifact routing.
category: model_output_artifact_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
    - AML.T0059 Data from Information Repositories
    - AML.T0060 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_model_provider_call
      op: equals
      value: true
    - field: metadata.handler_artifact_export
      op: equals
      value: true
    - field: metadata.handler_tainted_artifact_export_payload
      op: equals
      value: true
    - field: metadata.handler_model_output_artifact_bridge
      op: equals
      value: true
    - field: metadata.handler_public_artifact_destination
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.model_provider_call
      op: equals
      value: true
    - field: metadata.artifact_export
      op: equals
      value: true
    - field: metadata.tainted_artifact_export_payload
      op: equals
      value: true
    - field: metadata.model_output_artifact_bridge
      op: equals
      value: true
    - field: metadata.public_artifact_destination
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: model_provider_call
    - field: metadata.authority_classes
      op: includes
      value: artifact_export
    - field: metadata.authority_classes
      op: includes
      value: tainted_artifact_export_payload
    - field: metadata.authority_classes
      op: includes
      value: model_output_artifact_bridge
    - field: metadata.authority_classes
      op: includes
      value: public_artifact_destination
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_model_provider_call
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_artifact_export
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_artifact_export_payload
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_model_output_artifact_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_public_artifact_destination
    - field: metadata.schema_properties
      op: contains_any
      value:
        - artifact_bucket
        - artifact_goal_text
        - customer_ticket_text
        - model_name
        - object_key
        - share_mode
    - field: metadata.external_write
      op: equals
      value: true
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: actions
      op: includes
      value: publish
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine model-output-to-artifact handlers until model responses are classified and redacted before storage, public access is denied by default, artifact destinations are policy-owned and allowlisted, prompt-injected content cannot select storage routing, and scoped artifact-write credentials plus approval are required for generated content export.
