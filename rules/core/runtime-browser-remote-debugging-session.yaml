id: AGENTCSP-RUNTIME-023
name: Authenticated browser session exposes remote debugging control
description: A browser-agent configuration enables remote debugging while reusing authenticated browser state, cookie or storage files, and credential references, creating a direct session-control path outside normal tool approval boundaries.
category: browser_session_authority
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0054 Command and Scripting Interpreter
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_browser_session_config
      op: equals
      value: true
    - field: metadata.browser_authenticated_session
      op: equals
      value: true
    - field: metadata.browser_remote_debugging
      op: equals
      value: true
    - field: metadata.browser_path_references_redacted
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: deny
  text: Disable browser remote debugging for authenticated agent sessions, bind debugging endpoints only in isolated development sandboxes, rotate exposed session credentials, and use short-lived task-scoped browser profiles.
