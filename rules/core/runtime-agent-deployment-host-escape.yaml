id: AGENTCSP-RUNTIME-084
name: Agent deployment grants host escape authority to the AI workload
description: An agent workload deployment runs as a privileged root container with host networking, Docker socket or host mounts, credential mounts, service-account authority, secret-backed environment variables, and no approval gate.
category: agent_deployment_host_escape
severity: critical
maps_to:
  owasp:
    - LLM05:2025 Supply Chain Vulnerabilities
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0010 Supply Chain Compromise
    - AML.T0054 Command and Scripting Interpreter
  nist_ai_rmf:
    - GOVERN 1.5
    - MAP 5.1
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_deployment_config
      op: equals
      value: true
    - field: metadata.agent_deployment_agent_workload
      op: equals
      value: true
    - field: metadata.agent_deployment_privileged_container
      op: equals
      value: true
    - field: metadata.agent_deployment_root_user
      op: equals
      value: true
    - field: metadata.agent_deployment_host_network
      op: equals
      value: true
    - field: metadata.agent_deployment_host_mount
      op: equals
      value: true
    - field: metadata.agent_deployment_credential_mount
      op: equals
      value: true
    - field: metadata.agent_deployment_secret_env_exposure
      op: equals
      value: true
    - field: metadata.agent_deployment_service_account_redacted
      op: equals
      value: true
    - field: metadata.agent_deployment_approval_required
      op: equals
      value: false
    - field: metadata.agent_deployment_mount_kinds
      op: contains_any
      value:
        - docker_socket
        - host_path
    - field: secret_exposure
      op: equals
      value: true
    - field: untrusted_to_privileged
      op: equals
      value: true
recommendation:
  control: deny
  text: Deny production agent workloads that run privileged, as root, with host networking, Docker socket access, host credential mounts, or broad service-account authority. Remove host mounts, use non-root read-only containers, isolate credentials, and require approval before privileged deployment changes.
