id: AGENTCSP-TOOL-049
name: Source tool handler delegates customer context to remote agent
description: A source-defined agent tool handler delegates caller or customer context to a caller-selected remote agent using runtime credentials, creating an agent-to-agent trust-boundary bypass.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_agent_delegation
      op: equals
      value: true
    - field: metadata.handler_tainted_agent_delegation_target
      op: equals
      value: true
    - field: metadata.handler_agent_delegation_context_forwarding
      op: equals
      value: true
    - field: metadata.agent_delegation
      op: equals
      value: true
    - field: metadata.tainted_agent_delegation_target
      op: equals
      value: true
    - field: metadata.agent_delegation_context_forwarding
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_url_input
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: agent_delegation
    - field: metadata.authority_classes
      op: includes
      value: tainted_agent_delegation_target
    - field: metadata.authority_classes
      op: includes
      value: agent_delegation_context_forwarding
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_agent_delegation
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_agent_delegation_target
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_agent_delegation_context_forwarding
    - field: actions
      op: includes
      value: execute
    - field: actions
      op: includes
      value: send
    - field: secret_exposure
      op: equals
      value: true
    - field: external_reach
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined remote-agent delegation wrappers until agent targets are resolved by policy outside model context, remote peers are allowlisted and identity-verified, forwarded context is classified and redacted, credentials are scoped per peer, and approval is required before delegated agents can receive customer, tool-output, browser, retrieval, memory, or secret-bearing context.
