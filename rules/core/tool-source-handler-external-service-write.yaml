id: AGENTCSP-TOOL-029
name: Source tool handler posts customer content through external service SDK
description: A source-defined agent tool handler sends caller or customer supplied content through a collaboration, messaging, email, issue-tracker, or SaaS SDK client, creating an externally visible side effect from model-reachable input.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_external_service_write
      op: equals
      value: true
    - field: metadata.external_service_write
      op: equals
      value: true
    - field: metadata.external_write
      op: equals
      value: true
    - field: metadata.accepts_content_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: external_service_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_external_service_write
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: publish
    - field: side_effect
      op: equals
      value: true
    - field: external_reach
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined external-service writers until destinations, recipients, scopes, and payload classes are policy-checked outside the model path, customer content is redacted or approved before send, and high-impact writes require human approval with audited service credentials.
