id: AGENTCSP-MCP-006
name: Credential-backed remote MCP uses plaintext transport
description: A remote MCP server is configured over plaintext HTTP while using auth headers or credential references, exposing agent-callable authority and credentials across an unencrypted tool boundary.
category: mcp_transport_security
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: mcp_server
  where:
    - field: metadata.remote
      op: equals
      value: true
    - field: metadata.plaintext_remote_transport
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: external_reach
      op: equals
      value: true
recommendation:
  control: deny
  text: Require TLS for remote MCP transports, rotate any exposed credentials, and block credential-backed remote MCP servers until encrypted transport and trusted endpoint ownership are verified.
