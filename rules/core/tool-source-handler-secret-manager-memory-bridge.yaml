id: AGENTCSP-TOOL-064
name: Source tool handler persists secret-manager output into memory
description: A source-defined agent tool handler reads a caller-selected secret-manager path and persists the returned secret material into memory, vector, RAG, or state storage using runtime credentials.
category: secret_manager_memory_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_manager_access
      op: equals
      value: true
    - field: metadata.handler_tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.handler_memory_write
      op: equals
      value: true
    - field: metadata.handler_tainted_memory_scope
      op: equals
      value: true
    - field: metadata.handler_secret_manager_memory_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.secret_manager_access
      op: equals
      value: true
    - field: metadata.tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.memory_write
      op: equals
      value: true
    - field: metadata.tainted_memory_scope
      op: equals
      value: true
    - field: metadata.secret_manager_memory_bridge
      op: equals
      value: true
    - field: metadata.accepts_secret_like_input
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_access
    - field: metadata.authority_classes
      op: includes
      value: tainted_secret_manager_path
    - field: metadata.authority_classes
      op: includes
      value: memory_write
    - field: metadata.authority_classes
      op: includes
      value: tainted_memory_scope
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_memory_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_secret_manager_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_memory_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_memory_scope
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_memory_bridge
    - field: metadata.schema_properties
      op: contains_any
      value:
        - collection
        - collection_name
        - index_name
        - memory_key
        - memory_namespace
        - memory_scope
        - namespace
        - tenant_id
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: remember
    - field: actions
      op: includes
      value: write
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined secret-manager-to-memory bridges until secret paths and memory namespaces are policy-owned, raw secret values are never persisted into replayable agent memory, retention is bounded, secrets are redacted before storage, and any break-glass persistence requires independent approval and audit evidence outside the agent path.
