id: AGENTCSP-TOOL-035
name: Source tool handler passes caller path to filesystem API
description: A source-defined agent tool handler passes a path-like tool argument or a value derived from it into a local filesystem read, write, or delete API, creating a direct path from model-controlled arguments to local file access.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.accepts_path_input
      op: equals
      value: true
    - field: metadata.handler_tainted_filesystem_path
      op: equals
      value: true
    - field: metadata.tainted_filesystem_path
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: tainted_filesystem_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_filesystem_path
    - field: metadata.handler_authority_classes
      op: contains_any
      value:
        - handler_filesystem_read
        - handler_filesystem_write
        - handler_filesystem_delete
    - field: actions
      op: contains_any
      value:
        - read
        - write
        - delete
recommendation:
  control: quarantine
  text: Quarantine source-defined filesystem tools that pass caller-controlled paths into local file APIs until every path is constrained to reviewed allowlists, sensitive and ignored paths are denied, file output is redacted, destructive operations require approval, and execution runs inside a sandboxed workspace.
