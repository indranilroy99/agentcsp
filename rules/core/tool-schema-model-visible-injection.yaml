id: AGENTCSP-TOOL-011
name: Tool description contains prompt-injection instructions
description: A model-visible tool description contains instruction-override and untrusted-context bridge signals while the tool itself has external write authority, creating a path for tool metadata to steer agent behavior before invocation.
category: tool_schema_prompt_injection
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.3
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.model_visible_description_instruction_override
      op: equals
      value: true
    - field: metadata.model_visible_description_context_bridge_privileged
      op: equals
      value: true
    - field: metadata.external_write
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Treat model-visible tool descriptions as untrusted prompt surface, remove instruction-like text from descriptions, and require review before exposing the tool to agents with external or state-changing authority.
