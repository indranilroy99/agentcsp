id: AGENTCSP-TOOL-013
name: Source tool handler sends externally with secret-backed authority
description: A source-defined agent tool handler reads credential-bearing environment material while sending tool input externally, creating a concrete path for model-controlled data to leave the agent boundary with runtime secret authority.
category: tool_source_handler_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.handler_external_write
      op: equals
      value: true
    - field: metadata.external_write
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_external_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_env_access
    - field: metadata.authority_classes
      op: contains_any
      value:
        - content_input
        - customer_data_input
        - pii_input
recommendation:
  control: require_approval
  text: Require human approval, destination allowlists, scoped runtime credentials, and output redaction before this source-defined tool can send model-controlled or customer data externally with env-backed authority.
