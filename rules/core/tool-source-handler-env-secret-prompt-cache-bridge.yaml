id: AGENTCSP-TOOL-159
name: Source tool handler persists env secret into prompt cache
description: A source-defined agent tool handler reads environment-backed secret material and persists it into a prompt, LLM, response, or semantic cache.
category: env_secret_prompt_cache_bridge
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
    - LLM08:2025 Vector and Embedding Weaknesses
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.handler_prompt_cache_write
      op: equals
      value: true
    - field: metadata.handler_env_secret_prompt_cache_bridge
      op: equals
      value: true
    - field: metadata.prompt_cache_write
      op: equals
      value: true
    - field: metadata.env_secret_prompt_cache_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_prompt_cache_bridge
      op: not_equals
      value: true
    - field: metadata.model_output_prompt_cache_bridge
      op: not_equals
      value: true
    - field: metadata.network_response_prompt_cache_bridge
      op: not_equals
      value: true
    - field: metadata.local_file_prompt_cache_bridge
      op: not_equals
      value: true
    - field: metadata.tool_output_prompt_cache_bridge
      op: not_equals
      value: true
    - field: metadata.clipboard_prompt_cache_bridge
      op: not_equals
      value: true
    - field: metadata.visual_context_prompt_cache_bridge
      op: not_equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_env_access
    - field: metadata.authority_classes
      op: includes
      value: prompt_cache_write
    - field: metadata.authority_classes
      op: includes
      value: env_secret_prompt_cache_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_env_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_prompt_cache_write
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_env_secret_prompt_cache_bridge
    - field: actions
      op: includes
      value: remember
    - field: actions
      op: includes
      value: write
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined env-secret-to-prompt-cache bridges until runtime secrets cannot enter prompt, LLM, response, or semantic caches; classify and redact cache payloads before persistence; enforce tenant isolation, bounded TTL, replay restrictions, and independent approval for any credential-bearing cache write.
