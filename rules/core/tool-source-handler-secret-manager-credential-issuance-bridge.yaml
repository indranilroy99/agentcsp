id: AGENTCSP-TOOL-074
name: Source tool handler issues credentials from secrets
description: A source-defined agent tool handler reads caller-selected secret-manager material and uses the returned secret-derived value to mint, sign, assume, impersonate, or issue agent credentials.
category: secret_manager_credential_issuance_bridge
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Plugin Compromise
    - AML.T0056 LLM Trusted Boundary Compromise
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_manager_access
      op: equals
      value: true
    - field: metadata.handler_tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.handler_credential_issuance
      op: equals
      value: true
    - field: metadata.handler_tainted_credential_issuance_input
      op: equals
      value: true
    - field: metadata.handler_secret_manager_credential_issuance_bridge
      op: equals
      value: true
    - field: metadata.secret_manager_access
      op: equals
      value: true
    - field: metadata.tainted_secret_manager_path
      op: equals
      value: true
    - field: metadata.credential_issuance
      op: equals
      value: true
    - field: metadata.tainted_credential_issuance_input
      op: equals
      value: true
    - field: metadata.secret_manager_credential_issuance_bridge
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.accepts_secret_like_input
      op: equals
      value: true
    - field: metadata.accepts_customer_data_input
      op: equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_access
    - field: metadata.authority_classes
      op: includes
      value: tainted_secret_manager_path
    - field: metadata.authority_classes
      op: includes
      value: credential_issuance
    - field: metadata.authority_classes
      op: includes
      value: tainted_credential_issuance_input
    - field: metadata.authority_classes
      op: includes
      value: secret_manager_credential_issuance_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_secret_manager_path
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_credential_issuance
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_tainted_credential_issuance_input
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_manager_credential_issuance_bridge
    - field: actions
      op: includes
      value: read
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: write
    - field: data_classes
      op: contains_any
      value:
        - confidential
        - credential
        - pii
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined secret-to-credential issuance bridges until secret-manager outputs cannot become signing keys, token templates, subjects, scopes, roles, audiences, or impersonation material, runtime broker credentials are least-privilege, issued credentials are short-lived, and security-owner approval is required before credential issuance.
