id: AGENTCSP-MEMORY-002
name: Memory content persists instruction-like tool directive
description: A persisted memory surface contains instruction-like content that can steer future tool use, creating cross-session contamination risk.
category: memory_poisoning
severity: high
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM06:2025 Excessive Agency
    - LLM08:2025 Vector and Embedding Weaknesses
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
  nist_ai_rmf:
    - MAP 5.1
    - MANAGE 2.2
match:
  object_type: memory
  where:
    - field: metadata.content_analyzed
      op: equals
      value: true
    - field: metadata.instruction_like_content
      op: equals
      value: true
    - field: metadata.memory_write_directive
      op: equals
      value: true
    - field: metadata.tool_directive
      op: equals
      value: true
recommendation:
  control: quarantine
  text: Quarantine this memory record and require provenance review before it can be retrieved or reused across runs.
