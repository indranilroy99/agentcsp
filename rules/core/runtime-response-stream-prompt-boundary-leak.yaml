id: AGENTCSP-RUNTIME-091
name: Public response stream leaks privileged prompts and tool arguments
description: A public anonymous response stream exposes reasoning traces, system and developer prompts, raw tool outputs, and tool arguments under broad CORS while redaction and approval are disabled.
category: response_stream_prompt_boundary_leak
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_agent_response_exposure_config
      op: equals
      value: true
    - field: metadata.agent_response_exposure_enabled
      op: equals
      value: true
    - field: metadata.agent_response_exposure_public_endpoint
      op: equals
      value: true
    - field: metadata.agent_response_exposure_anonymous_access
      op: equals
      value: true
    - field: metadata.agent_response_exposure_auth_disabled
      op: equals
      value: true
    - field: metadata.agent_response_exposure_cors_broad
      op: equals
      value: true
    - field: metadata.agent_response_exposure_streaming_enabled
      op: equals
      value: true
    - field: metadata.agent_response_exposure_reasoning_visible
      op: equals
      value: true
    - field: metadata.agent_response_exposure_system_prompt_visible
      op: equals
      value: true
    - field: metadata.agent_response_exposure_developer_prompt_visible
      op: equals
      value: true
    - field: metadata.agent_response_exposure_tool_output_visible
      op: equals
      value: true
    - field: metadata.agent_response_exposure_tool_argument_visible
      op: equals
      value: true
    - field: metadata.agent_response_exposure_retrieval_visible
      op: equals
      value: true
    - field: metadata.agent_response_exposure_memory_visible
      op: equals
      value: true
    - field: metadata.agent_response_exposure_secret_context_visible
      op: equals
      value: true
    - field: metadata.agent_response_exposure_redaction_disabled
      op: equals
      value: true
    - field: metadata.agent_response_exposure_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: deny
  text: Disable public streaming of system prompts, developer prompts, reasoning traces, raw tool outputs, and tool arguments. Require authentication, restrict CORS, redact internal prompt and tool-call material, and require approval before any privileged prompt or tool boundary detail can leave the runtime.
