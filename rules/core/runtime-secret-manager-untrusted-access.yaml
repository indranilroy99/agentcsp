id: AGENTCSP-RUNTIME-013
name: Agent secret manager grants untrusted credential access
description: A secret manager connector allows untrusted or retrieved context to read or enumerate sensitive secrets and inject them into agent tools without approval, creating a direct credential-broker path from indirect prompt injection to privileged actions.
category: secret_manager_authority
severity: critical
maps_to:
  owasp:
    - LLM01:2025 Prompt Injection
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0051 LLM Prompt Injection
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_secret_manager_config
      op: equals
      value: true
    - field: metadata.secret_manager_read_enabled
      op: equals
      value: true
    - field: metadata.secret_manager_broad_scope
      op: equals
      value: true
    - field: metadata.secret_manager_injects_into_tools
      op: equals
      value: true
    - field: metadata.secret_manager_untrusted_input
      op: equals
      value: true
    - field: metadata.secret_manager_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: require_approval
  text: Require approval before secret retrieval, remove list/broad secret scopes from agent-facing credentials, split secret reads by task, and block untrusted context from selecting secret paths or injecting secret values into tools.
