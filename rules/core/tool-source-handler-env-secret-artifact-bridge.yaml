id: AGENTCSP-TOOL-162
name: Source tool handler exports env secret into public artifact
description: A source-defined agent tool handler reads environment-backed secret material and writes it into public or shareable artifact, report, or run-output storage.
category: env_secret_artifact_bridge
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM05:2025 Improper Output Handling
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0059 Data from Information Repositories
    - AML.T0057 Exfiltration via Cyber Means
  nist_ai_rmf:
    - MAP 4.1
    - MEASURE 2.7
    - MANAGE 2.4
match:
  object_type: tool
  where:
    - field: metadata.parsed_tool_schema
      op: equals
      value: true
    - field: metadata.source_tool_handler_redacted
      op: equals
      value: true
    - field: metadata.handler_body_analyzed
      op: equals
      value: true
    - field: metadata.handler_secret_env_access
      op: equals
      value: true
    - field: metadata.handler_artifact_export
      op: equals
      value: true
    - field: metadata.handler_env_secret_artifact_bridge
      op: equals
      value: true
    - field: metadata.handler_public_artifact_destination
      op: equals
      value: true
    - field: metadata.artifact_export
      op: equals
      value: true
    - field: metadata.env_secret_artifact_bridge
      op: equals
      value: true
    - field: metadata.public_artifact_destination
      op: equals
      value: true
    - field: metadata.secret_manager_artifact_bridge
      op: not_equals
      value: true
    - field: metadata.model_output_artifact_bridge
      op: not_equals
      value: true
    - field: metadata.network_response_artifact_bridge
      op: not_equals
      value: true
    - field: metadata.local_file_artifact_bridge
      op: not_equals
      value: true
    - field: metadata.tool_output_artifact_bridge
      op: not_equals
      value: true
    - field: metadata.visual_context_artifact_bridge
      op: not_equals
      value: true
    - field: metadata.authority_classes
      op: includes
      value: secret_env_access
    - field: metadata.authority_classes
      op: includes
      value: artifact_export
    - field: metadata.authority_classes
      op: includes
      value: env_secret_artifact_bridge
    - field: metadata.authority_classes
      op: includes
      value: public_artifact_destination
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_secret_env_access
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_artifact_export
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_env_secret_artifact_bridge
    - field: metadata.handler_authority_classes
      op: includes
      value: handler_public_artifact_destination
    - field: metadata.schema_properties
      op: contains_any
      value:
        - artifact_bucket
        - artifact_url
        - bucket
        - destination
        - object_key
        - public_access
        - share_mode
    - field: actions
      op: includes
      value: send
    - field: actions
      op: includes
      value: publish
    - field: actions
      op: includes
      value: write
    - field: external_reach
      op: equals
      value: true
    - field: secret_exposure
      op: equals
      value: true
    - field: side_effect
      op: equals
      value: true
    - field: reversible
      op: equals
      value: false
recommendation:
  control: quarantine
  text: Quarantine source-defined env-secret-to-artifact bridges until runtime secrets cannot enter artifact bodies, exported artifacts are private by default, public/shareable links require explicit approval, artifact retention and viewer access are bounded, and artifact storage credentials are scoped to non-secret outputs.
