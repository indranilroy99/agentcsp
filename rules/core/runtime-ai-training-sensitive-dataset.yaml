id: AGENTCSP-RUNTIME-028
name: AI training dataset captures sensitive agent context without redaction
description: An AI training, fine-tuning, distillation, or feedback dataset configuration uploads sensitive agent context to a model-update workflow while redaction and approval are disabled.
category: training_data_boundary
severity: critical
maps_to:
  owasp:
    - LLM02:2025 Sensitive Information Disclosure
    - LLM06:2025 Excessive Agency
  mitre_atlas:
    - AML.T0057 Exfiltration via Cyber Means
    - AML.T0059 Data from Information Repositories
  nist_ai_rmf:
    - MAP 5.1
    - MEASURE 2.9
    - MANAGE 2.4
match:
  object_type: runtime_config
  where:
    - field: metadata.parsed_ai_training_dataset_config
      op: equals
      value: true
    - field: metadata.ai_training_dataset_model_update_enabled
      op: equals
      value: true
    - field: metadata.ai_training_dataset_remote_upload
      op: equals
      value: true
    - field: metadata.ai_training_dataset_sensitive_capture
      op: equals
      value: true
    - field: metadata.ai_training_dataset_redaction_disabled
      op: equals
      value: true
    - field: metadata.ai_training_dataset_untrusted_input
      op: equals
      value: true
    - field: metadata.ai_training_dataset_approval_required
      op: equals
      value: false
    - field: secret_exposure
      op: equals
      value: true
recommendation:
  control: redact
  text: Keep agent training and fine-tuning datasets behind an explicit approval gate, remove raw prompts, retrieval context, memory, tool outputs, PII, and secrets before upload, and separate production agent traces from model-update pipelines by default.
