name: Detection quality report
description: Report a false positive, false negative, or unclear finding.
title: "detection: "
labels:
  - detection
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: AGENTCSP-RUNTIME-001
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result type
      options:
        - False positive
        - False negative
        - Severity disagreement
        - Confidence disagreement
        - Evidence or recommendation problem
    validations:
      required: true
  - type: textarea
    id: normalized
    attributes:
      label: Sanitized normalized evidence
      description: Include relevant object type, boolean fields, categories, and paths. Do not include raw values or content.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why the result is incorrect
      description: Explain the actual trust boundary, authority, and control state.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I used synthetic or sanitized data and removed all sensitive values.
          required: true
