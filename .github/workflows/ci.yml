name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm lint

      - name: Verify exported schemas
        run: pnpm verify:schemas

      - name: Verify CI examples
        run: pnpm verify:ci-examples

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify package artifacts
        run: pnpm verify:packages

      - name: Audit moderate and above vulnerabilities
        run: pnpm audit --audit-level moderate

      - name: Verify fixture outputs
        run: pnpm verify:fixtures

      - name: Upload AgentCSP SARIF
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: examples/vulnerable-agent/.agentcsp/agentcsp.sarif
          category: agentcsp
